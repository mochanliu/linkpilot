    var nd = doc ? undNodeOf(doc, ep.node_id) : null;
    var h = '<b class="mono">' + esc(ep.serial || ("node-" + ep.node_id)) + "</b>";
    if (ep.overlay) h += ' <span class="mono muted">' + esc(ep.overlay) + "</span>";
    h += '<div class="muted" style="font-size:12px">' + esc(ep.iface || "端口未知") + " · " +
      (ep.addr ? '<span class="mono">' + esc(ep.addr) + "</span>" : "无外层地址") + "</div>";
    if (ep.port) h += '<div class="muted" style="font-size:12px">UDP <span class="mono">' + esc(ep.port) + "</span></div>";
    if (ep.addr && nd && !nd.observed_addr) {
      h += '<div><span class="tag pending">手填 · 设备未上报观测</span></div>';
    } else if (ep.addr && !ep.matches_observation) {
      h += '<div><span class="tag stale">与当前观测不同</span></div>';
    }
    return h;
  }

  function undPathText(t) {
    if (t.path_error) {
      return '<span class="tag revoked">模板失效</span><div class="muted" style="font-size:12px">' + esc(t.path_error) + "</div>";
    }
    if (!t.path) return '<span class="tag">直连</span>';
    var p = t.path;
    return '<span class="tag plan">经中转</span> <span class="mono">' +
      esc(p.serial || ("node-" + p.node_id)) + "</span>" +
      (p.addr ? ' <span class="mono muted">' + esc(p.addr) + "</span>" : "") +
      '<div class="muted" style="font-size:12px">' +
      (p.template_name ? "模板 " + esc(p.template_name) : "inline 中转") + "</div>";
  }

  function undMTUCell(t, doc) {
    if (!t.mtu_is_default && t.mtu) return '<span class="num">' + esc(t.mtu) + "</span>";
    if (doc && doc.default_tunnel_mtu) {
      return '<span class="tag pending">未知</span><div class="muted" style="font-size:12px">投递用默认 ' +
        esc(doc.default_tunnel_mtu) + "</div>";
    }
    // The topology document does not carry the default, so it says default
    // without a number rather than implying one.
    return '<span class="tag pending">未知</span><div class="muted" style="font-size:12px">按默认 MTU 投递</div>';
  }

  function undStateTag(note) {
    return '<span class="tag pending" title="' + esc(note || "") + '">未知</span>';
  }

  function undPlanResult(doc, u) {
    var a = u.auto;
    if (!a) return "";
    var p = a.plan;
    var h = '<div class="subcard"><div class="subhead"><b>' +
      (a.applied ? "已创建" : "预览结果") + "</b><span class=\"sp\">" +
      p.pairs + " 对设备 · 新增 " + p.add.length + " 条 · 跳过 " + p.skip.length +
      " 对 · overlay /32 用 " + p.usage.overlay_used + (a.applied ? "" : " → " + p.overlay_after) +
      " / " + p.usage.overlay_total + "</span></div>";
    if (p.add.length) {
      h += "<table style=\"margin-top:10px\"><thead><tr><th>本端</th><th>对端</th><th>路径</th><th>MTU</th></tr></thead><tbody>";
      p.add.forEach(function (t) {
        h += "<tr><td>" + undEndpointCell(t.a, doc) + "</td><td>" + undEndpointCell(t.b, doc) + "</td>" +
          "<td>" + undPathText(t) + "</td><td>" + undMTUCell(t, doc) + "</td></tr>";
      });
      h += "</tbody></table>";
    } else {
      h += '<div class="empty">这一批没有可新建的隧道。</div>';
    }
    if (p.skip.length) {
      h += "<table style=\"margin-top:10px\"><thead><tr><th>跳过</th><th>原因</th></tr></thead><tbody>";
      p.skip.forEach(function (s) {
        h += "<tr><td>" + esc(s.serial_a || ("node-" + s.a)) + " ↔ " + esc(s.serial_b || ("node-" + s.b)) +
          '</td><td class="muted">' + esc(s.reason) + "</td></tr>";
      });
      h += "</tbody></table>";
    }
    if (!a.applied && p.add.length) {
      h += '<div style="margin-top:10px"><button class="small primary" data-act="und-auto-apply">按预览创建 ' +
        p.add.length + " 条隧道</button></div>";
    }
    return h + "</div>";
  }

  function undAutoPreview(form) {
    var u = S.und;
    if (!u || !u.doc) return;
    var f = new FormData(form);
    u.autoMode = String(f.get("mode") || "full-mesh");
    u.autoHub = Number(f.get("hub") || 0);
    u.autoSpoke = String(f.get("spoke") || "none");
    if (u.autoSel.length < 2) { toast("至少勾选 2 台设备"); return; }
    var req = { nodes: u.autoSel.slice(), mode: u.autoMode, hub: u.autoHub, spoke_mode: u.autoSpoke };
    api("POST", "/api/underlay/auto/plan", req).then(function (res) {
      u.auto = { plan: res.plan, applied: false, req: req };
      u.note = null;
      render();
    }).catch(function (err) {
      u.auto = null;
      u.note = undErrNote(err);
      render();
    });
  }

  function undAutoApply() {
    var u = S.und, a = u && u.auto;
    if (!a || !a.req) { toast("先预览一次"); return; }
    var p = a.plan;
    if (!confirm("按预览创建 " + p.add.length + " 条隧道、跳过 " + p.skip.length + " 对？\n\n" +
      "端口与 overlay /32 按预览分配；已有隧道的设备对不会重复创建。")) return;
    api("POST", "/api/underlay/auto/apply", a.req).then(function (res) {
      u.auto = { plan: res.plan, applied: true, req: a.req };
      u.note = { kind: "", text: "已创建 " + res.plan.add.length + " 条隧道，跳过 " + res.plan.skip.length + " 对。" };
      undSetDoc(res.underlay);
      toast("已写入 " + res.plan.add.length + " 条隧道");
    }).catch(function (err) {
      u.note = undErrNote(err);
      render();
    });
  }

  function undManualPanel(doc, u) {
    var mode = u.mPath || "direct";
    var a = undNodeOf(doc, u.mA) ? u.mA : (doc.nodes[0] ? doc.nodes[0].node_id : 0);
    var b = undNodeOf(doc, u.mB) ? u.mB : (doc.nodes[1] ? doc.nodes[1].node_id : 0);
    return '<section class="panel"><header><h2>手动创建</h2>' +
      '<span class="muted" style="font-size:12.5px">一台对一台；端口与 overlay /32 由分配器给</span></header>' +
      '<form id="und-tun-form"><div class="fields">' +
      '<div class="field"><label for="und-tun-a">本端设备</label>' +
      '<select id="und-tun-a" name="a" data-und-dev="a">' + undNodeOptions(doc.nodes, a, null) + "</select></div>" +
      '<div class="field"><label for="und-tun-a-iface">本端物理端口</label>' +
      '<select id="und-tun-a-iface" name="a_iface">' + undIfaceOptions(undNodeOf(doc, a), "") + "</select></div>" +
      '<div class="field"><label for="und-tun-a-addr">本端外层地址（留空用观测）</label>' +
      '<input id="und-tun-a-addr" name="a_addr" placeholder="ip 或 ip:port"></div>' +
      '<div class="field"><label for="und-tun-b">对端设备</label>' +
      '<select id="und-tun-b" name="b" data-und-dev="b">' + undNodeOptions(doc.nodes, b, null) + "</select></div>" +
      '<div class="field"><label for="und-tun-b-iface">对端物理端口</label>' +
      '<select id="und-tun-b-iface" name="b_iface">' + undIfaceOptions(undNodeOf(doc, b), "") + "</select></div>" +
      '<div class="field"><label for="und-tun-b-addr">对端外层地址（留空用观测）</label>' +
      '<input id="und-tun-b-addr" name="b_addr" placeholder="ip 或 ip:port"></div>' +
      '<div class="field"><label for="und-tun-pathmode">路径</label>' +
      '<select id="und-tun-pathmode">' + undPathModeOptions(mode) + "</select></div>" +
      undPathExtraFields(doc, mode, "und-tun") +
      "</div>" +
      '<div class="hint" style="margin:10px 0 0">物理端口可以留「默认」，由设备上报的出口决定；也可以指定它上报过的其他端口。' +
      "地址留空就用反射器最近一次观测到的外层地址；观测过期时创建会被拒绝，需要手填地址或等设备重新上报。" +
      "两端不能都是对称 NAT；中转设备不能是隧道的一端。</div>" +
      '<div style="margin-top:10px"><button class="primary" type="submit">创建隧道</button></div>' +
      "</form></section>";
  }

  function undTunnelPathMode(t) {
    if (!t.path) return "direct";
    return t.path.template_id ? "template" : "inline";
  }

  function undTunnelOf(doc, id) {
    for (var i = 0; i < doc.tunnels.length; i++) if (doc.tunnels[i].id === id) return doc.tunnels[i];
    return null;
  }

  function undTunnelTable(doc) {
    var h = '<section class="panel"><header><h2>已创建的隧道</h2>' +
      '<span class="muted" style="font-size:12.5px">' + doc.tunnels.length + " 条</span></header>";
    if (!doc.tunnels.length) {
      return h + '<div class="empty">还没有隧道。' +
        (doc.configured ? "用上面的自动编排或手动表单创建。" : "先发布全局配置。") + "</div></section>";
    }
    h += "<table><thead><tr><th>本端</th><th>对端</th><th>路径</th><th>MTU</th><th>状态</th><th></th></tr></thead><tbody>";
    doc.tunnels.forEach(function (t) {
      h += "<tr>" +
        "<td>" + undEndpointCell(t.a, doc) + "</td>" +
        "<td>" + undEndpointCell(t.b, doc) + "</td>" +
        "<td>" + undPathText(t) + "</td>" +
        "<td>" + undMTUCell(t, doc) + "</td>" +
        "<td>" + undStateTag(doc.state_note) +
        '<div class="muted" style="font-size:12px">' + esc(t.id) + " · " + esc(clock(t.created_at_unix)) + "</div></td>" +
        '<td class="row-actions">' +
        '<button class="small" data-act="und-tun-edit" data-id="' + esc(t.id) + '">编辑</button>' +
        '<button class="small danger" data-act="und-tun-del" data-id="' + esc(t.id) + '">删除</button>' +
        "</td></tr>";
    });
    return h + "</tbody></table></section>";
  }

  function undCreateTunnel(form) {
    var u = S.und;
    if (!u || !u.doc) return;
    var f = new FormData(form);
    var a = Number(f.get("a")), b = Number(f.get("b"));
    if (!a || !b || a === b) { toast("选两台不同的设备"); return; }
    var body = {
      a: { node_id: a, iface: String(f.get("a_iface") || "").trim(), addr: String(f.get("a_addr") || "").trim() },
      b: { node_id: b, iface: String(f.get("b_iface") || "").trim(), addr: String(f.get("b_addr") || "").trim() }
    };
    var mode = u.mPath || "direct";
    if (mode === "inline") {
      var relay = Number(f.get("relay") || 0);
      if (!relay) { toast("选择中转设备"); return; }
      body.path = {
        node_id: relay,
        addr: String(f.get("relay_addr") || "").trim(),
        save_as: String(f.get("save_as") || "").trim()
      };
    } else if (mode === "template") {
      var tpl = String(f.get("template") || "");
      if (!tpl) { toast("选择路径模板"); return; }
      body.path = { template_id: tpl };
    }
    api("POST", "/api/underlay/tunnels", body).then(function (res) {
      u.mPath = "direct";
      u.note = { kind: "", text: "隧道 " + res.tunnel.id + " 已创建（" +
        (res.tunnel.path ? "经 " + (res.tunnel.path.serial || ("node-" + res.tunnel.path.node_id)) + " 中转" : "直连") +
        "）；隧道段随心跳下发：开着 -tunnels 的设备下一轮心跳会拉走并把结果回报到设备表的「隧道下发」列。" };
      releaseForm(form);
      undSetDoc(res.underlay);
      toast("隧道已创建");
    }).catch(function (err) {
      u.note = undErrNote(err);
      render();
    });
  }

  function undTunnelEditor(doc, u) {
    var t = undTunnelOf(doc, u.editTun);
    if (!t) { u.editTun = null; return ""; }
    var mode = u.editPathMode || undTunnelPathMode(t);
    var relay = t.path && !t.path.template_id ? t.path.node_id : 0;
    var tpl = t.path && t.path.template_id ? t.path.template_id : "";
    var h = '<section class="panel"><header><h2>编辑隧道 ' + esc(t.id) + "</h2>" +
      '<span class="muted" style="font-size:12.5px">' + esc(t.a.serial || ("node-" + t.a.node_id)) + " ↔ " +
      esc(t.b.serial || ("node-" + t.b.node_id)) + "</span></header>" +
      '<form id="und-tun-edit-form"><div class="fields">' +
      '<div class="field"><label for="und-edit-a-iface">本端物理端口</label>' +
      '<select id="und-edit-a-iface" name="a_iface">' +
      undIfaceOptions(undNodeOf(doc, t.a.node_id), t.a.iface) + "</select></div>" +
      '<div class="field"><label for="und-edit-a-addr">本端外层地址（留空用观测）</label>' +
      '<input id="und-edit-a-addr" name="a_addr" value="' + esc(t.a.addr) + '" placeholder="ip 或 ip:port"></div>' +
      '<div class="field"><label for="und-edit-b-iface">对端物理端口</label>' +
      '<select id="und-edit-b-iface" name="b_iface">' +
      undIfaceOptions(undNodeOf(doc, t.b.node_id), t.b.iface) + "</select></div>" +
      '<div class="field"><label for="und-edit-b-addr">对端外层地址（留空用观测）</label>' +
      '<input id="und-edit-b-addr" name="b_addr" value="' + esc(t.b.addr) + '" placeholder="ip 或 ip:port"></div>' +
      '<div class="field"><label for="und-edit-pathmode">路径</label>' +
      '<select id="und-edit-pathmode">' + undPathModeOptions(mode) + "</select></div>";
    if (mode === "inline") {
      h += '<div class="field"><label for="und-edit-relay">中转设备</label>' +
        '<select id="und-edit-relay" name="relay">' + undNodeOptions(doc.nodes, relay, "选择中转设备…") + "</select></div>" +
        '<div class="field"><label for="und-edit-relay-addr">中转地址（可选）</label>' +
        '<input id="und-edit-relay-addr" name="relay_addr" value="' +
        esc(t.path && !t.path.template_id ? t.path.addr : "") + '" placeholder="ip 或 ip:port"></div>';
    } else if (mode === "template") {
      h += '<div class="field"><label for="und-edit-template">路径模板</label>' +
        '<select id="und-edit-template" name="template">' + undTemplateOptions(doc, tpl) + "</select></div>";
    }
    h += "</div>" +
      '<div class="hint" style="margin:10px 0 0">端口和 overlay /32 不在这里改：端口由池分配，overlay 地址跟着隧道走。' +
      "改成「直连」会丢掉中转；地址留空表示改回使用观测地址。" +
      "物理端口只在改动时提交：选「默认」表示交回设备上报的出口。</div>" +
      '<div style="margin-top:10px"><button class="primary" type="submit">保存修改</button> ' +
      '<button class="small" type="button" data-act="und-tun-cancel">取消</button></div>' +
      "</form></section>";
    return h;
  }

  function undUpdateTunnel(form) {
    var u = S.und;
    if (!u || !u.doc || !u.editTun) return;
    var t = undTunnelOf(u.doc, u.editTun);
    if (!t) { u.editTun = null; render(); return; }
    var f = new FormData(form);
    var body = {
      id: t.id,
      a: { node_id: t.a.node_id, addr: String(f.get("a_addr") || "").trim() },
      b: { node_id: t.b.node_id, addr: String(f.get("b_addr") || "").trim() }
    };
    // "默认" resolves to the device's own egress port: the API treats an empty
    // iface as "keep", so clearing back to the default has to name it.
    var ndA = undNodeOf(u.doc, t.a.node_id), ndB = undNodeOf(u.doc, t.b.node_id);
    var ifA = String(f.get("a_iface") || "").trim() || (ndA && ndA.default_iface) || "";
    var ifB = String(f.get("b_iface") || "").trim() || (ndB && ndB.default_iface) || "";
    if (ifA && ifA !== t.a.iface) body.a.iface = ifA;
    if (ifB && ifB !== t.b.iface) body.b.iface = ifB;
    var mode = u.editPathMode || undTunnelPathMode(t);
    if (mode === "direct") {
      body.clear_path = true;
    } else if (mode === "inline") {
      var relay = Number(f.get("relay") || 0);
      if (!relay) { toast("选择中转设备"); return; }
      body.path = { node_id: relay, addr: String(f.get("relay_addr") || "").trim() };
    } else {
      var tpl = String(f.get("template") || "");
      if (!tpl) { toast("选择路径模板"); return; }
      body.path = { template_id: tpl };
    }
    api("PUT", "/api/underlay/tunnels", body).then(function (res) {
      u.editTun = null;
      u.editPathMode = null;
      u.note = { kind: "", text: "隧道 " + t.id + " 已更新。" };
      undSetDoc(res.underlay);
      toast("隧道已更新");
    }).catch(function (err) {
      u.note = undErrNote(err);
      render();
    });
  }

  function undDeleteTunnel(id) {
    var u = S.und;
    if (!u) return;
    if (!confirm("删除隧道 " + id + "？\n\n两端 overlay /32 会退回地址池队尾。这次删除会写进控制器隧道表并把版本号加一，" +
      "开着 -tunnels 的设备下一轮心跳会撤掉这条隧道。")) return;
    api("DELETE", "/api/underlay/tunnels?id=" + encodeURIComponent(id)).then(function (res) {
      u.note = { kind: "", text: "隧道 " + id + " 已删除；两端 overlay /32 已退回池尾。" };
      if (u.editTun === id) u.editTun = null;
      undSetDoc(res.underlay);
      toast("已删除");
    }).catch(function (err) {
      u.note = undErrNote(err);
      render();
    });
  }

  function undPathPanel(doc, u) {
    var h = '<section class="panel"><header><h2>路径模板</h2>' +
      '<span class="muted" style="font-size:12.5px">' + doc.paths.length + " 个</span></header>" +
      '<div class="hint">模板是共享的中转跳：编辑模板会同时移动所有引用它的隧道，删除前必须先解除引用。</div>';
    if (doc.paths.length) {
      h += "<table><thead><tr><th>名称</th><th>中转设备</th><th>地址</th><th>引用</th><th>创建</th><th></th></tr></thead><tbody>";
      doc.paths.forEach(function (p) {
        h += "<tr>" +
          "<td><b>" + esc(p.name) + '</b><div class="muted" style="font-size:12px">' + esc(p.id) + "</div></td>" +
          "<td>" + esc(p.serial || ("node-" + p.node_id)) + "</td>" +
          '<td class="mono muted">' + esc(p.addr || "用观测地址") + "</td>" +
          "<td>" + (p.users.length ? p.users.length + " 条" : "—") + "</td>" +
          '<td class="muted">' + esc(clock(p.created_at_unix)) + "</td>" +
          '<td class="row-actions">' +
          '<button class="small" data-act="und-path-edit" data-id="' + esc(p.id) + '">编辑</button>' +
          '<button class="small danger" data-act="und-path-del" data-id="' + esc(p.id) + '">删除</button>' +
          "</td></tr>";
      });
      h += "</tbody></table>";
    } else {
      h += '<div class="empty">还没有路径模板。手动创建时填「存为模板」也会建一个。</div>';
    }
    if (u.editPath) h += undPathEditForm(doc, u);
    h += undPathCreateForm(doc);
    return h + "</section>";
  }

  function undPathCreateForm(doc) {
    return '<form id="und-path-form" class="addrow">' +
      '<div class="field"><label for="und-path-name">模板名称</label>' +
      '<input id="und-path-name" name="name" placeholder="如 经上海中转" maxlength="60"></div>' +
      '<div class="field"><label for="und-path-node">中转设备</label>' +
      '<select id="und-path-node" name="node">' + undNodeOptions(doc.nodes, 0, "选择中转设备…") + "</select></div>" +
      '<div class="field"><label for="und-path-addr">中转地址（可选）</label>' +
      '<input id="und-path-addr" name="addr" placeholder="ip 或 ip:port"></div>' +
      '<button class="small" type="submit">新建模板</button></form>';
  }

  function undPathEditForm(doc, u) {
    var p = null;
    doc.paths.forEach(function (x) { if (x.id === u.editPath) p = x; });
    if (!p) { u.editPath = null; return ""; }
    return '<div class="subcard"><div class="subhead"><b>编辑模板「' + esc(p.name) + "」</b>" +
      '<span class="sp">被 ' + p.users.length + " 条隧道引用" +
      (p.users.length ? "：" + esc(p.users.join("、")) : "") + "</span></div>" +
      '<form id="und-path-edit-form"><div class="fields">' +
      '<div class="field"><label for="und-path-edit-name">名称</label>' +
      '<input id="und-path-edit-name" name="name" value="' + esc(p.name) + '" maxlength="60"></div>' +
      '<div class="field"><label for="und-path-edit-node">中转设备</label>' +
      '<select id="und-path-edit-node" name="node">' + undNodeOptions(doc.nodes, p.node_id, null) + "</select></div>" +
      '<div class="field"><label for="und-path-edit-addr">中转地址（可选）</label>' +
      '<input id="und-path-edit-addr" name="addr" value="' + esc(p.addr) + '" placeholder="ip 或 ip:port"></div>' +
      "</div>" +
      '<div style="margin-top:10px"><button class="primary" type="submit">保存模板</button> ' +
      '<button class="small" type="button" data-act="und-path-cancel">取消</button></div>' +
      "</form></div>";
  }

  function undSavePath(form, id) {
    var u = S.und;
    if (!u || !u.doc) return;
    var f = new FormData(form);
    var name = String(f.get("name") || "").trim();
    var node = Number(f.get("node") || 0);
    if (!name) { toast("给模板起个名字"); return; }
    if (!node) { toast("选择中转设备"); return; }
    var body = { name: name, node_id: node, addr: String(f.get("addr") || "").trim() };
    if (id) body.id = id;
    api(id ? "PUT" : "POST", "/api/underlay/paths", body).then(function (res) {
      u.editPath = null;
      u.note = { kind: "", text: id
        ? "模板「" + name + "」已更新" + (res.users && res.users.length ? "，引用它的 " + res.users.length + " 条隧道会跟着变" : "") + "。"
        : "模板「" + name + "」已创建。" };
      releaseForm(form);
      undSetDoc(res.underlay);
      toast(id ? "模板已更新" : "模板已创建");
    }).catch(function (err) {
      u.note = undErrNote(err);
      render();
    });
  }

  function undDeletePath(id) {
    var u = S.und;
    if (!u) return;
    if (!confirm("删除路径模板 " + id + "？被隧道引用时会被拒绝，需要先把那些隧道改成直连或别的模板。")) return;
    api("DELETE", "/api/underlay/paths?id=" + encodeURIComponent(id)).then(function (res) {
      u.note = { kind: "", text: "路径模板 " + id + " 已删除。" };
      if (u.editPath === id) u.editPath = null;
      undSetDoc(res.underlay);
      toast("模板已删除");
    }).catch(function (err) {
      u.note = undErrNote(err);
      render();
    });
  }

  function viewUnderlayTunnels() {
    var u = ensureUnderlay();
    var doc = u.doc;
    if (!doc) {
      return '<section class="panel"><div class="empty">' +
        esc(u.note ? u.note.text : "正在读取 underlay 配置…") + "</div></section>";
    }
    var h = "";
    if (!doc.configured) {
      h += '<div class="banner"><span>全局配置还没有发布：隧道建不了（中转端口随全局配置一起下发）。</span>' +
        '<button class="small" data-act="goto" data-view="underlay-settings">去全局配置</button></div>';
    }
    if (u.note) h += undNote(u.note);
    if (!doc.nodes.length) {
      h += '<section class="panel"><div class="empty">还没有设备。先到「入网授权」页接入设备，隧道才有两端。</div></section>';
    } else if (doc.configured) {
      h += undAutoPanel(doc, u);
      h += undManualPanel(doc, u);
    }
    if (u.editTun) h += undTunnelEditor(doc, u);
    h += undTunnelTable(doc);
    h += undPathPanel(doc, u);
    return h;
  }

  function undTrunc(s, n) {
    s = String(s == null ? "" : s);
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  function undStatusText(s) {
    return { online: "在线", stale: "失联", pending: "已入网 · 未上线" }[s] || s;
  }

  /* ---------------- 拓扑图：世界底图上的设备与隧道 ---------------- */

  // The basemap is a compiled-in asset (cmd/sr-ctrl/assets, generated by
  // controller/tools/world-basemap/gen.mjs) and it carries the projection
  // parameters, so without it the geographic view has no frame to put devices
  // in. That is a load failure, not an empty map: the page says so and falls
  // back to the logical layout instead of drawing a blank planet with dots.
  var MAP = { world: null, world50: null, loading: null, err: null,
    g50: null, err50: null };

  var MAP_K_MIN = 1, MAP_K_MAX = 14;
  var MAP_L1 = 1.8, MAP_L2 = 4.5;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement("script");
      el.src = src;
      el.onload = function () { resolve(); };
      el.onerror = function () { reject(new Error(src)); };
      document.head.appendChild(el);
    });
  }

  function ensureWorld() {
    if (MAP.world) return Promise.resolve(MAP.world);
    if (MAP.loading) return MAP.loading;
    MAP.err = null;
    MAP.loading = loadScript("/assets/world-110m.js").then(function () {
      var wd = window.SR_WORLD;
      if (!wd || typeof wd.scale !== "number" || typeof wd.land !== "string") {
        MAP.err = "底图内容不完整（读不到 scale 或 land）";
        return null;
      }
      MAP.world = wd;
      return wd;
    }).catch(function () {
      MAP.err = "底图脚本没能加载：/assets/world-110m.js";
      return null;
    }).then(function (wd) {
      MAP.loading = null;
      // The whole panel depends on whether the frame exists now, so it is a
      // structure change, not a redraw.
      if (S.view === "underlay-topology") render();
      return wd;
    });
    return MAP.loading;
  }

  // The detail tier is only worth 680 KB (214 KB gzipped) once the operator has
  // zoomed past the point where a 110m coastline reads as a polygon; fetching it
  // any earlier would stall the first paint of the page for nothing.
  function ensureWorld50() {
    if (MAP.world50 || MAP.g50 || MAP.err50) return;
    MAP.g50 = loadScript("/assets/world-50m.js").then(function () {
      MAP.world50 = window.SR_WORLD_50M || null;
      if (!MAP.world50) MAP.err50 = "明细底图内容不完整";
    }).catch(function () {
      MAP.err50 = "明细底图没能加载：/assets/world-50m.js";
    }).then(function () {
      MAP.g50 = null;
      undMapDraw();
    });
  }

  // Natural Earth I, forward form. gen.mjs proves this against d3 to under
  // 0.01 px when it generates the two layers, which is what lets the coastlines
  // and the device points share one frame.
  function mapProject(wd, lon, lat) {
    var phi = lat * Math.PI / 180, lam = lon * Math.PI / 180;
    var q = phi * phi, f4 = q * q;
    return [wd.tx + wd.scale * (lam * (0.8707 - 0.131979 * q +
      f4 * (-0.013791 + f4 * (0.003971 * q - 0.001529 * f4)))),
    wd.ty - wd.scale * (phi * (1.007226 +
      q * (0.015085 + f4 * (-0.044475 + 0.028874 * q - 0.005916 * f4))))];
  }

  function mapFrame() {
    return { w: MAP.world ? MAP.world.w : 2000, h: MAP.world ? MAP.world.h : 1040 };
  }

  // viewBox units per CSS px. getScreenCTM is the svg root's own matrix, so it
  // already includes the letterboxing that preserveAspectRatio does and does not
  // include the pan/zoom we put on the inner <g>.
  function undMapUnit() {
    var svg = $("tp-svg");
    if (!svg) return 1;
    var m = svg.getScreenCTM ? svg.getScreenCTM() : null;
    if (m && m.a) return 1 / m.a;
    return mapFrame().w / (svg.clientWidth || 900);
  }

  function undMapLevel(geo) {
    var t = S.topo;
    var lv = t.k < MAP_L1 ? 0 : (t.k < MAP_L2 ? 1 : 2);
    // 逻辑视图没有地图可看，第一档就没有存在的理由：它本来是为了在 lab 里
    // 把同城设备摊开，一上来该看到站名。
    if (!geo && lv === 0) lv = 1;
    return lv;
  }

  function undMapClamp() {
    var t = S.topo, f = mapFrame();
    if (t.k < MAP_K_MIN) t.k = MAP_K_MIN;
    if (t.k > MAP_K_MAX) t.k = MAP_K_MAX;
    var pad = 200;
    t.x = Math.min(pad, Math.max(f.w - pad - f.w * t.k, t.x));
    t.y = Math.min(pad, Math.max(f.h - pad - f.h * t.k, t.y));
  }

  // Where each device goes in the current view. The geographic view is the
  // server's has_location flag, not a guess: an unplaced device has no point and
  // appears in the 未定位 list. The logical view is the other half of the same
  // honesty -- it can put every device somewhere, so it does.
  function undMapPos(doc, geo) {
    var out = {}, unplaced = [];
    if (geo) {
      doc.nodes.forEach(function (nd) {
        if (nd.has_location) out[nd.node_id] = mapProject(MAP.world, nd.lon, nd.lat);
        else unplaced.push(nd);
      });
      return { pos: out, unplaced: unplaced };
    }
    var order = doc.nodes.slice().sort(function (a, b) {
      return (b.tunnel_count || 0) - (a.tunnel_count || 0);
    });
    var f = mapFrame(), cx = f.w / 2, cy = f.h / 2;
    var rx = f.w * 0.37, ry = f.h * 0.35;
    order.forEach(function (nd, i) {
      var ang = (i / order.length) * Math.PI * 2 - Math.PI / 2;
      out[nd.node_id] = order.length === 1 ? [cx, cy] : [cx + Math.cos(ang) * rx, cy + Math.sin(ang) * ry];
    });
    return { pos: out, unplaced: [] };
  }

  function r1(v) { return Math.round(v * 10) / 10; }

  function undMapNodeName(nd) { return nd.serial || ("node-" + nd.node_id); }

  // One edge per device pair. Several VPNs between the same two boxes are one
  // line until the operator is deep enough into the zoom that the pair is more
  // than 100 CSS px across, and only then does it split into one line per tunnel.
  function undMapEdges(doc, pos, lv, inv, sel) {
    var out = [];
    doc.bundles.forEach(function (b) {
      var pa = pos[b.a], pb = pos[b.b];
      if (!pa || !pb) return;
      var isSel = sel && sel.kind === "bundle" && sel.a === b.a && sel.b === b.b;
      var items = [];
      if (lv >= 2) {
        b.tunnels.forEach(function (t, i) {
          items.push({ t: t, key: i, label: t.id + " · " + (t.a.port || "—") + "→" + (t.b.port || "—") });
        });
      } else {
        var relayNames = {}, anyRelay = false;
        b.tunnels.forEach(function (t) {
          if (t.path) { anyRelay = true; relayNames[t.path.serial || ("node-" + t.path.node_id)] = true; }
          if (t.path_error) anyRelay = true;
        });
        var lb = b.count + " 条";
        var ks = Object.keys(relayNames);
        if (ks.length) lb += (lb ? " · " : "") + "经 " + ks.join("、");
        items.push({ t: b.tunnels[0], key: 0, relay: anyRelay, label: lv >= 1 ? lb : "" });
      }
      var m = items.length, span = 11 * inv;
      items.forEach(function (it, idx) {
        var off = (it.key - (m - 1) / 2) * span;
        var geo = undMapPath(it.t, pos, pa, pb, off, inv);
        if (!geo) return;
        var dash = (it.relay || (it.t && (it.t.path || it.t.path_error))) ?
          ' stroke-dasharray="' + r1(8 * inv) + " " + r1(6 * inv) + '"' : "";
        var col = isSel ? "#0969da" : (it.t && it.t.path_error ? "#cf222e" : "#8c959f");
        var wdt = r1((isSel ? 3 : (lv === 0 ? 1.4 : 2)) * inv);
        out.push('<path d="' + geo.d + '" fill="none" stroke="' + col + '" stroke-width="' + wdt +
          '" stroke-linecap="round" stroke-opacity="' + (lv === 0 ? "0.6" : "0.95") + '"' + dash + "/>");
        out.push('<path data-pick="bundle" data-a="' + b.a + '" data-b="' + b.b + '" d="' + geo.d +
          '" fill="none" stroke="transparent" stroke-width="' + r1(16 * inv) + '"><title>' +
          esc((b.serial_a || ("node-" + b.a)) + " 与 " + (b.serial_b || ("node-" + b.b)) + "：" +
            (it.label || "1 条隧道") + " · 状态未知") + "</title></path>");
        if (it.label) {
          out.push('<text x="' + r1(geo.mx) + '" y="' + r1(geo.my - 5 * inv) + '" font-size="' +
            r1(11 * inv) + '" fill="#57606a" stroke="#eef4f9" text-anchor="middle" paint-order="stroke" ' +
            'stroke-width="' + r1(4 * inv) + '" stroke-linejoin="round">' + esc(it.label) + "</text>");
        }
      });
    });
    return out.join("");
  }

  // The line for one tunnel, offset sideways by idx*span so a split bundle reads
  // as parallel wires rather than one thick stroke, and bowed through the relay
  // box when the tunnel is source-routed.
  function undMapPath(t, pos, pa, pb, off, inv) {
    var dx = pb[0] - pa[0], dy = pb[1] - pa[1];
    var len = Math.sqrt(dx * dx + dy * dy);
    if (!len) return null;
    var nx = -dy / len, ny = dx / len;
    var a = [pa[0] + nx * off, pa[1] + ny * off], b = [pb[0] + nx * off, pb[1] + ny * off];
    var hop = t && t.path ? pos[t.path.node_id] : null;
    if (hop) {
      return { d: "M" + r1(a[0]) + "," + r1(a[1]) + "Q" + r1(hop[0]) + "," + r1(hop[1]) + " " + r1(b[0]) + "," + r1(b[1]),
        mx: (a[0] + 2 * hop[0] + b[0]) / 4, my: (a[1] + 2 * hop[1] + b[1]) / 4 };
    }
    return { d: "M" + r1(a[0]) + "," + r1(a[1]) + "L" + r1(b[0]) + "," + r1(b[1]),
      mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 };
  }

  function undMapNodes(doc, pos, lv, inv, sel) {
    var out = [], labels = [];
    // 隧道多的设备最后画：它们的标签最该占住位置，也最容易被邻居挡住。
    var order = doc.nodes.slice().sort(function (a, b) {
      return (a.tunnel_count || 0) - (b.tunnel_count || 0);
    });
    order.forEach(function (nd) {
      var p = pos[nd.node_id];
      if (!p) return;
      var isSel = sel && sel.kind === "node" && sel.id === nd.node_id;
      var r = (lv === 0 ? 4.5 : (lv === 1 ? 6 : 7.5)) * inv;
      var fill = nd.status === "online" ? "#1a7f37" : (nd.status === "stale" ? "#9a6700" : "#afb8c1");
      var g = ['<g data-pick="node" data-id="' + nd.node_id + '">'];
      g.push('<circle cx="' + r1(p[0]) + '" cy="' + r1(p[1]) + '" r="' + r1(r * 3.2) + '" fill="transparent"/>');
      if (nd.relay_for) {
        g.push('<circle cx="' + r1(p[0]) + '" cy="' + r1(p[1]) + '" r="' + r1(r + 3.5 * inv) +
          '" fill="none" stroke="#0969da" stroke-width="' + r1(1.3 * inv) + '" stroke-dasharray="' +
          r1(3 * inv) + " " + r1(3 * inv) + '"><title>' + esc("为 " + nd.relay_for + " 条隧道中转") + "</title></circle>");
      }
      g.push('<circle cx="' + r1(p[0]) + '" cy="' + r1(p[1]) + '" r="' + r1(r) + '" fill="' + fill +
        '" stroke="#ffffff" stroke-width="' + r1(1.6 * inv) + '"' +
        (nd.status === "pending" ? ' stroke-dasharray="' + r1(3 * inv) + " " + r1(2.4 * inv) + '"' : "") + "/>");
      if (isSel) {
        g.push('<circle cx="' + r1(p[0]) + '" cy="' + r1(p[1]) + '" r="' + r1(r + 5 * inv) +
          '" fill="none" stroke="#0969da" stroke-width="' + r1(2 * inv) + '"/>');
      }
      g.push('<title>' + esc(undMapNodeName(nd) + " · node-" + nd.node_id + " · " + undStatusText(nd.status)) + "</title>");
      var name = undMapNodeName(nd);
      var lx = p[0], ly = p[1] - r - 7 * inv, clash = false;
      for (var i = 0; i < labels.length; i++) {
        if (Math.abs(labels[i][0] - lx) < 58 * inv && Math.abs(labels[i][1] - ly) < 16 * inv) { clash = true; break; }
      }
      if (!clash) {
        labels.push([lx, ly]);
        g.push('<text x="' + r1(lx) + '" y="' + r1(ly) + '" font-size="' + r1((lv === 0 ? 11 : 12) * inv) +
          '" font-weight="500" fill="#1f2328" text-anchor="middle" stroke="#eef4f9" paint-order="stroke" ' +
          'stroke-width="' + r1(4.5 * inv) + '" stroke-linejoin="round">' + esc(undTrunc(name, 22)) + "</text>");
      } else if (lv >= 2) {
        // 挤不下的名字往下挪一行而不是删掉：一个点没有标签，运维只会以为那台设备
        // 不在图上；标签压在海岸线上至少还是个可见的取舍。
        g.push('<text x="' + r1(lx) + '" y="' + r1(ly + 14 * inv) + '" font-size="' + r1(10.5 * inv) +
          '" fill="#57606a" text-anchor="middle" stroke="#eef4f9" paint-order="stroke" stroke-width="' +
          r1(4 * inv) + '">' + esc(undTrunc(name, 22)) + "</text>");
      }
      if (lv >= 2) {
        g.push('<text x="' + r1(p[0]) + '" y="' + r1(p[1] + r + 13 * inv) + '" font-size="' + r1(10.5 * inv) +
          '" fill="#57606a" text-anchor="middle" stroke="#eef4f9" paint-order="stroke" stroke-width="' +
          r1(4 * inv) + '">' + esc("node-" + nd.node_id + " · " + (nd.transit_port ? "中转 " + nd.transit_port : "中转未分配")) +
          (nd.site_name ? " · " + esc(nd.site_name) : "") + "</text>");
      }
      g.push("</g>");
      out.push(g.join(""));
    });
    return out.join("");
  }

  function undMapDraw() {
    var svg = $("tp-svg");
    var t = S.topo;
    if (!svg || !t || !t.doc) return;
    var doc = t.doc;
    var wd = MAP.world;
    var f = mapFrame();
    var geo = t.view === "geo" && !!wd;   // 底图没到位就退回逻辑摆放，横幅已写明原因
    var lv = undMapLevel(geo);
    var inv = undMapUnit() / t.k;
    var spot = undMapPos(doc, geo);
    var parts = [];
    parts.push('<rect x="-6000" y="-6000" width="14000" height="13000" fill="#eaeff5"/>');
    if (geo) {
      parts.push('<path d="' + wd.graticule + '" fill="none" stroke="#d8e2ea" stroke-opacity="' +
        (lv === 0 ? "0.9" : "0.6") + '"/>');
      // 50m 海岸线只在放大到看得出差别的那一档才叠上去，画在 110m 同一坐标系里。
      if (lv >= 2 && MAP.world50) {
        parts.push('<path d="' + MAP.world50.land + '" fill="#fbfcfd" stroke="#c9d1d9" stroke-width="' +
          r1(1.1 * inv) + '"/>');
      } else {
        parts.push('<path d="' + wd.land + '" fill="#fbfcfd" stroke="#c9d1d9" stroke-width="' + r1(1.1 * inv) + '"/>');
        parts.push('<path d="' + wd.borders + '" fill="none" stroke="#d5dbe1" stroke-width="' + r1(0.8 * inv) + '"/>');
      }
    }
    parts.push(undMapEdges(doc, spot.pos, lv, inv, t.sel));
    parts.push(undMapNodes(doc, spot.pos, lv, inv, t.sel));
    svg.setAttribute("viewBox", "0 0 " + f.w + " " + f.h);
    svg.innerHTML = '<g transform="translate(' + r1(t.x) + "," + r1(t.y) + ") scale(" + r1(t.k) + ')">' +
      parts.join("") + "</g>";
    var aria = "设备拓扑：" + (geo
      ? "地理视图，" + (doc.nodes.length - spot.unplaced.length) + " 台已定位设备"
      : "逻辑视图，" + doc.nodes.length + " 台设备") +
      "、" + doc.bundles.length + " 组连接";
    svg.setAttribute("aria-label", aria);
    var z = $("tp-zoom"), lvel = $("tp-level"), hint = $("tp-hint");
    if (z) z.textContent = t.k.toFixed(1) + "×";
    if (lvel) lvel.textContent = ["缩略", "站点", "隧道明细"][lv];
    if (hint) hint.textContent = undMapHint(lv, geo, spot.unplaced.length, t.k);
  }

  function undMapHint(lv, geo, unplaced, k) {
    if (!geo) return "逻辑视图：不看经纬度，按隧道多少把设备摊开。同城、同机房或者还没填位置的设备在这种视角下看得清。";
    if (lv === 0) return "缩略层级：海岸线 + 设备点，站名按能不能放下来决定（挤不下的先隐藏）。放大到 " + MAP_L1 + "× 起在连线上标隧道条数与中转。" +
      (unplaced ? " 有 " + unplaced + " 台设备没有位置，只在下方清单里，不做猜测摆放。" : "");
    if (lv === 1) return "站点层级：站名 + 每组设备一条线，标「N 条」和经过的中转设备。放大到 " + MAP_L2 +
      "× 起每组连线拆成逐条隧道，补上两端监听端口。" + (unplaced ? " 未定位 " + unplaced + " 台。" : "");
    return "隧道明细层级：一条隧道一条线，标隧道号与本端→对端监听端口；虚线是经过中转设备的 SR 路径，红色是路径模板已经失效。" +
      (MAP.world50 ? " 底图已切到 1:50m 明细海岸线。" : (MAP.err50 ? " " + MAP.err50 + "，仍用 1:110m 海岸线。" : " 明细海岸线加载中…")) +
      (unplaced ? " 未定位 " + unplaced + " 台。" : "") + " 当前 " + k.toFixed(1) + "×。";
  }

  function undMapZoomTo(vb, factor) {
    var t = undTopoStore();
    var k = Math.min(MAP_K_MAX, Math.max(MAP_K_MIN, t.k * factor));
    factor = k / t.k;
    var bx = (vb[0] - t.x) / t.k, by = (vb[1] - t.y) / t.k;
    t.k = k; t.x = vb[0] - bx * t.k; t.y = vb[1] - by * t.k;
    undMapClamp();
    if (t.view === "geo" && MAP.world && t.k >= MAP_L2) ensureWorld50();
    undMapDraw();
  }

  function undMapPoint(ev) {
    var svg = $("tp-svg");
    var m = svg.getScreenCTM ? svg.getScreenCTM() : null;
    if (!m) return [mapFrame().w / 2, mapFrame().h / 2];
    return [(ev.clientX - m.e) / m.a, (ev.clientY - m.f) / m.d];
  }

  // 缩到刚够把所有有位置的设备框进来。设备集中在一个城市时这会比全图有用得多，
  // 全图里一整个国家只是一个点。
  function undMapFit() {
    var t = undTopoStore();
    if (!t.doc) return;
    var spot = undMapPos(t.doc, t.view === "geo" && !!MAP.world);
    var xs = [], ys = [];
    Object.keys(spot.pos).forEach(function (id) {
      xs.push(spot.pos[id][0]); ys.push(spot.pos[id][1]);
    });
    if (!xs.length) { t.k = 1; t.x = 0; t.y = 0; undMapDraw(); return; }
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var f = mapFrame();
    var padX = (x1 - x0) * 0.25 + 90, padY = (y1 - y0) * 0.25 + 90;
    var k = Math.min(f.w / ((x1 - x0) + 2 * padX), f.h / ((y1 - y0) + 2 * padY));
    t.k = Math.max(MAP_K_MIN, Math.min(MAP_K_MAX, k));
    t.x = f.w / 2 - ((x0 + x1) / 2) * t.k;
    t.y = f.h / 2 - ((y0 + y1) / 2) * t.k;
    undMapClamp();
    undMapDraw();
  }

  function undMapReset() {
    var t = undTopoStore();
    t.k = 1; t.x = 0; t.y = 0;
    undMapClamp();
    undMapDraw();
  }

  // Pointer state lives on the element, not in S: a page rebuild between the
  // pointerdown and the pointerup must not leave a stale flag behind.
  function undMapAttach() {
    var svg = $("tp-svg");
    if (!svg || svg._tp) return;
    svg._tp = true;
    if (S.topo && S.topo.view === "geo" && !MAP.world) ensureWorld();
    var drag = null, moved = 0, suppress = false;
    svg.addEventListener("pointerdown", function (ev) {
      if (ev.button !== 0) return;
      drag = { sx: ev.clientX, sy: ev.clientY, x: S.topo.x, y: S.topo.y };
      moved = 0;
      S.topo.drag = true;
      svg.classList.add("dragging");
      if (svg.setPointerCapture) { try { svg.setPointerCapture(ev.pointerId); } catch (e) {} }
    });
    svg.addEventListener("pointermove", function (ev) {
      if (!drag) return;
      var m = svg.getScreenCTM ? svg.getScreenCTM() : null;
      if (!m) return;
      moved = Math.max(moved, Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy));
      S.topo.x = drag.x + (ev.clientX - drag.sx) / m.a;
      S.topo.y = drag.y + (ev.clientY - drag.sy) / m.d;
      undMapClamp();
      undMapDraw();
    });
    function end(ev) {
      if (drag && moved > 4) suppress = true;
      drag = null;
      S.topo.drag = false;
      svg.classList.remove("dragging");
      if (svg.releasePointerCapture) { try { svg.releasePointerCapture(ev.pointerId); } catch (e) {} }
    }
    svg.addEventListener("pointerup", end);
    svg.addEventListener("pointercancel", function () {
      drag = null; S.topo.drag = false; svg.classList.remove("dragging");
    });
    svg.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      undMapZoomTo(undMapPoint(ev), Math.pow(1.0016, -ev.deltaY));
    }, { passive: false });
    svg.addEventListener("dblclick", function (ev) {
      ev.preventDefault();
      undMapZoomTo(undMapPoint(ev), 1.8);
    });
    svg.addEventListener("click", function (ev) {
      // 拖动结束时浏览器还会补一个 click：那不该被当成选中。
      if (suppress) { suppress = false; return; }
      var el = ev.target.closest ? ev.target.closest("[data-pick]") : null;
      if (!el) return;
      var t = undTopoStore();
      var kind = el.getAttribute("data-pick");
      if (kind === "node") {
        var id = Number(el.getAttribute("data-id"));
        t.sel = (t.sel && t.sel.kind === "node" && t.sel.id === id) ? null : { kind: "node", id: id };
      } else {
        var a = Number(el.getAttribute("data-a")), b = Number(el.getAttribute("data-b"));
        t.sel = (t.sel && t.sel.kind === "bundle" && t.sel.a === a && t.sel.b === b)
          ? null : { kind: "bundle", a: a, b: b };
      }
      blurContent();
      render();
    });
    if (S.topo.view === "geo" && MAP.world && S.topo.k >= MAP_L2) ensureWorld50();
    undMapDraw();
  }

  function undMapDragging() {
    return !!(S.topo && S.topo.drag);
  }

  function undMapViewSeg() {
    var t = undTopoStore();
    return '<span class="seg" role="group" aria-label="视图">' +
      '<button data-act="topo-view" data-v="geo"' + (t.view === "geo" ? ' class="on"' : "") + ">地理</button>" +
      '<button data-act="topo-view" data-v="logical"' + (t.view !== "geo" ? ' class="on"' : "") + ">逻辑</button>" +
      "</span>";
  }

  function undUnplacedPanel(doc) {
    var rows = doc.nodes.filter(function (nd) { return !nd.has_location; });
    var h = '<section class="panel"><header><h2>未定位设备</h2>' +
      '<span class="muted" style="font-size:12.5px">' + rows.length + " 台</span></header>";
    if (!rows.length) {
      return h + '<div class="empty">全部设备都有位置。</div></section>';
    }
    h += "<table><thead><tr><th>设备</th><th>状态</th><th>位置</th><th>隧道</th></tr></thead><tbody>";
    rows.forEach(function (nd) {
      h += "<tr><td><b class=\"mono\">" + esc(undMapNodeName(nd)) + "</b> <span class=\"muted\">node-" +
        nd.node_id + "</span></td><td>" + statusTag(nd.status) + "</td>" +
        '<td><span class="tag pending">未上报</span></td><td>' + esc(nd.tunnel_count) + "</td></tr>";
    });
    h += "</tbody></table>";
    h += '<div class="hint">位置在「设备」页按站点填写。这里列出的设备不会出现在地理视图里（逻辑视图会画全部设备），' +
      "控制器也不会替它们猜一个坐标。</div>";
    return h + "</section>";
  }

  function undZoomTierTable() {
    return '<section class="panel"><header><h2>缩放分级</h2></header><table><thead><tr>' +
      "<th>缩放</th><th>画什么</th></tr></thead><tbody>" +
      "<tr><td class=\"mono\">1.0–" + MAP_L1 + '×</td><td>缩略：1:110m 海岸线 + 设备点，站名只画放得下的</td></tr>' +
      "<tr><td class=\"mono\">" + MAP_L1 + "–" + MAP_L2 + '×</td><td>站点：站名 + 每组设备一条线，标「N 条」与经过的中转设备</td></tr>' +
      "<tr><td class=\"mono\">≥ " + MAP_L2 + '×</td><td>隧道明细：逐条隧道分线，标隧道号与两端监听端口；底图切到 1:50m 海岸线</td></tr>' +
      "</tbody></table><div class=\"hint\">放得越细画得越多，是为了上千台设备的网络缩小时还能看清整体、放大时能读出每一条线。</div></section>";
  }

  function undSitePanel(doc) {
    var h = '<section class="panel"><header><h2>站点</h2>' +
      '<span class="muted" style="font-size:12.5px">' + doc.sites.length + " 个 " +
      '<button class="small" data-act="goto" data-view="nodes">在「设备」页编辑</button></span></header>';
    if (!doc.sites.length) {
      return h + '<div class="empty">还没有站点。在「设备」页给设备填位置就会建出来。</div></section>';
    }
    h += "<table><thead><tr><th>站点</th><th>经纬度</th><th>设备</th></tr></thead><tbody>";
    doc.sites.forEach(function (si) {
      h += '<tr><td><b>' + esc(si.name) + '</b> <span class="muted mono">' + esc(si.id) + "</span></td>" +
        '<td class="mono">' + esc(si.lon.toFixed(2)) + ", " + esc(si.lat.toFixed(2)) + "</td>" +
        "<td>" + esc(si.devices) + "</td></tr>";
    });
    return h + "</tbody></table></section>";
  }


  function undTopoNode(doc, id) {
    var out = null;
    doc.nodes.forEach(function (n) { if (n.node_id === id) out = n; });
    return out;
  }

  function undTopoBundle(doc, a, b) {
    var out = null;
    doc.bundles.forEach(function (x) { if (x.a === a && x.b === b) out = x; });
    return out;
  }

  function undKv(k, v) {
    return "<dt>" + esc(k) + "</dt><dd>" + v + "</dd>";
  }

  function undTopoDetail(doc) {
    var sel = S.topo && S.topo.sel;
    if (!sel) return '<section class="panel"><div class="empty">点击设备或连线查看详情。</div></section>';
    if (sel.kind === "node") {
      var nd = undTopoNode(doc, sel.id);
      if (!nd) { S.topo.sel = null; return '<section class="panel"><div class="empty">点击设备或连线查看详情。</div></section>'; }
      var h = '<section class="panel"><header><h2>' + esc(nd.serial || ("node-" + nd.node_id)) + " · node-" +
        nd.node_id + "</h2>" + statusTag(nd.status) + "</header>" +
        '<dl class="kv">' +
        undKv("最后心跳", nd.last_seen_unix ? esc(clock(nd.last_seen_unix)) + "（" + esc(ago(nd.last_seen_unix)) + "）" : "从未上报") +
        undKv("观测外层地址", nd.observed_addr ? '<span class="mono">' + esc(nd.observed_addr) + "</span>"
          : (nd.udp_mapping ? '<span class="mono">' + esc(nd.udp_mapping) + '</span> <span class="tag stale">无地址</span>' : "未上报")) +
        undKv("观测时效", nd.observed_age_sec > 0
          ? esc(dur(nd.observed_age_sec)) + "前" + (nd.observed_stale ? ' <span class="tag stale">已过期</span>' : "")
          : "—") +
        undKv("位置", nd.has_location
          ? (nd.site_name ? "<b>" + esc(nd.site_name) + "</b> " : "") +
            '<span class="mono muted">' + esc(nd.lon.toFixed(2)) + ", " + esc(nd.lat.toFixed(2)) + "</span>" +
            (S.topo.view === "geo" ? "" : ' <button class="small" data-act="topo-view" data-v="geo">切到地理视图</button>')
          : '<span class="tag pending">未上报</span> <button class="small" data-act="goto" data-view="nodes">去设备页填位置</button>') +
        undKv("对称 NAT", nd.symmetric_nat ? "是（不能与另一台对称 NAT 设备建隧道）" : "否") +
        undKv("默认出口", nd.default_iface ? '<span class="mono">' + esc(nd.default_iface) + "</span>" : "未选择") +
        undKv("中转端口", nd.transit_port ? '<span class="mono">' + esc(nd.transit_port) + "</span>" : '<span class="tag pending">未分配</span>') +
        undKv("VPN 端口", nd.ports.length ? '<span class="mono">' + esc(nd.ports.join("、")) + "</span>" : "—") +
        undKv("隧道", esc(nd.tunnel_count) + " 条") +
        undKv("为其他隧道中转", nd.relay_for ? esc(nd.relay_for) + " 条" : "—") +
        undKv("隧道下发", undTunnelDeliveryCell(nd)) +
        (nd.tunnel_delivery && nd.tunnel_delivery.error
          ? undKv("下发失败原因", '<span class="mono">' + esc(nd.tunnel_delivery.error) + "</span>")
          : "") +
        "</dl>";
      if (nd.inventory_reported && nd.ifaces && nd.ifaces.length) {
        h += '<div class="hint" style="margin-top:12px">接口清单' +
          (nd.inventory_age_sec > 0 ? "（" + esc(dur(nd.inventory_age_sec)) + "前上报）" : "") + "</div>" +
          "<table><thead><tr><th>接口</th><th>MTU</th><th>状态</th><th>地址</th></tr></thead><tbody>" +
          nd.ifaces.map(function (i) {
            return '<tr><td class="mono">' + esc(i.name) + "</td>" +
              "<td>" + (i.mtu ? esc(i.mtu) : '<span class="tag pending">未知</span>') + "</td>" +
              "<td>" + (i.link_up ? '<span class="tag online">up</span>' : '<span class="tag stale">down</span>') + "</td>" +
              '<td class="mono muted">' + esc((i.addrs || []).join("、") || "—") + "</td></tr>";
          }).join("") + "</tbody></table>";
      } else if (!nd.inventory_reported) {
        h += '<div class="hint" style="margin-top:12px">设备还没有上报接口清单，所以无法判断默认出口与链路 MTU。</div>';
      }
      return h + "</section>";
    }
    var b = undTopoBundle(doc, sel.a, sel.b);
    if (!b) { S.topo.sel = null; return '<section class="panel"><div class="empty">点击设备或连线查看详情。</div></section>'; }
    var h2 = '<section class="panel"><header><h2>' + esc(b.serial_a || ("node-" + b.a)) + " 与 " +
      esc(b.serial_b || ("node-" + b.b)) + " 之间</h2>" + undStateTag(doc.state_note) + "</header>" +
      '<div class="hint">' + esc(doc.state_note) + "</div>" +
      "<table><thead><tr><th>隧道</th><th>本端</th><th>对端</th><th>路径</th><th>MTU</th><th>更新</th></tr></thead><tbody>";
    b.tunnels.forEach(function (t) {
      h2 += "<tr>" +
        '<td class="mono">' + esc(t.id) + "</td>" +
        "<td>" + undEndpointCell(t.a, doc) + "</td>" +
        "<td>" + undEndpointCell(t.b, doc) + "</td>" +
        "<td>" + undPathText(t) + "</td>" +
        "<td>" + undMTUCell(t, doc) + "</td>" +
        '<td class="muted">' + esc(clock(t.updated_at_unix)) + "</td></tr>";
    });
    return h2 + "</tbody></table></section>";
  }

  function viewUnderlayTopology() {
    var t = ensureTopo();
    var doc = t.doc;
    if (!doc) {
      return '<section class="panel"><div class="empty">' +
        esc(t.err ? "读取拓扑失败：" + t.err : "正在读取拓扑…") + "</div></section>";
    }
    var h = "";
    if (!doc.configured) {
      h += '<div class="banner"><span>全局配置还没有发布：拓扑里不会有隧道。</span>' +
        '<button class="small" data-act="goto" data-view="underlay-settings">去全局配置</button></div>';
    }
    if (!doc.nodes.length) {
      return h + '<section class="panel"><header><h2>拓扑</h2></header>' +
        '<div class="empty">还没有设备。设备入网后才会出现在拓扑里。</div></section>';
    }
    var geo = t.view === "geo";
    var placed = doc.nodes.length - doc.unplaced_nodes;
    if (geo && MAP.err) {
      h += '<div class="banner"><span>' + esc(MAP.err) +
        "。地理视图需要底图里的投影参数才能摆放设备，所以现在画的是逻辑视图。</span>" +
        '<button class="small" data-act="topo-world-retry">重试加载</button></div>';
    } else if (geo && !MAP.world) {
      h += '<div class="banner"><span>世界底图加载中（132 KB，编译在控制器里，只加载一次）。' +
        "在加载好之前先画逻辑视图。</span></div>";
    }
    h += '<section class="panel"><header><h2>' + (geo && MAP.world ? "地理视图" : "逻辑视图") + "</h2>" +
      '<div class="meta">' + undMapViewSeg() +
      '<span class="muted" style="font-size:12.5px">滚轮或 + − 缩放 · 拖动平移 · 双击放大</span>' +
      '<span class="tag pending" id="tp-level">缩略</span>' +
      '<span class="tag pending" id="tp-zoom">' + t.k.toFixed(1) + "×</span></div></header>" +
      '<div class="hint">' + esc(doc.state_note) + "</div>" +
      '<div class="map-area">' +
      '<svg id="tp-svg" class="topo" viewBox="0 0 2000 1040" preserveAspectRatio="xMidYMid meet" ' +
      'role="img" aria-label="设备拓扑"></svg>' +
      '<div class="map-ctl">' +
      '<button class="zm" data-act="topo-zoom" data-d="1" aria-label="放大">+</button>' +
      '<button class="zm" data-act="topo-zoom" data-d="-1" aria-label="缩小">−</button>' +
      '<button data-act="topo-fit">适应设备</button>' +
      '<button data-act="topo-world">全图</button></div>' +
      '<div class="map-legend">' +
      '<div class="lg"><b>连线</b><i class="w"></i>直连<i class="w relay"></i>经中转</div>' +
      '<div class="lg"><b>设备</b><i class="d"></i>在线<i class="d warn"></i>失联<i class="d pend"></i>已入网未上线</div>' +
      "</div></div>" +
      '<div class="zoomhint" id="tp-hint" aria-live="polite"></div>' +
      '<div class="usage" style="margin-top:8px"><span><span class="k">图上</span> <b>' +
      (geo && MAP.world ? placed : doc.nodes.length) + "</b> / " + doc.nodes.length + " 台</span>" +
      "<span><span class=\"k\">连接</span> <b>" + doc.bundles.length + "</b> 组</span>" +
      "<span><span class=\"k\">站点</span> <b>" + doc.sites.length + "</b> 个</span>" +
      '<span><span class="k">未定位</span> <b>' + doc.unplaced_nodes + "</b> 台</span></div>" +
      '<div class="hint" style="margin-top:10px">每组连线是一个设备对：同一设备对之间只能有一条隧道' +
      "（每台设备只有一把 WireGuard 静态密钥，第二条会被数据面以 -116 拒掉），要换端口或路径就编辑或删了重建。" +
      "外圈虚线环 = 这台设备在为别的隧道做中转。</div></section>";
    h += undTopoDetail(doc);
    h += '<div class="und-cols">' + undZoomTierTable() + undUnplacedPanel(doc) + "</div>";
    h += undSitePanel(doc);
    return h;
  }

  /* ---------------- actions ---------------- */

  // The 10s poll skips re-render while a form field has focus, so it cannot
  // wipe half-typed input. After a submit the response may carry a one-time
  // secret, so drop that focus: otherwise the result box stays hidden until
  // the operator happens to click elsewhere.
  function releaseForm(form) {
    form.reset();
    var a = document.activeElement;
    if (a && a.blur && form.contains(a)) a.blur();
  }

  // Same guard, other shape: a row action (生成 / 重置密码) can fire while the
  // TTL <select> in that row still holds focus, which would swallow the frame
  // that carries the one-time box.
  function blurContent() {
    var a = document.activeElement;
    if (a && a.blur && a.closest && a.closest("#content")) a.blur();
  }

  // An empty number field means "let the server pick", which is 0 on the wire;
  // anything non-numeric is a client mistake and should not silently become 0.
  function intField(f, name) {
    var v = (f.get(name) || "").trim();
    if (v === "") return 0;
    var n = Number(v);
    return Number.isFinite(n) ? Math.trunc(n) : NaN;
  }

  function bind() {
    var tf = $("tenant-form");
    if (tf) tf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(tf);
      var maxUses = intField(f, "claim_max_uses");
      if (isNaN(maxUses)) { toast("授权可激活台数必须是数字"); return; }
      api("POST", "/api/tenants", {
        tenant_id: (f.get("tenant_id") || "").trim(),
        name: (f.get("name") || "").trim(),
        account: (f.get("account") || "").trim(),
        password: f.get("password") || "",
        claim_max_uses: maxUses
      }).then(function (res) {
        S.lastResult = res;
        var msg = "租户 " + res.tenant.tenant_id + " 已创建";
        if (res.account) msg += "，账号 " + res.account.username;
        toast(msg);
        releaseForm(tf);
        load().then(function () { S.view = "tenants"; render(); });
      }).catch(function (err) { toast(err.message); });
    });

    var af = $("account-form");
    if (af) af.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(af);
      var role = f.get("role") || "tenant";
      api("POST", "/api/accounts", {
        username: (f.get("username") || "").trim(),
        role: role,
        tenant_id: role === "tenant" ? (f.get("tenant_id") || "").trim() : "",
        password: f.get("password") || ""
      }).then(function (res) {
        S.lastSecret = res.password
          ? { title: "账号 " + res.account.username + " 已创建", username: res.account.username, password: res.password }
          : null;
        toast("账号 " + res.account.username + " 已创建");
        releaseForm(af);
        if (S.view === "accounts") load();
      }).catch(function (err) { toast(err.message); });
    });

    var cf = $("claim-form");
    if (cf) cf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(cf);
      var maxUses = intField(f, "max_uses");
      if (isNaN(maxUses)) { toast("可激活台数必须是数字"); return; }
      api("POST", "/api/claims", {
        tenant_id: f.get("tenant_id") || "",
        name: (f.get("name") || "").trim(),
        max_uses: maxUses
      }).then(function (c) {
        toast("已下发授权「" + c.name + "」（可激活 " + c.max_uses + " 台）");
        releaseForm(cf);
        load();
      }).catch(function (err) { toast(err.message); });
    });

    var pf = $("password-form");
    if (pf) pf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(pf);
      var np = f.get("new_password") || "";
      if (np !== f.get("confirm")) { toast("两次输入的新密码不一致"); return; }
      api("POST", "/api/password", {
        old_password: f.get("old_password") || "",
        new_password: np
      }).then(function () {
        toast("密码已修改，其他会话已登出");
        releaseForm(pf);
        return api("GET", "/api/session").then(function (s) { S.me = s; });
      }).then(function () { renderChrome(); render(); })
        .catch(function (err) { toast(err.message); });
    });

    var cn = $("cfg-node");
    if (cn) cn.addEventListener("change", function () {
      blurContent();
      selectCfgNode(Number(cn.value));
    });
    var cv = $("cfg-vpn");
    if (cv) cv.addEventListener("change", function () {
      blurContent();
      if (S.cfg) S.cfg.vpn = Number(cv.value);
      render();
    });
    document.querySelectorAll("#content [data-cfg]").forEach(function (el) {
      el.addEventListener("input", function () {
        if (!S.cfg || !S.cfg.draft) return;
        cfgSetPath(el, el.value);
        csMarkDirty();
      });
    });
    document.querySelectorAll("#content [data-cfg-bool]").forEach(function (el) {
      el.addEventListener("change", function () {
        var cs = S.cfg;
        if (!cs || !cs.draft) return;
        var vpn = cfgVPNOf(cs.draft, cs.vpn);
        if (!vpn) return;
        var p = el.getAttribute("data-cfg-bool");
        if (p === "bgp.on") vpn.bgp.on = el.checked;
        else if (p === "ospf.on") vpn.ospf.on = el.checked;
        csMarkDirty();
        blurContent();
        render();
      });
    });

    document.querySelectorAll("#content [data-und]").forEach(function (el) {
      el.addEventListener("input", function () { undSetField(el); });
    });
    document.querySelectorAll("#content [data-und-node]").forEach(function (el) {
      el.addEventListener("change", function () {
        var u = S.und;
        if (!u) return;
        var id = Number(el.getAttribute("data-und-node"));
        var i = u.autoSel.indexOf(id);
        if (el.checked && i < 0) u.autoSel.push(id);
        if (!el.checked && i >= 0) u.autoSel.splice(i, 1);
        u.auto = null;
        blurContent();
        render();
      });
    });
    var uam = $("und-auto-mode");
    if (uam) uam.addEventListener("change", function () {
      if (!S.und) return;
      S.und.autoMode = uam.value;
      S.und.auto = null;
      blurContent();
      render();
    });
    var uah = $("und-auto-hub");
    if (uah) uah.addEventListener("change", function () {
      if (!S.und) return;
      S.und.autoHub = Number(uah.value) || 0;
      S.und.auto = null;
      blurContent();
      render();
    });
    var uas = $("und-auto-spoke");
    if (uas) uas.addEventListener("change", function () {
      if (!S.und) return;
      S.und.autoSpoke = uas.value;
      S.und.auto = null;
      blurContent();
      render();
    });
    document.querySelectorAll("#content [data-und-dev]").forEach(function (el) {
      el.addEventListener("change", function () {
        var u = S.und;
        if (!u) return;
        if (el.getAttribute("data-und-dev") === "a") u.mA = Number(el.value) || 0;
        else u.mB = Number(el.value) || 0;
        blurContent();
        render();
      });
    });
    var ump = $("und-tun-pathmode");
    if (ump) ump.addEventListener("change", function () {
      if (!S.und) return;
      S.und.mPath = ump.value;
      blurContent();
      render();
    });
    var uep = $("und-edit-pathmode");
    if (uep) uep.addEventListener("change", function () {
      if (!S.und) return;
      S.und.editPathMode = uep.value;
      blurContent();
      render();
    });
    var uaf = $("und-auto-form");
    if (uaf) uaf.addEventListener("submit", function (e) {
      e.preventDefault();
      undAutoPreview(uaf);
    });
    var utf = $("und-tun-form");
    if (utf) utf.addEventListener("submit", function (e) {
      e.preventDefault();
      undCreateTunnel(utf);
    });
    var uef = $("und-tun-edit-form");
    if (uef) uef.addEventListener("submit", function (e) {
      e.preventDefault();
      undUpdateTunnel(uef);
    });
    var upf = $("und-path-form");
    if (upf) upf.addEventListener("submit", function (e) {
      e.preventDefault();
      undSavePath(upf, "");
    });
    var upef = $("und-path-edit-form");
    if (upef) upef.addEventListener("submit", function (e) {
      e.preventDefault();
      if (S.und) undSavePath(upef, S.und.editPath);
    });

    var snf = $("und-site-new-form");
    if (snf) snf.addEventListener("submit", function (e) {
      e.preventDefault();
      undCreateSite(snf);
    });
    var sef = $("und-site-edit-form");
    if (sef) sef.addEventListener("submit", function (e) {
      e.preventDefault();
      undUpdateSite(sef);
    });
    // A correction should retire the message it corrects.
    [snf, sef].forEach(function (f) {
      if (!f) return;
      f.addEventListener("input", function () {
        var slot = $(f.id.replace("-form", "-err"));
        if (slot) slot.textContent = "";
      });
    });
    // A dropdown's value only exists on "change"; the generic [data-act] click
    // handler below would read it before the user has picked anything.
    document.querySelectorAll('#content select[data-act="node-site"]').forEach(function (el) {
      el.addEventListener("change", function () {
        var node = Number(el.getAttribute("data-node"));
        var v = el.value;
        blurContent();
        if (v === "__new") {
          var t = undSitesStore();
          t.form = { node: node };
          t.edit = null;
          t.note = null;
          render();
          var name = $("und-site-name");
          if (name) name.focus();
          return;
        }
        undAssignSite(node, v);
      });
    });

    // The map is the one part of the console that is not a string: panning and
    // zooming must repaint at pointer rate, and a 10s frame that rebuilds
    // #content from HTML would throw the viewport away. The shell above is the
    // string; this attaches the behaviour and paints the canvas from S.topo.
    if (S.view === "underlay-topology") undMapAttach();

    document.querySelectorAll("#content [data-act]").forEach(function (el) {
      el.addEventListener("click", function () {
        var act = el.getAttribute("data-act");
        if (act === "refresh") {
          load().then(function () { toast("已刷新"); });
          if (S.view === "monitor") loadMetrics();
        }
        else if (act === "goto") {
          if (S.view === "enroll") S.codeReveal = null;
          S.view = el.getAttribute("data-view");
          if (S.view === "config") openConfig();
          render();
        }
        else if (act === "copy") copyText(el.getAttribute("data-text"));
        else if (act === "claim") {
          api("POST", "/api/claims", { tenant_id: el.getAttribute("data-tenant") })
            .then(function (c) {
              toast("已下发授权「" + c.name + "」（可激活 " + c.max_uses + " 台）");
              load();
            }).catch(function (err) { toast(err.message); });
        } else if (act === "claim-code") {
          var cid = el.getAttribute("data-id");
          var sel = el.parentNode.querySelector("select[data-role=ttl]");
          var ttl = sel ? Number(sel.value) : 300;
          el.disabled = true;
          api("POST", "/api/claims/code", { id: cid, ttl_sec: ttl })
            .then(function (res) {
              S.codeReveal = res;
              toast("入网码已生成，有效期至 " + clock(res.expires_at_unix));
              blurContent();
              return load();
            }).then(revealIntoView).catch(function (err) {
              el.disabled = false;
              toast(err.message);
            });
        } else if (act === "code-dismiss") {
          S.codeReveal = null;
          render();
        } else if (act === "edit-max") {
          var gid = el.getAttribute("data-id");
          var gname = el.getAttribute("data-name") || "入网授权";
          var used = Number(el.getAttribute("data-used")) || 0;
          var v = prompt("「" + gname + "」的可激活台数（已激活 " + used + " 台，不能低于它）：", el.getAttribute("data-max"));
          if (v === null) return;
          var n = Number(String(v).trim());
          if (!v.trim() || !Number.isFinite(n) || n < 1) { toast("台数必须是 1 以上的整数"); return; }
          api("POST", "/api/claims/update", { id: gid, max_uses: Math.trunc(n) })
            .then(function (c) { toast("名额已改为 " + c.max_uses + " 台"); load(); })
            .catch(function (err) { toast(err.message); });
        } else if (act === "revoke") {
          var rid = el.getAttribute("data-id");
          var rname = el.getAttribute("data-name") || "入网授权";
          if (!confirm("吊销授权「" + rname + "」？客户将无法再为它生成入网码；已入网设备不受影响。")) return;
          api("POST", "/api/claims/revoke", { id: rid })
            .then(function () { toast("已吊销"); load(); })
            .catch(function (err) { toast(err.message); });
        } else if (act === "reset") {
          var user = el.getAttribute("data-user");
          if (!confirm("为 " + user + " 生成新的临时密码？对方会被立刻登出。")) return;
          api("POST", "/api/accounts/reset", { username: user })
            .then(function (res) {
              S.lastSecret = { title: "账号 " + res.account.username + " 的密码已重置",
                username: res.account.username, password: res.password };
              toast("已重置 " + user + " 的密码");
              load();
            }).catch(function (err) { toast(err.message); });
        } else if (act === "cfg-layer") {
          if (!S.cfg) return;
          S.cfg.layer = el.getAttribute("data-layer");
          S.cfg.edit = null;
          render();
        } else if (act === "cfg-save") cfgSave();
        else if (act === "cfg-publish") cfgPublish();
        else if (act === "cfg-reload") {
          if (!S.cfg) return;
          if (S.cfg.dirty && !confirm("放弃未保存的改动并重新载入？")) return;
          S.cfg.view = null;
          S.cfg.draft = null;
          S.cfg.dirty = false;
          S.cfg.edit = null;
          S.cfg.note = null;
          S.cfg.bundle = null;
          render();
          loadConfig();
        } else if (act === "cfg-bundle") cfgDownloadBundle();
        else if (act === "cfg-bundle-copy") cfgBundleCopy();
        else if (act === "cfg-note-x") { S.cfg.note = null; render(); }
        else if (act === "cfg-ptab") { S.cfg.ptab = el.getAttribute("data-ptab"); render(); }
        else if (act === "cfg-vpn-add") cfgAddVPN();
        else if (act === "cfg-vpn-del") cfgDelVPN(Number(el.getAttribute("data-id")));
        else if (act === "cfg-if-add") cfgAddIface();
        else if (act === "cfg-if-edit") cfgEditIface(Number(el.getAttribute("data-i")));
        else if (act === "cfg-if-del") cfgDelIface(Number(el.getAttribute("data-i")));
        else if (act === "cfg-if-cancel") { S.cfg.edit = null; render(); }
        else if (act === "cfg-if-save") cfgSaveIface();
        else if (act === "cfg-st-add") cfgAddStatic();
        else if (act === "cfg-st-del") cfgDelStatic(Number(el.getAttribute("data-i")));
        else if (act === "cfg-nb-add") cfgAddNeighbor();
        else if (act === "cfg-nb-del") cfgDelNeighbor(Number(el.getAttribute("data-i")));
        else if (act === "und-reload") undReload();
        else if (act === "und-save") undSave(false).catch(function () {});
        else if (act === "und-publish") undPublish();
        else if (act === "und-note-x") {
          if (S.und) S.und.note = null;
          if (S.sites) S.sites.note = null;
          blurContent();
          render();
        }
        // Every one of these three is a request to repaint a form that the click
        // just ended. render() skips its frame while focus sits in #content, so
        // without the blur the button visibly does nothing; the typed values
        // survive the rebuild through the keep pass above.
        else if (act === "site-form-x") {
          var ts = undSitesStore();
          ts.form = null;
          ts.note = null;
          blurContent();
          render();
        }
        else if (act === "site-edit") {
          var te = undSitesStore();
          te.edit = (te.edit === el.getAttribute("data-id")) ? null : el.getAttribute("data-id");
          te.form = null;
          blurContent();
          render();
        }
        else if (act === "site-edit-x") {
          var tx = undSitesStore();
          tx.edit = null;
          blurContent();
          render();
        }
        else if (act === "site-del") {
          undDeleteSite(el.getAttribute("data-id"), el.getAttribute("data-name") || "该站点");
        }
        else if (act === "und-avoid-add") undAddAvoid();
        else if (act === "und-avoid-del") undDelAvoid(Number(el.getAttribute("data-i")));
        else if (act === "und-auto-apply") undAutoApply();
        else if (act === "und-tun-edit") {
          if (!S.und || !S.und.doc) return;
          var et = undTunnelOf(S.und.doc, el.getAttribute("data-id"));
          if (!et) return;
          S.und.editTun = et.id;
          S.und.editPathMode = undTunnelPathMode(et);
          blurContent();
          render();
        }
        else if (act === "und-tun-cancel") {
          if (!S.und) return;
          S.und.editTun = null;
          S.und.editPathMode = null;
          render();
        }
        else if (act === "und-tun-del") undDeleteTunnel(el.getAttribute("data-id"));
        else if (act === "und-path-edit") {
          if (!S.und) return;
          S.und.editPath = el.getAttribute("data-id");
          blurContent();
          render();
        }
        else if (act === "und-path-cancel") {
          if (!S.und) return;
          S.und.editPath = null;
          render();
        }
        else if (act === "und-path-del") undDeletePath(el.getAttribute("data-id"));
        else if (act === "topo-view") {
          // 换视图 = 换整套摆法，缩放与平移对它没有意义，所以回到全图；
          // 选中项留着，两视图里指的是同一台设备。
          var tv = el.getAttribute("data-v") === "logical" ? "logical" : "geo";
          if (S.topo.view !== tv) {
            S.topo.view = tv;
            S.topo.k = 1; S.topo.x = 0; S.topo.y = 0;
            blurContent();
            render();
          }
        }
        else if (act === "topo-zoom") {
          var f0 = mapFrame();
          undMapZoomTo([f0.w / 2, f0.h / 2], el.getAttribute("data-d") === "1" ? 1.6 : 1 / 1.6);
        }
        else if (act === "topo-fit") undMapFit();
        else if (act === "topo-world") undMapReset();
        else if (act === "topo-world-retry") {
          MAP.err = null; MAP.loading = null; MAP.world = null;
          ensureWorld();
          render();
        }
        else if (act === "disable") {
          var name = el.getAttribute("data-user");
          var off = el.getAttribute("data-disabled") === "true";
          if (off && !confirm("禁用账号 " + name + "？该账号会立刻被登出。")) return;
          api("POST", "/api/accounts/disable", { username: name, disabled: off })
            .then(function () {
              toast((off ? "已禁用 " : "已启用 ") + name);
              load();
            }).catch(function (err) { toast(err.message); });
        }
      });
    });

    document.querySelectorAll("#nav a[data-view]").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var v = a.getAttribute("data-view");
        if (!allowed(v)) return;
        // 一次性码只在该页面上保留；离开就等于放弃这次查看，要回看只能重新生成。
        if (S.view === "enroll" && v !== "enroll") S.codeReveal = null;
        S.view = v;
        if (v === "config") openConfig();
        render();
      };
    });
  }

  // The reveal box renders at the top of the view; on a page with many grants
  // that is above the fold, so the click looks like it did nothing.
  function revealIntoView() {
    var box = document.getElementById("code-reveal");
    if (box && box.scrollIntoView) box.scrollIntoView({ block: "nearest" });
  }

  function selectCodeFor(t) {
    var want = String(t).replace(/\s+/g, "");
    var els = document.querySelectorAll("#content .copybox code");
    for (var i = 0; i < els.length; i++) {
      if (els[i].textContent.replace(/\s+/g, "") === want) {
        var r = document.createRange();
        r.selectNodeContents(els[i]);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
        return true;
      }
    }
    return false;
  }

  // Embedded webviews routinely deny clipboard-write (writeText rejects with
  // NotAllowedError), so there has to be a path that does not need that
  // permission: legacy textarea+execCommand, then "select it and say ⌘C".
  function copyText(t) {
    function done() { toast("已复制"); }
    function manual() {
      if (selectCodeFor(t)) toast("浏览器不允许自动复制：内容已选中，按 ⌘C / Ctrl+C");
      else toast("浏览器不允许自动复制，请手动选择：" + t);
    }
    function legacy() {
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      var ok = false;
      try {
        ta.select();
        ok = document.execCommand("copy");
      } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) done();
      else manual();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, legacy);
    } else {
      legacy();
    }
  }

  /* ---------------- start ---------------- */

  api("GET", "/api/session").then(bootSession).catch(showLogin);
})();
</script>
