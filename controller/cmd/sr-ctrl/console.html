  /* ---------------- 反射器（RR）：本租户自己的表 ---------------- */

  // 一条 RR 属于一个租户，所以它的表、它的分组、它的设备都在这一个租户的页面上：
  // 运营方看不到也改不了，归属也就不会有第二处判断。表本身来自 GET /api/overlay
  // 已经带来的 doc.rr_library —— 页面能编的这份和渲染第 4 段用的那份是同一个过滤器
  // 过滤出来的，写口是 /api/rrs。
  //
  // 页面上不出现「主/备」这种暗示择一的词：设备对拿到的每一条 RR 都保持会话，两条
  // 就是两条等价活动反射器，分组里的两格也一样。
  //
  // 谁都不发布：一次 RR 改动只改变下一次发布的输入，正在跑的设备保持它已经装上的
  // 那一版。

  function ovRRRow(id) {
    var o = ovStore();
    var rows = (o.doc && o.doc.rr_library) || [];
    for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i];
    return null;
  }

  // Every write answers with the whole list, so the page takes the whole list: a
  // refused delete and a row a 分组 has started naming are exactly the things one
  // edit changes for the *other* rows, and a group's 格 references one by id.
  function ovRRApply(res, msg, short) {
    var o = ovStore();
    if (!o.doc) return;
    if (res && res.rrs) o.doc.rr_library = res.rrs;
    if (res && res.max_rrs) o.doc.max_rrs = Number(res.max_rrs) || o.doc.max_rrs;
    o.rre = null;
    o.note = { kind: "", text: msg };
    blurContent();
    render();
    toast(short || "已保存");
  }

  function ovRRBody(f, p) {
    return {
      name: String(f.get(p + "-name") || "").trim(),
      addr: String(f.get(p + "-addr") || "").trim(),
      location: String(f.get(p + "-loc") || "").trim()
    };
  }

  function ovRRCreate(form) {
    var body = ovRRBody(new FormData(form), "ov-rr-new");
    if (!body.name) { ovErr("ov-rr-new-err", "名称必填"); return; }
    if (!body.addr) { ovErr("ov-rr-new-err", "地址必填，而且要带端口（ip:port 或 域名:port）"); return; }
    api("POST", "/api/rrs", body).then(function (res) {
      releaseForm(form);
      ovRRApply(res, "已加入「" + body.name + "」" +
        (res && res.rr ? "（" + res.rr.id + "）" : "") +
        "。它只进库，不改变任何设备：要让它真被拨，得在「导通策略」的设备表里把它选进那台设备的 RR 1 或 RR 2，再到「基础配置」发布。", "已加入");
    }).catch(function (err) { ovErr("ov-rr-new-err", err.message); });
  }

  function ovRRSaveEdit(form) {
    var o = ovStore();
    if (!o.rre) return;
    var body = ovRRBody(new FormData(form), "ov-rr-edit");
    body.id = o.rre.id;
    if (!body.name) { ovErr("ov-rr-edit-err", "名称必填"); return; }
    if (!body.addr) { ovErr("ov-rr-edit-err", "地址必填，而且要带端口（ip:port 或 域名:port）"); return; }
    api("PUT", "/api/rrs", body).then(function (res) {
      ovRRApply(res, "已更新 " + body.id +
        (res && res.addr_changed ? "：地址变了，发布之后设备才会拨新地址。" : "：地址没变。"), "已更新");
    }).catch(function (err) { ovErr("ov-rr-edit-err", err.message); });
  }

  function ovRRDelete(id, name) {
    if (!confirm("删除 RR「" + name + "」（" + id + "）？\n\n控制器不会去连这个地址，所以删它不碰任何设备。" +
      "被某台设备的 RR 1 / RR 2 选着的会拒绝删除：要先到「导通策略」里把那一格改成别的。")) return;
    var o = ovStore();
    api("POST", "/api/rrs/delete", { id: id }).then(function (res) {
      ovRRApply(res, "已删除 " + id + "。它的号不会再发给新的条目。", "已删除");
    }).catch(function (err) {
      if (!o.doc) return;
      o.note = undErrNote(err);
      blurContent();
      render();
    });
  }

  function ovRRFields(p, v) {
    v = v || {};
    return '<div class="field"><label for="' + p + '-name">名称</label>' +
      '<input id="' + p + '-name" name="' + p + '-name" value="' + esc(v.name) +
      '" maxlength="80" placeholder="如 上海反射器-1"></div>' +
      '<div class="field"><label for="' + p + '-addr">地址（必须带端口）</label>' +
      '<input id="' + p + '-addr" name="' + p + '-addr" value="' + esc(v.addr) +
      '" spellcheck="false" maxlength="253" placeholder="rr.example.net:18446"></div>' +
      '<div class="field"><label for="' + p + '-loc">位置（手填，纯文本）</label>' +
      '<input id="' + p + '-loc" name="' + p + '-loc" value="' + esc(v.location) +
      '" maxlength="120" placeholder="如 上海 · 机房A"></div>';
  }

  // The devices column is the delete guard's answer before the click: a row some
  // device's RR 1 / RR 2 still names cannot be deleted, so the row has to say so
  // itself.
  function ovRRUsedCell(row) {
    var ds = row.devices || [];
    if (!ds.length) return '<span class="muted">没有设备在用</span>';
    return '<span class="mono">' + esc(ds.map(function (d) {
      return "node-" + d.node_id + (d.name ? "（" + d.name + "）" : "");
    }).join("、")) + "</span>";
  }

  function ovRRUpdatedCell(row) {
    var t = row.updated_at_unix || row.created_at_unix;
    if (!t) return '<span class="muted">—</span>';
    return '<span class="muted" style="font-size:12px">' + esc(clock(t)) +
      (row.updated_at_unix ? "" : "（建）") + " · " + esc(ago(t)) + "</span>";
  }

  function ovRRPanel(doc, o) {
    var rows = doc.rr_library || [];
    var max = Number(doc.max_rrs) || 0;
    var h = '<section class="panel"><header><h2>反射器（RR）</h2>' +
      '<span class="muted" style="font-size:12.5px">' + rows.length + " 条" +
      (max ? " · 上限 " + max : "") + "</span></header>" +
      '<div class="hint">' + esc(doc.rr_note) + "</div>" +
      '<div class="hint">这里只是库：哪台设备连哪两台，在「Overlay 配置 › 导通策略配置」的成员表里选（RR 1 / RR 2 两列）。' +
      "没被任何设备选中的条目在库里躺着，不影响任何设备。</div>" +
      '<div class="hint">地址必须带端口：设备上的路由进程要从 host:port 里拆出 TLS 服务名，' +
      "少了端口只能到设备上过一遍才知道写错了。同一条地址不能加两次——一台盒子两个身份会把同一份路由反射两遍。</div>" +
      '<form id="ov-rr-new-form"><div class="fields">' + ovRRFields("ov-rr-new", null) +
      '<button class="primary" type="submit"' + (max && rows.length >= max ? " disabled" : "") +
      ">添加</button></div>" +
      '<div class="err" id="ov-rr-new-err" role="alert"></div></form>';
    if (!rows.length) {
      return h + '<div class="empty" style="margin-top:10px">还没有 RR：控制器不下发 <code>rrs</code> 这个键，' +
        "设备继续用它盘上自己那一份。要让控制器接管，就在上面添加。</div></section>";
    }
    h += "<table><thead><tr><th>名称</th><th>地址</th><th>位置</th><th>用它的设备</th><th>更新</th><th></th></tr></thead><tbody>";
    rows.forEach(function (row) {
      var editing = o.rre && o.rre.id === row.id;
      h += "<tr>" +
        "<td><b>" + esc(row.name) + '</b> <span class="muted mono">' + esc(row.id) + "</span></td>" +
        '<td class="mono">' + esc(row.addr) + "</td>" +
        "<td>" + (row.location ? esc(row.location) : '<span class="muted">未填</span>') + "</td>" +
        "<td>" + ovRRUsedCell(row) + "</td>" +
        "<td>" + ovRRUpdatedCell(row) + "</td>" +
        '<td class="row-actions">' +
        '<button class="small" data-act="ov-rr-edit" data-id="' + esc(row.id) + '">' +
        (editing ? "收起" : "编辑") + '</button>' +
        '<button class="small danger" data-act="ov-rr-del" data-id="' + esc(row.id) +
        '" data-name="' + esc(row.name) + '">删除</button>' +
        "</td></tr>";
      if (editing) {
        h += '<tr><td colspan="6"><form id="ov-rr-edit-form"><div class="fields">' +
          ovRRFields("ov-rr-edit", o.rre) +
          '<button class="primary" type="submit">保存</button> ' +
          '<button class="small" type="button" data-act="ov-rr-edit-x">取消</button></div>' +
          '<div class="hint" style="margin:8px 0 0">整行覆盖：改地址只影响下一次发布。</div>' +
          '<div class="err" id="ov-rr-edit-err" role="alert"></div></form></td></tr>';
      }
    });
    h += "</tbody></table>" +
      '<div class="hint" style="margin-top:8px">号（rr1、rr2…）删了不回收，所以下一次添加的一定是个新号，' +
      "不会复活刚删掉的那一条。</div>";
    return h + "</section>";
  }

  /* ---------------- Overlay：全局（反射器 + 逃生开关）与导通策略 ---------------- */

  function ovStore() {
    if (!S.ov) S.ov = { doc: null, at: 0, loading: false, note: null, g: null, edit: null, rre: null };
    return S.ov;
  }

  function ovRole() { return !!(S.me && S.me.role === "tenant"); }

  function ensureOverlay() {
    var o = ovStore();
    if (!ovRole()) return o;
    if (o.loading) return o;
    if (!o.doc || nowSec() - o.at >= 10) loadOverlay();
    return o;
  }

  function loadOverlay() {
    var o = ovStore();
    if (!ovRole() || o.loading) return;
    o.loading = true;
    api("GET", "/api/overlay").then(function (doc) {
      o.loading = false;
      if (!doc) { render(); return; }
      ovSetDoc(doc);
      if (o.note && o.note.fromLoad) o.note = null;
      render();
    }).catch(function (err) {
      o.loading = false;
      o.note = undErrNote(err);
      o.note.fromLoad = true;
      render();
    });
  }

  // The two slots are a draft, not a live read: a poll must not silently undo a
  // selection the tenant has just made but not saved yet.
  // 逃生开关是一个草稿，不是一份实时读数：轮询不能把租户刚勾上、还没保存的那一下
  // 悄悄改回去。
  function ovSetDoc(doc) {
    var o = ovStore();
    o.doc = doc;
    o.at = nowSec();
    o.loading = false;
    if (!o.g) o.g = { escape: !!doc.escape_all_colors };
    ovPrune(doc);
  }

  // A device that has since been unenrolled cannot stay in an open editor: the
  // controller would refuse the whole save over it, and the row would look fine.
  function ovPrune(doc) {
    var o = ovStore();
    var ids = {};
    (doc.nodes || []).forEach(function (n) { ids[n.node_id] = true; });
    // The same for an RR row that was deleted in another tab: its editor would
    // submit a PUT the controller answers with 404 and no visible cause.
    if (o.rre && !ovRRRow(o.rre.id)) o.rre = null;
    if (!o.edit) return;
    o.edit.members = o.edit.members.filter(function (m) { return !m.node || ids[m.node]; });
  }

  function ovErr(slot, text) {
    var el = $(slot);
    if (el) { el.textContent = text; return; }
    ovStore().note = { kind: "bad", text: text };
    render();
  }

  // The library is already filtered by the controller: a tenant never receives
  // another tenant's exclusive row. The one case a picker still has to name is a
  // stored selection that is no longer pickable (row deleted), because dropping it
  // from the list would turn the next save into a different choice the tenant never
  // made.
  // `cur` is the slot's current id, not the slot's name: every device row has its
  // own two slots, and a stale value has to stay visible in whichever row it
  // belongs to.
  function ovRRItems(doc, cur) {
    var items = (doc.rr_library || []).map(function (it) {
      return { value: it.id,
        text: it.name + " — " + it.addr + (it.location ? " — " + it.location : ""),
        tags: "" };
    });
    var seen = items.some(function (it) { return it.value === cur; });
    if (cur && !seen) {
      items.unshift({ value: cur, text: cur + "（当前选择，库里已经没有这一条）", tags: "" });
    }
    return items;
  }

  function ovGlobalForm(o, doc) {
    var g = o.g;
    var h = '<section class="panel"><header><h2>逃生开关</h2></header>' +
      '<form id="ov-global-form">' +
      '<label class="chk"><input type="checkbox" id="ov-escape"' + (g.escape ? " checked" : "") +
      "> 主表收全部颜色</label>" +
      '<div class="hint">这里的「主表」是<b>每个 VPN 自己那张表</b>（不是只有 VPN 0）：一条路由按 RT 落进哪张表，' +
      "开关就作用在哪张表上。打开后每张表除了颜色 0 还收下其它颜色的路径，谁先用由 preference=230+颜色 " +
      "交给 VPP 原生排序 —— 颜色 0 全 down 时自动抬最小的存活颜色，恢复后自动回落。关掉时每张表只收颜色 0，" +
      "颜色 0 全 down 这条前缀在那张表里就不存在（宁丢，不长期占用昂贵的颜色）。" +
      "注意这里管的是「一张表收哪些颜色」，和「路由能不能进这张表」（那是导通策略配置里 RT 命中）是两件正交的事。</div>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center">' +
      '<button class="small" type="button" data-act="ov-reload">重新载入</button>' +
      '<button class="small" type="submit">保存</button>' +
      '<button class="small primary" type="button" data-act="goto" data-view="config">去「基础配置」发布</button>' +
      "</div>" +
      '<div class="hint" style="margin-top:12px">这三个按钮各做一件事：<b>保存</b>只把这一格写进控制器的草稿，' +
      "设备那边一个字都不变；<b>重新载入</b>丢掉你还没保存的勾选，重新从控制器读一遍（保存失败或改主意时用）；" +
      "<b>去「基础配置」发布</b>才把当前这一版发给设备——发布之后设备也要等下一次心跳才拉下来，所以" +
      "「保存了但没发布」和「发布了但设备还没拉」都不是故障。</div>" +
      "</form></section>";
    return h;
  }

  function ovSaveGlobal() {
    var o = ovStore();
    if (!o.doc || !o.g) return;
    var body = { escape_all_colors: !!o.g.escape };
    api("PUT", "/api/overlay/settings", body).then(function (res) {
      ovSetDoc(res.overlay || o.doc);
      o.note = { kind: "", text: "已保存。这一页保存的是下一次发布的输入：到「基础配置」发布以后，设备才会换成这一版。" };
      blurContent();
      render();
      toast("已保存");
    }).catch(function (err) {
      o.note = undErrNote(err);
      blurContent();
      render();
    });
  }

  function viewOverlaySettings() {
    var o = ensureOverlay();
    var doc = o.doc;
    if (!doc) {
      return '<section class="panel"><div class="empty">' +
        esc(o.note ? o.note.text : "正在读取 overlay 配置…") + "</div></section>";
    }
    var h = "";
    if (o.note) h += undNote(o.note);
    h += ovRRPanel(doc, o);
    h += ovGlobalForm(o, doc);
    h += undChecksPanel(doc);
    h += '<section class="panel"><header><h2>这一页不管的地址池</h2></header>' +
      '<div class="hint">overlay 地址池（<code>overlay_cidr</code>）与隧道/中转端口属于 Underlay，' +
      "在「Underlay 配置 › 全局配置」里改，这一页不复制它的值——两处显示同一个数就会有两处可能说错。" +
      "导通策略的 RT 也不在这里编辑：它由控制器分配，见「Overlay 配置 › 导通策略配置」。</div></section>";
    return h;
  }

  /* ---------------- 导通策略：组列表 + 组编辑 + 每台设备的展开 ---------------- */

  function ovNodeOf(doc, id) {
    var out = null;
    (doc.nodes || []).forEach(function (n) { if (n.node_id === id) out = n; });
    return out;
  }

  function ovNodeItems(nodes) {
    return (nodes || []).map(function (n) {
      var st = n.status === "online" ? "在线" : n.status === "stale" ? "失联" : "未上线";
      return { value: String(n.node_id),
        text: "node-" + n.node_id + (n.name ? " · " + n.name : "") + " · " + st, tags: st };
    });
  }

  function ovVpnOptions(node, cur) {
    if (!node) return '<option value="">先选设备</option>';
    var list = node.vrfs || [];
    if (!list.length) return '<option value="">这台设备没有 VPN 表</option>';
    // 空值必须是列表里真实存在的一格：否则改完设备后模型里是「未选」，画面上却是
    // 第一项看起来像已经选中，提交时那一行会凭空消失。
    var h = '<option value="">选择 VPN</option>';
    list.forEach(function (v) {
      h += '<option value="' + esc(v.id) + '"' + (cur !== "" && cur !== null && String(v.id) === String(cur) ? " selected" : "") +
        (v.selectable ? "" : " disabled") + ">VPN " + esc(v.id) +
        (v.name ? " · " + esc(v.name) : "") + (v.selectable ? "" : "（" + esc(v.note) + "）") + "</option>";
    });
    return h;
  }

  // 成员是表格 + 过滤 + 分页：一个策略最多 doc.max_members 行，上千台设备的租户里逐行
  // 铺开的表单会长到没法用。改动只发生在两处——顶部的「添加成员」与行上的「移出」——
  // 所以行里不放控件：要改一行就是移出再加。
  var ovMembersPerPage = 10;

  function ovMemberKey(m) { return m.node + "/" + m.vpn; }

  // 过滤只作用于「画出来的那部分」，草稿里的成员数组一行不动：过滤是看的方式，
  // 不是保存的内容。
  function ovMemberFiltered(doc, edit) {
    var q = String(edit.filter || "").trim().toLowerCase();
    var out = [];
    edit.members.forEach(function (m, i) {
      var node = ovNodeOf(doc, m.node);
      var vname = "";
      ((node && node.vrfs) || []).forEach(function (v) { if (String(v.id) === String(m.vpn)) vname = v.name || ""; });
      var label = "node-" + m.node + " " + ((node && node.name) || "") +
        " vpn " + m.vpn + " " + vname;
      if (q && label.toLowerCase().indexOf(q) < 0) return;
      out.push({ m: m, i: i, node: node, vname: vname });
    });
    return out;
  }

  function ovMemberPages(rows, edit) {
    var pages = Math.max(1, Math.ceil(rows.length / ovMembersPerPage));
    return { pages: pages, page: Math.min(Math.max(0, edit.page | 0), pages - 1) };
  }

  // 这一格不跟着策略草稿走：策略回答「哪些表互通」，RR 回答「这台设备问谁要路由」，
  // 两件事分开存（PUT /api/overlay/device-rr，一台设备一次），所以改 RR 不会顺手改
  // 掉策略里还没保存的东西，反过来也一样。
  function ovRRSlotSelect(doc, node, slot) {
    var b = (doc.rr_binds || {})[String(node)] || {};
    var cur = (slot === "primary" ? b.primary : b.backup) || "";
    var label = slot === "primary" ? "RR 1" : "RR 2";
    var h = '<select class="rr-slot" data-keep data-ov-rr-slot="' + slot + '" data-ov-rr-node="' + esc(node) +
      '" aria-label="node-' + esc(node) + ' 的 ' + label + '">' +
      '<option value=""' + (cur ? "" : " selected") + ">不用（不建邻居）</option>";
    ovRRItems(doc, cur).forEach(function (it) {
      h += '<option value="' + esc(it.value) + '"' + (it.value === cur ? " selected" : "") + ">" +
        esc(it.text) + "</option>";
    });
    return h + "</select>";
  }

  function ovSetDeviceRR(node, slot, id) {
    var o = ovStore();
    if (!o.doc) return;
    var b = (o.doc.rr_binds || {})[String(node)] || {};
    var body = { node_id: node, primary: b.primary || "", backup: b.backup || "" };
    body[slot] = id || "";
    var label = slot === "primary" ? "RR 1" : "RR 2";
    api("PUT", "/api/overlay/device-rr", body).then(function (res) {
      ovSetDoc(res.overlay || o.doc);
      o.note = { kind: "", text: "node-" + node + " 的 " + label + " 已" +
        (id ? "改成 " + id : "清空") + "。这一格是下一次发布的输入：到「基础配置」发布以后，" +
        "设备才会" + (id ? "拨它" : "撤掉那条会话") + "。" };
      blurContent();
      render();
      toast("已保存");
    }).catch(function (err) {
      o.note = undErrNote(err);
      blurContent();
      render();
    });
  }

  function ovMemberBody(doc, edit) {
    if (!edit.members.length) {
      return '<tr><td colspan="6" class="muted">还没有成员：在上面选一台设备和一张 VPN，点「添加成员」。</td></tr>';
    }
    var rows = ovMemberFiltered(doc, edit);
    if (!rows.length) {
      return '<tr><td colspan="6" class="muted">没有匹配「' + esc(edit.filter) + '」的成员。</td></tr>';
    }
    var p = ovMemberPages(rows, edit);
    var h = "";
    // RR 1 / RR 2 是设备自己的属性，不是（设备, VPN）这一对的：同一台设备带几张
    // VPN 进来就有几行，那几行说的是同一格，两个下拉指向同一个字段只会让其中一行
    // 撒谎。所以选取器只画在这台设备在当前这一页第一次出现的那一行，其余写「同上」。
    var shown = {};
    rows.slice(p.page * ovMembersPerPage, p.page * ovMembersPerPage + ovMembersPerPage).forEach(function (r) {
      var k = String(r.m.node);
      var first = !shown[k];
      shown[k] = 1;
      h += "<tr>" +
        '<td><span class="mono">node-' + esc(r.m.node) + "</span>" +
        (r.node && r.node.name ? '<div class="muted" style="font-size:12px">' + esc(r.node.name) + "</div>" : "") +
        "</td>" +
        "<td><b>VPN " + esc(r.m.vpn) + "</b>" +
        (r.vname ? ' <span class="muted">' + esc(r.vname) + "</span>" : "") + "</td>" +
        '<td class="muted" style="font-size:12.5px">' + ovVpnRTText(doc, r.m) + "</td>" +
        "<td>" + (first ? ovRRSlotSelect(doc, r.m.node, "primary") : '<span class="muted">同上</span>') + "</td>" +
        "<td>" + (first ? ovRRSlotSelect(doc, r.m.node, "backup") : '<span class="muted">同上</span>') + "</td>" +
        '<td class="row-actions"><button class="small danger" type="button" data-act="ov-m-del" data-i="' +
        r.i + '">移出</button></td></tr>';
    });
    return h;
  }

  function ovMemberPager(doc, edit) {
    var rows = ovMemberFiltered(doc, edit);
    var p = ovMemberPages(rows, edit);
    return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px" class="muted">' +
      '<span style="font-size:12.5px">共 ' + edit.members.length + " 行" +
      (rows.length !== edit.members.length ? "，筛出 " + rows.length + " 行" : "") +
      " · 第 " + (p.page + 1) + "/" + p.pages + " 页</span>" +
      '<button class="small" type="button" data-act="ov-m-prev"' + (p.page <= 0 ? " disabled" : "") +
      ">上一页</button>" +
      '<button class="small" type="button" data-act="ov-m-next"' + (p.page >= p.pages - 1 ? " disabled" : "") +
      ">下一页</button></div>";
  }

  function ovMemberEditor(doc, edit) {
    var add = edit.add || (edit.add = { node: "", vpn: "" });
    var addNode = ovNodeOf(doc, Number(add.node));
    var full = edit.members.length >= doc.max_members;
    return '<div class="und-box" style="margin-top:8px">' +
      '<div class="fields" style="align-items:end">' +
      '<div class="field"><label>添加成员 · 设备</label>' +
      dpHtml("ov-m-new", "ov-m-new", ovNodeItems(doc.nodes), add.node,
        { unit: "台", none: "", empty: "选择设备", ph: "先打几个字：node 号 / 名称 / 状态",
          aria: "过滤设备列表", attrs: 'data-ov-mnew="1"' }) + "</div>" +
      '<div class="field"><label for="ov-new-vpn">VPN</label>' +
      '<select id="ov-new-vpn" data-ov-mv="1">' + ovVpnOptions(addNode, add.vpn) + "</select></div>" +
      '<div class="field"><button class="small primary" type="button" data-act="ov-m-add"' +
      (full ? " disabled" : "") + ">＋ 添加成员</button></div></div>" +
      (full ? '<div class="hint">已经到上限 ' + doc.max_members + " 行，要再加先移出一行。</div>" : "") +
      '<div class="err" id="ov-m-err" role="alert"></div></div>' +
      '<div class="fields" style="align-items:end;margin-top:12px"><div class="field">' +
      '<label for="ov-m-q">过滤成员</label>' +
      '<input id="ov-m-q" name="ov-m-q" value="' + esc(edit.filter || "") +
      '" placeholder="node 号 / 设备名 / VPN"></div></div>' +
      '<table style="margin-top:8px"><thead><tr><th>设备</th><th>VPN</th>' +
      "<th>这张表当前导通什么</th><th>RR 1</th><th>RR 2</th><th></th></tr></thead>" +
      '<tbody id="ov-m-tbody">' + ovMemberBody(doc, edit) + "</tbody></table>" +
      '<div class="hint" style="margin:8px 0 0">RR 1 / RR 2 是<b>设备</b>的反射器，不是这一行 VPN 的：' +
      "同一台设备在这张表里出现几行，那几行是同一格。两格都空着的设备一个 RR 邻居也不建，控制器不给它下发 " +
      "<code>rrs</code>，它继续用自己盘上那一份；选了就一直生效，跟这台设备放进哪个策略无关。" +
      "改了立刻存进控制器，但同样要等「基础配置」发布、设备来拉才换——所以改完先别急着看设备那边变。" +
      "RR 本身在「Overlay 配置 › 全局配置」里增删。</div>" +
      '<div id="ov-m-pager">' + ovMemberPager(doc, edit) + "</div>";
  }

  // 过滤与翻页只换 tbody / 分页条，不重画整页：一边打字一边全页重建会把光标弹走，
  // 也会把策略名那种手填字段的输入打断。
  function ovMemberRefresh() {
    var o = ovStore();
    if (!o.edit || !o.doc) return;
    var tb = document.getElementById("ov-m-tbody");
    if (tb) tb.innerHTML = ovMemberBody(o.doc, o.edit);
    var pg = document.getElementById("ov-m-pager");
    if (pg) pg.innerHTML = ovMemberPager(o.doc, o.edit);
  }

  // 添加这一下走整页 render：设备选择器的过滤词与下拉状态都从草稿重建，抽屉里不留
  // 半截状态。新行排在末尾，所以顺手跳到最后一页并清掉过滤，让他看见刚加的那一行。
  function ovMemberAdd() {
    var o = ovStore();
    if (!o.edit || !o.doc) return;
    var add = o.edit.add || (o.edit.add = { node: "", vpn: "" });
    var node = Number(add.node) || 0;
    if (!node) { ovErr("ov-m-err", "先选一台设备"); return; }
    if (add.vpn === "" || add.vpn == null) { ovErr("ov-m-err", "再选一张 VPN"); return; }
    if (o.edit.members.length >= o.doc.max_members) {
      ovErr("ov-m-err", "一个策略最多 " + o.doc.max_members + " 行，要再加先移出一行"); return;
    }
    var key = ovMemberKey({ node: node, vpn: Number(add.vpn) });
    var dup = false;
    o.edit.members.forEach(function (m) {
      if (ovMemberKey({ node: m.node, vpn: Number(m.vpn) }) === key) dup = true;
    });
    if (dup) {
      ovErr("ov-m-err", "node-" + node + " 的 VPN " + add.vpn + " 已经在这个策略里了");
      return;
    }
    o.edit.members.push({ node: node, vpn: Number(add.vpn) });
    o.edit.add = { node: "", vpn: "" };
    o.edit.filter = "";
    o.edit.page = Math.max(0, Math.ceil(o.edit.members.length / ovMembersPerPage) - 1);
    blurContent();
    render();
  }

  // 成员那一行的 RT 取自控制器已经展开好的那份（doc.nodes[].vrfs）：页面上这几行
  // 说的必须是"这一版配置会写成什么"，而不是页面自己按组名猜一遍。
  function ovVpnRTText(doc, m) {
    var node = ovNodeOf(doc, m.node);
    if (!node) return "先选设备";
    if (m.vpn === "" || m.vpn === null || m.vpn === undefined) {
      return node.vrfs && node.vrfs.length ? "选一张 VPN 表" : "这台设备没有 VPN 表";
    }
    var v = null;
    (node.vrfs || []).forEach(function (x) { if (String(x.id) === String(m.vpn)) v = x; });
    if (!v) return "这台设备没有这张表";
    var e = (v.export_rts || []).map(esc).join("、") || "—";
    var im = (v.import_rts || []).map(esc).join("、") || "—";
    return "导出 " + e + " · 导入 " + im;
  }

  function ovGroupEditor(doc, o) {
    var edit = o.edit;
    var isNew = !edit.id;
    var g = null;
    if (!isNew) doc.groups.forEach(function (x) { if (x.id === edit.id) g = x; });
    var h = '<section class="panel"><header><h2>' + (isNew ? "新建导通策略" : "编辑策略 " + esc(edit.id)) + "</h2>" +
      '<span class="muted" style="font-size:12.5px">' + (isNew ? "保存时由控制器分配 RT" : "RT " + esc(g ? g.rt : edit.rt)) + "</span></header>" +
      '<div class="hint">一个策略就是一个互通域：策略里每一行的 VPN 都同时导出与导入这个策略的 RT，' +
      "所以不需要 from/to 一对规则。成员是「设备 + VPN」这一对；同一台设备的不同表可以进不同策略，" +
      "同一张表也可以同时进多个策略（最多 " + doc.max_rts_per_vpn + " 个），它就同时导入这几个域的路由。" +
      "上限：一个策略最多 " + doc.max_members + " 行、本租户最多 " + doc.max_groups + " 个策略。</div>" +
      '<form id="ov-group-form">' +
      '<div class="fields"><div class="field"><label for="ov-g-name">策略名</label>' +
      '<input id="ov-g-name" name="ov-g-name" value="' + esc(edit.name) + '" maxlength="64" placeholder="如 生产网互通"></div></div>' +
      ovMemberEditor(doc, edit) +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
      '<button class="primary" type="submit">' + (isNew ? "新建" : "保存修改") + "</button>" +
      '<button class="small" type="button" data-act="ov-group-x">取消</button></div>' +
      '<div class="hint" style="margin:10px 0 0">' + esc(doc.rt_note) + "</div>" +
      '<div class="err" id="ov-group-err" role="alert"></div></form></section>';
    return h;
  }

  function ovGroupTable(doc) {
    var h = '<section class="panel"><header><h2>导通策略</h2>' +
      '<span class="muted" style="font-size:12.5px">' + doc.groups.length + " 个 · 上限 " + doc.max_groups + "</span></header>";
    if (!doc.groups.length) {
      return h + '<div class="empty">还没有导通策略：一个策略也没有时，每张表都不导入任何 overlay 路由，' +
        "跨 VPN 互访要靠逃生开关或设备等下一版配置。</div></section>";
    }
    h += "<table><thead><tr><th>导通策略</th><th>RT</th><th>成员</th><th>更新</th><th></th></tr></thead><tbody>";
    doc.groups.forEach(function (g) {
      h += "<tr>" +
        "<td><b>" + esc(g.name) + '</b> <span class="muted mono">' + esc(g.id) + "</span></td>" +
        '<td class="mono">' + esc(g.rt) + "</td>" +
        "<td>" + (g.members || []).length + " 行<div class=\"muted\" style=\"font-size:12px\">" +
        esc((g.members || []).map(function (m) {
          return "node-" + m.node_id + "/VPN " + m.vpn_id;
        }).join("、") || "—") + "</div></td>" +
        '<td class="muted" style="font-size:12px">' + esc(clock(g.updated_at_unix || g.created_at_unix)) + "</td>" +
        '<td class="row-actions">' +
        '<button class="small" data-act="ov-group-edit" data-id="' + esc(g.id) + '">' +
        (S.ov.edit && S.ov.edit.id === g.id ? "收起" : "编辑") + "</button>" +
        '<button class="small danger" data-act="ov-group-del" data-id="' + esc(g.id) +
        '" data-name="' + esc(g.name) + '">删除</button>' +
        "</td></tr>";
    });
    return h + "</tbody></table>" +
      '<div class="hint" style="margin-top:8px">删除一个策略只是把这个策略的 RT 从成员表上摘下来：' +
      "已经在那条路由上跑着的流量会等设备下一次装配置才收敛。RT 不会被回收给下一个策略。" +
      "这一页的保存同样要等一次「基础配置」发布才到设备。</div></section>";
  }

  function viewOverlayGroups() {
    var o = ensureOverlay();
    var doc = o.doc;
    if (!doc) {
      return '<section class="panel"><div class="empty">' +
        esc(o.note ? o.note.text : "正在读取 overlay 配置…") + "</div></section>";
    }
    var h = "";
    if (o.note) h += undNote(o.note);
    if (o.edit) h += ovGroupEditor(doc, o);
    else {
      h += '<section class="panel"><header><h2>新建导通策略</h2></header>' +
        '<div class="hint">把要互访的「设备 + VPN」放进同一个策略；策略与策略之间不通，' +
        "这正是导通策略要表达的事。</div>" +
        '<div style="margin-top:10px"><button class="small primary" data-act="ov-group-new">新建</button></div></section>';
    }
    h += ovGroupTable(doc);
    h += undChecksPanel(doc);
    return h;
  }

  function ovGroupStart(doc, id) {
    var o = ovStore();
    if (id) {
      var g = null;
      doc.groups.forEach(function (x) { if (x.id === id) g = x; });
      if (!g) return;
      o.edit = { id: g.id, rt: g.rt, name: g.name, filter: "", page: 0,
        add: { node: "", vpn: "" },
        members: (g.members || []).map(function (m) { return { node: m.node_id, vpn: m.vpn_id }; }) };
    } else {
      o.edit = { id: "", rt: "", name: "", filter: "", page: 0,
        add: { node: "", vpn: "" }, members: [] };
    }
    o.note = null;
  }

  function ovGroupBody() {
    var o = ovStore();
    var edit = o.edit;
    if (!edit) return null;
    var name = String((document.getElementById("ov-g-name") || {}).value || "").trim();
    var members = [];
    edit.members.forEach(function (m) {
      if (!(m.node > 0) || m.vpn === "" || m.vpn == null) return;
      members.push({ node_id: m.node, vpn_id: Number(m.vpn) });
    });
    if (!name) { ovErr("ov-group-err", "策略名必填"); return null; }
    if (!members.length) { ovErr("ov-group-err", "至少一行成员：设备和 VPN 都要选"); return null; }
    var seen = {};
    var uniq = [];
    members.forEach(function (m) {
      var k = m.node_id + "/" + m.vpn_id;
      if (seen[k]) return;
      seen[k] = 1;
      uniq.push(m);
    });
    return { id: edit.id || undefined, name: name, members: uniq };
  }

  function ovSaveGroup(form) {
    var o = ovStore();
    var body = ovGroupBody();
    if (!body) return;
    var isNew = !body.id;
    api(isNew ? "POST" : "PUT", "/api/overlay/group", body).then(function (res) {
      var g = res.group || {};
      o.edit = null;
      ovSetDoc(res.overlay || o.doc);
      o.note = { kind: "", text: "导通策略「" + (g.name || body.name) + "」已" +
        (isNew ? "创建" : "保存") + "，RT " + (g.rt || "沿用原来的") +
        "。这一页保存的是下一次发布的输入：到「基础配置」发布后设备才会装上。" };
      blurContent();
      render();
      toast(isNew ? "导通策略已创建" : "导通策略已保存");
    }).catch(function (err) {
      var n = undErrNote(err);
      if (n.checks) n.text = "这个策略没有保存：" + n.text;
      o.note = n;
      blurContent();
      render();
    });
  }

  function ovDeleteGroup(id, name) {
    var o = ovStore();
    if (!confirm("删除导通策略「" + name + "」（" + id + "）？\n\n" +
      "这个策略的 RT 会从它每行成员的导入/导出里摘掉，成员之间不再互导路由。RT 不会被回收给下一个策略。")) return;
    api("DELETE", "/api/overlay/group?id=" + encodeURIComponent(id)).then(function (res) {
      if (o.edit && o.edit.id === id) o.edit = null;
      ovSetDoc(res.overlay || o.doc);
      o.note = { kind: "", text: "已删除导通策略 " + id + "。到「基础配置」发布以后设备才会装上摘掉这个策略的那一版。" };
      blurContent();
      render();
      toast("已删除");
    }).catch(function (err) {
      o.note = undErrNote(err);
      blurContent();
      render();
    });
  }

  /* ---------------- actions ---------------- */

  // The 10s poll skips re-render while a form field has focus, so it cannot
  // wipe half-typed input. After a submit the response may carry a one-time
  // secret, so drop that focus: otherwise the result box stays hidden until
  // the operator happens to click elsewhere.
  function releaseForm(form) {
    form.reset();
    var a = document.activeElement;
    if (a && a.blur && form.contains(a)) a.blur();
  }

  // Same guard, other shape: a row action (生成 / 重置密码) can fire while the
  // TTL <select> in that row still holds focus, which would swallow the frame
  // that carries the one-time box.
  function blurContent() {
    var a = document.activeElement;
    if (a && a.blur && a.closest && a.closest("#content")) a.blur();
  }

  // An empty number field means "let the server pick", which is 0 on the wire;
  // anything non-numeric is a client mistake and should not silently become 0.
  function intField(f, name) {
    var v = (f.get(name) || "").trim();
    if (v === "") return 0;
    var n = Number(v);
    return Number.isFinite(n) ? Math.trunc(n) : NaN;
  }

  function bind() {
    var tf = $("tenant-form");
    if (tf) tf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(tf);
      var maxUses = intField(f, "claim_max_uses");
      if (isNaN(maxUses)) { toast("授权可激活台数必须是数字"); return; }
      api("POST", "/api/tenants", {
        tenant_id: (f.get("tenant_id") || "").trim(),
        name: (f.get("name") || "").trim(),
        account: (f.get("account") || "").trim(),
        password: f.get("password") || "",
        claim_max_uses: maxUses
      }).then(function (res) {
        S.lastResult = res;
        var msg = "租户 " + res.tenant.tenant_id + " 已创建";
        if (res.account) msg += "，账号 " + res.account.username;
        toast(msg);
        releaseForm(tf);
        load().then(function () { S.view = "tenants"; render(); });
      }).catch(function (err) { toast(err.message); });
    });

    var af = $("account-form");
    if (af) af.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(af);
      var role = f.get("role") || "tenant";
      api("POST", "/api/accounts", {
        username: (f.get("username") || "").trim(),
        role: role,
        tenant_id: role === "tenant" ? (f.get("tenant_id") || "").trim() : "",
        password: f.get("password") || ""
      }).then(function (res) {
        S.lastSecret = res.password
          ? { title: "账号 " + res.account.username + " 已创建", username: res.account.username, password: res.password }
          : null;
        toast("账号 " + res.account.username + " 已创建");
        releaseForm(af);
        if (S.view === "accounts") load();
      }).catch(function (err) { toast(err.message); });
    });

    var cf = $("claim-form");
    if (cf) cf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(cf);
      var maxUses = intField(f, "max_uses");
      if (isNaN(maxUses)) { toast("可激活台数必须是数字"); return; }
      api("POST", "/api/claims", {
        tenant_id: f.get("tenant_id") || "",
        name: (f.get("name") || "").trim(),
        max_uses: maxUses
      }).then(function (c) {
        toast("已下发授权「" + c.name + "」（可激活 " + c.max_uses + " 台）");
        releaseForm(cf);
        load();
      }).catch(function (err) { toast(err.message); });
    });

    var pf = $("password-form");
    if (pf) pf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(pf);
      var np = f.get("new_password") || "";
      if (np !== f.get("confirm")) { toast("两次输入的新密码不一致"); return; }
      api("POST", "/api/password", {
        old_password: f.get("old_password") || "",
        new_password: np
      }).then(function () {
        toast("密码已修改，其他会话已登出");
        releaseForm(pf);
        return api("GET", "/api/session").then(function (s) { S.me = s; });
      }).then(function () { renderChrome(); render(); })
        .catch(function (err) { toast(err.message); });
    });

    var cn = $("cfg-node");
    if (cn) cn.addEventListener("change", function () {
      blurContent();
      selectCfgTarget(cn.value);
    });
    var cv = $("cfg-vpn");
    if (cv) cv.addEventListener("change", function () {
      blurContent();
      if (S.cfg) S.cfg.vpn = Number(cv.value);
      render();
    });
    document.querySelectorAll("#content [data-cfg]").forEach(function (el) {
      el.addEventListener("input", function () {
        if (!S.cfg || !S.cfg.draft) return;
        cfgSetPath(el, el.value);
        csMarkDirty();
      });
    });
    document.querySelectorAll("#content [data-cfg-bool]").forEach(function (el) {
      el.addEventListener("change", function () {
        var cs = S.cfg;
        if (!cs || !cs.draft) return;
        var vpn = cfgVPNOf(cs.draft, cs.vpn);
        if (!vpn) return;
        var p = el.getAttribute("data-cfg-bool");
        if (p === "bgp.on") vpn.bgp.on = el.checked;
        else if (p === "ospf.on") vpn.ospf.on = el.checked;
        csMarkDirty();
        blurContent();
        render();
      });
    });

    document.querySelectorAll("#content [data-und]").forEach(function (el) {
      el.addEventListener("input", function () { undSetField(el); });
    });
    // 设备列表的三个处理器。过滤条件写进 DP（JS 状态）而不是只写进 DOM：
    // 整页每 10 秒重建，只存在于 input 里的词会在下一次重建时消失。
    document.querySelectorAll("#content [data-dp-q]").forEach(function (el) {
      el.addEventListener("input", function () {
        var id = el.getAttribute("data-dp-q");
        if (!DP[id]) return;
        DP[id].q = el.value;
        dpRepaint(id);
      });
    });
    document.querySelectorAll("#content [data-dp-st]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-dp-st");
        if (!DP[id]) return;
        DP[id].st = el.value;
        blurContent();
        dpRepaint(id);
      });
    });
    var uan = $("und-auto-nodes");
    if (uan) uan.addEventListener("change", function () {
      var u = S.und;
      if (!u) return;
      // 选中项就是这次的设备集合；旧预览必须作废，因为「按预览创建」提交的是
      // 预览时冻结的那一份 req，不是眼前的选择。
      u.autoSel = Array.prototype.slice.call(uan.selectedOptions)
        .map(function (op) { return Number(op.value) || 0; })
        .filter(function (v) { return v > 0; });
      u.auto = null;
      render();
    });
    var uam = $("und-auto-mode");
    if (uam) uam.addEventListener("change", function () {
      if (!S.und) return;
      S.und.autoMode = uam.value;
      S.und.auto = null;
      blurContent();
      render();
    });
    var uah = $("und-auto-hub");
    if (uah) uah.addEventListener("change", function () {
      if (!S.und) return;
      S.und.autoHub = Number(uah.value) || 0;
      S.und.auto = null;
      blurContent();
      render();
    });
    var uas = $("und-auto-spoke");
    if (uas) uas.addEventListener("change", function () {
      if (!S.und) return;
      S.und.autoSpoke = uas.value;
      S.und.auto = null;
      blurContent();
      render();
    });
    document.querySelectorAll("#content [data-und-dev]").forEach(function (el) {
      el.addEventListener("change", function () {
        var u = S.und;
        if (!u) return;
        if (el.getAttribute("data-und-dev") === "a") {
          u.mA = Number(el.value) || 0;
          // 本端换了，上一批的结果就不再是"眼前这个动作"的结果；而新本端如果
          // 正好在旧对端里，那台必须出去，否则提交时会被控制器判成"同一台设备"。
          u.mPeers = (u.mPeers || []).filter(function (id) { return id !== u.mA; });
        } else {
          u.mPeers = Array.prototype.slice.call(el.selectedOptions)
            .map(function (op) { return Number(op.value) || 0; })
            .filter(function (v) { return v > 0 && v !== u.mA; });
        }
        u.batch = null;
        blurContent();
        render();
      });
    });
    // 中转链的某一跳换了设备：换完必须重画，因为其它几跳的候选列表要跟着去掉
    // 这台（一条链不能绕回同一台设备）。
    document.querySelectorAll("#content select[data-hop-key]").forEach(function (el) {
      el.addEventListener("change", function () {
        var u = S.und;
        if (!u) return;
        var key = el.getAttribute("data-hop-key");
        var i = Number(el.getAttribute("data-hop-i")) || 0;
        if (!u[key] || !u[key][i]) return;
        u[key][i].node = Number(el.value) || 0;
        blurContent();
        render();
      });
    });
    // 地址是手打的：只写进状态，不重画，否则一边打字一边丢光标。
    document.querySelectorAll("#content input[data-hop-addr]").forEach(function (el) {
      el.addEventListener("input", function () {
        var u = S.und;
        if (!u) return;
        var p = (el.getAttribute("data-hop-addr") || "").split(":");
        var arr = u[p[0]];
        if (!arr) return;
        var hop = arr[Number(p[1])];
        if (hop) hop.addr = el.value;
      });
    });
    var ump = $("und-tun-pathmode");
    if (ump) ump.addEventListener("change", function () {
      if (!S.und) return;
      S.und.mPath = ump.value;
      blurContent();
      render();
    });
    var uep = $("und-edit-pathmode");
    if (uep) uep.addEventListener("change", function () {
      if (!S.und) return;
      S.und.editPathMode = uep.value;
      blurContent();
      render();
    });
    var uaf = $("und-auto-form");
    if (uaf) uaf.addEventListener("submit", function (e) {
      e.preventDefault();
      undAutoPreview(uaf);
    });
    var utf = $("und-tun-form");
    if (utf) utf.addEventListener("submit", function (e) {
      e.preventDefault();
      undCreateTunnel(utf);
    });
    var uef = $("und-tun-edit-form");
    if (uef) uef.addEventListener("submit", function (e) {
      e.preventDefault();
      undUpdateTunnel(uef);
    });
    var upf = $("und-path-form");
    if (upf) upf.addEventListener("submit", function (e) {
      e.preventDefault();
      undSavePath(upf, "");
    });
    var upef = $("und-path-edit-form");
    if (upef) upef.addEventListener("submit", function (e) {
      e.preventDefault();
      if (S.und) undSavePath(upef, S.und.editPath);
    });

    var snf = $("und-site-new-form");
    if (snf) snf.addEventListener("submit", function (e) {
      e.preventDefault();
      undCreateSite(snf);
    });
    var sef = $("und-site-edit-form");
    if (sef) sef.addEventListener("submit", function (e) {
      e.preventDefault();
      undUpdateSite(sef);
    });
    // A correction should retire the message it corrects.
    [snf, sef].forEach(function (f) {
      if (!f) return;
      f.addEventListener("input", function () {
        var slot = $(f.id.replace("-form", "-err"));
        if (slot) slot.textContent = "";
      });
    });

    var pnf = $("pa-new-form");
    if (pnf) pnf.addEventListener("submit", function (e) {
      e.preventDefault();
      paCreate(pnf);
    });
    var peef = $("pa-edit-form");
    if (peef) peef.addEventListener("submit", function (e) {
      e.preventDefault();
      paSaveEdit(peef);
    });
    [pnf, peef].forEach(function (f) {
      if (!f) return;
      f.addEventListener("input", function () {
        var slot = $(f.id.replace("-form", "-err"));
        if (slot) slot.textContent = "";
      });
    });

    /* 反射器（RR）与 Overlay 的表单与选择器 */
    var rnf = $("ov-rr-new-form");
    if (rnf) rnf.addEventListener("submit", function (e) {
      e.preventDefault();
      ovRRCreate(rnf);
    });
    var ref2 = $("ov-rr-edit-form");
    if (ref2) ref2.addEventListener("submit", function (e) {
      e.preventDefault();
      ovRRSaveEdit(ref2);
    });
    [rnf, ref2].forEach(function (f) {
      if (!f) return;
      f.addEventListener("input", function () {
        var slot = $(f.id.replace("-form", "-err"));
        if (slot) slot.textContent = "";
      });
    });
    var ogf = $("ov-global-form");
    if (ogf) ogf.addEventListener("submit", function (e) {
      e.preventDefault();
      ovSaveGlobal();
    });
    var ggf = $("ov-group-form");
    if (ggf) ggf.addEventListener("submit", function (e) {
      e.preventDefault();
      ovSaveGroup(ggf);
    });
    // 组名是手打的，必须当场写回草稿：这个表单里「＋ 加一行成员」和换设备都会
    // 重画，而重画时输入框的 value 是按草稿里的旧名字生成的——keep 那一轮只补
    // 空值、不覆盖非空值，所以不写回状态的话，改的名字会在他点下"＋"的那一刻
    // 静默变回去，提交时挨一句"已保存"却存的是老名字。
    var ogn = $("ov-g-name");
    if (ogn) ogn.addEventListener("input", function () {
      var o = ovStore();
      if (o.edit) o.edit.name = ogn.value;
    });
    // 复选框只改状态，不重画：这一格旁边没有任何由它决定的内容。
    var oes = $("ov-escape");
    if (oes) oes.addEventListener("change", function () {
      ovStore().g.escape = oes.checked;
    });
    // 成员编辑器只在「换了设备」时重画：VPN 下拉的选项由设备决定，换设备后原来那个
    // 号未必还存在，留着它只会让提交时挨一句"设备 X 没有 VPN Y"。
    var omn = document.querySelector("#content select[data-ov-mnew]");
    if (omn) omn.addEventListener("change", function () {
      var o = ovStore();
      if (!o.edit) return;
      var add = o.edit.add || (o.edit.add = { node: "", vpn: "" });
      add.node = omn.value;
      add.vpn = "";
      blurContent();
      render();
    });
    var omv = document.querySelector("#content select[data-ov-mv]");
    if (omv) omv.addEventListener("change", function () {
      var o = ovStore();
      if (!o.edit) return;
      var add = o.edit.add || (o.edit.add = { node: "", vpn: "" });
      add.vpn = omv.value === "" ? "" : Number(omv.value);
    });
    // 过滤只换表格与分页条：整页重建会把光标从输入框里弹出，还会把策略名那种
    // 手填字段的中间状态打断。
    var omq = $("ov-m-q");
    if (omq) omq.addEventListener("input", function () {
      var o = ovStore();
      if (!o.edit) return;
      o.edit.filter = omq.value;
      o.edit.page = 0;
      ovMemberRefresh();
    });
    // RR 1 / RR 2 在成员表里是 <select>，值只在 change 上产生；tbody 会被过滤/翻页
    // 单独重画，所以挂在表单上（表单只在整页重画时才换），不挂在每一格上。
    var ggr = $("ov-group-form");
    if (ggr) ggr.addEventListener("change", function (e) {
      var el = e.target;
      if (!el || !el.getAttribute || !el.getAttribute("data-ov-rr-slot")) return;
      ovSetDeviceRR(Number(el.getAttribute("data-ov-rr-node")), el.getAttribute("data-ov-rr-slot"), el.value);
    });
    // A dropdown's value only exists on "change"; the generic [data-act] click
    // handler below would read it before the user has picked anything.
    document.querySelectorAll('#content select[data-act="node-site"]').forEach(function (el) {
      el.addEventListener("change", function () {
        var node = Number(el.getAttribute("data-node"));
        var v = el.value;
        blurContent();
        if (v === "__new") {
          var t = undSitesStore();
          t.form = { node: node };
          t.edit = null;
          t.note = null;
          render();
          var name = $("und-site-name");
          if (name) name.focus();
          return;
        }
        undAssignSite(node, v);
      });
    });

    // The map is the one part of the console that is not a string: panning and
    // zooming must repaint at pointer rate, and a 10s frame that rebuilds
    // #content from HTML would throw the viewport away. The shell above is the
    // string; this attaches the behaviour and paints the canvas from S.topo.
    if (S.view === "underlay-topology") undMapAttach();

    document.querySelectorAll("#content [data-act]").forEach(function (el) {
      el.addEventListener("click", function () {
        var act = el.getAttribute("data-act");
        if (act === "refresh") {
          load().then(function () { toast("已刷新"); });
          if (S.view === "monitor") loadMetrics();
        }
        else if (act === "goto") {
          if (S.view === "enroll") S.codeReveal = null;
          S.view = el.getAttribute("data-view");
          if (S.view === "config") openConfig();
          render();
        }
        else if (act === "copy") copyText(el.getAttribute("data-text"));
        else if (act === "claim") {
          api("POST", "/api/claims", { tenant_id: el.getAttribute("data-tenant") })
            .then(function (c) {
              toast("已下发授权「" + c.name + "」（可激活 " + c.max_uses + " 台）");
              load();
            }).catch(function (err) { toast(err.message); });
        } else if (act === "claim-code") {
          var cid = el.getAttribute("data-id");
          var sel = el.parentNode.querySelector("select[data-role=ttl]");
          var ttl = sel ? Number(sel.value) : 300;
          el.disabled = true;
          api("POST", "/api/claims/code", { id: cid, ttl_sec: ttl })
            .then(function (res) {
              S.codeReveal = res;
              toast("入网码已生成，有效期至 " + clock(res.expires_at_unix));
              blurContent();
              return load();
            }).then(revealIntoView).catch(function (err) {
              el.disabled = false;
              toast(err.message);
            });
        } else if (act === "code-dismiss") {
          S.codeReveal = null;
          render();
        } else if (act === "edit-max") {
          var gid = el.getAttribute("data-id");
          var gname = el.getAttribute("data-name") || "入网授权";
          var used = Number(el.getAttribute("data-used")) || 0;
          var rsv = Number(el.getAttribute("data-reserved")) || 0;
          var v = prompt("「" + gname + "」的可激活台数（已占用 " + used + " 个" +
            (rsv ? "，其中预授权 " + rsv + " 个还没到货" : "") + "，不能低于已占用）：",
            el.getAttribute("data-max"));
          if (v === null) return;
          var n = Number(String(v).trim());
          if (!v.trim() || !Number.isFinite(n) || n < 1) { toast("台数必须是 1 以上的整数"); return; }
          api("POST", "/api/claims/update", { id: gid, max_uses: Math.trunc(n) })
            .then(function (c) { toast("名额已改为 " + c.max_uses + " 台"); load(); })
            .catch(function (err) { toast(err.message); });
        } else if (act === "revoke") {
          var rid = el.getAttribute("data-id");
          var rname = el.getAttribute("data-name") || "入网授权";
          if (!confirm("吊销授权「" + rname + "」？客户将无法再为它生成入网码；已入网设备不受影响。")) return;
          api("POST", "/api/claims/revoke", { id: rid })
            .then(function () { toast("已吊销"); load(); })
            .catch(function (err) { toast(err.message); });
        } else if (act === "reset") {
          var user = el.getAttribute("data-user");
          if (!confirm("为 " + user + " 生成新的临时密码？对方会被立刻登出。")) return;
          api("POST", "/api/accounts/reset", { username: user })
            .then(function (res) {
              S.lastSecret = { title: "账号 " + res.account.username + " 的密码已重置",
                username: res.account.username, password: res.password };
              toast("已重置 " + user + " 的密码");
              load();
            }).catch(function (err) { toast(err.message); });
        } else if (act === "cfg-save") cfgSave();
        else if (act === "cfg-publish") cfgPublish();
        else if (act === "cfg-reload") {
          if (!S.cfg) return;
          if (S.cfg.dirty && !confirm("放弃未保存的改动并重新载入？")) return;
          S.cfg.view = null;
          S.cfg.draft = null;
          S.cfg.dirty = false;
          S.cfg.edit = null;
          S.cfg.note = null;
          S.cfg.bundle = null;
          render();
          loadConfig();
        } else if (act === "cfg-bundle") cfgDownloadBundle();
        else if (act === "cfg-bundle-copy") cfgBundleCopy();
        else if (act === "cfg-note-x") { S.cfg.note = null; render(); }
        else if (act === "cfg-ptab") { S.cfg.ptab = el.getAttribute("data-ptab"); render(); }
        else if (act === "cfg-vpn-add") cfgAddVPN();
        else if (act === "cfg-vpn-del") cfgDelVPN(Number(el.getAttribute("data-id")));
        else if (act === "cfg-if-add") cfgAddIface();
        else if (act === "cfg-if-edit") cfgEditIface(Number(el.getAttribute("data-i")));
        else if (act === "cfg-if-del") cfgDelIface(Number(el.getAttribute("data-i")));
        else if (act === "cfg-if-cancel") { S.cfg.edit = null; render(); }
        else if (act === "cfg-if-save") cfgSaveIface();
        else if (act === "cfg-st-add") cfgAddStatic();
        else if (act === "cfg-st-del") cfgDelStatic(Number(el.getAttribute("data-i")));
        else if (act === "cfg-nb-add") cfgAddNeighbor();
        else if (act === "cfg-nb-del") cfgDelNeighbor(Number(el.getAttribute("data-i")));
        else if (act === "und-reload") undReload();
        else if (act === "und-save") undSave(false).catch(function () {});
        else if (act === "und-publish") undPublish();
        else if (act === "und-note-x") {
          if (S.und) S.und.note = null;
          if (S.sites) S.sites.note = null;
          if (S.pa) S.pa.note = null;
          if (S.ov) S.ov.note = null;
          blurContent();
          render();
        }
        // Every one of these three is a request to repaint a form that the click
        // just ended. render() skips its frame while focus sits in #content, so
        // without the blur the button visibly does nothing; the typed values
        // survive the rebuild through the keep pass above.
        else if (act === "site-form-x") {
          var ts = undSitesStore();
          ts.form = null;
          ts.note = null;
          blurContent();
          render();
        }
        else if (act === "site-edit") {
          var te = undSitesStore();
          te.edit = (te.edit === el.getAttribute("data-id")) ? null : el.getAttribute("data-id");
          te.form = null;
          blurContent();
          render();
        }
        else if (act === "site-edit-x") {
          var tx = undSitesStore();
          tx.edit = null;
          blurContent();
          render();
        }
        else if (act === "site-del") {
          undDeleteSite(el.getAttribute("data-id"), el.getAttribute("data-name") || "该站点");
        }
        else if (act === "pa-config") {
          cfgGotoTarget("pa:" + el.getAttribute("data-id"));
        }
        else if (act === "pa-goto-node") {
          cfgGotoTarget(el.getAttribute("data-node"));
        }
        else if (act === "pa-edit") {
          paEditStart(el.getAttribute("data-id"));
        }
        else if (act === "pa-edit-x") {
          paStore().edit = null;
          blurContent();
          render();
        }
        else if (act === "pa-revoke") {
          paRevoke(el.getAttribute("data-id"), el.getAttribute("data-name") || "该设备",
            Number(el.getAttribute("data-node")) || 0);
        }
        else if (act === "ov-rr-edit") {
          var orr = ovStore();
          var one = ovRRRow(el.getAttribute("data-id"));
          if (!one) return;
          if (orr.rre && orr.rre.id === one.id) orr.rre = null;
          else {
            orr.rre = { id: one.id, name: one.name, addr: one.addr,
              location: one.location };
          }
          orr.note = null;
          blurContent();
          render();
        }
        else if (act === "ov-rr-edit-x") {
          if (S.ov) { S.ov.rre = null; S.ov.note = null; }
          blurContent();
          render();
        }
        else if (act === "ov-rr-del") {
          ovRRDelete(el.getAttribute("data-id"), el.getAttribute("data-name") || "该 RR");
        }
        else if (act === "ov-reload") {
          var orl = ovStore();
          orl.doc = null;
          orl.g = null;
          orl.rre = null;
          orl.edit = null;
          orl.note = null;
          blurContent();
          render();
          loadOverlay();
        }
        else if (act === "ov-group-new") {
          var onew = ovStore();
          if (onew.doc) { ovGroupStart(onew.doc, ""); blurContent(); render(); }
        }
        else if (act === "ov-group-edit") {
          var oe = ovStore();
          if (!oe.doc) return;
          var oeId = el.getAttribute("data-id");
          if (oe.edit && oe.edit.id === oeId) oe.edit = null;
          else ovGroupStart(oe.doc, oeId);
          oe.note = null;
          blurContent();
          render();
        }
        else if (act === "ov-group-x") {
          if (S.ov) S.ov.edit = null;
          blurContent();
          render();
        }
        else if (act === "ov-group-del") {
          ovDeleteGroup(el.getAttribute("data-id"), el.getAttribute("data-name") || "该组");
        }
        else if (act === "ov-m-add") ovMemberAdd();
        else if (act === "ov-m-prev" || act === "ov-m-next") {
          var op = ovStore();
          if (!op.edit) return;
          var pgm = ovMemberPages(ovMemberFiltered(op.doc, op.edit), op.edit);
          op.edit.page = Math.max(0, Math.min(pgm.pages - 1, pgm.page + (act === "ov-m-next" ? 1 : -1)));
          ovMemberRefresh();
        }
        else if (act === "ov-m-del") {
          var od = ovStore();
          if (!od.edit) return;
          od.edit.members.splice(Number(el.getAttribute("data-i")) || 0, 1);
          od.edit.page = ovMemberPages(ovMemberFiltered(od.doc, od.edit), od.edit).page;
          blurContent();
          render();
        }
        else if (act === "und-avoid-add") undAddAvoid();
        else if (act === "und-avoid-del") undDelAvoid(Number(el.getAttribute("data-i")));
        else if (act === "hop-add") undHopAdd(el.getAttribute("data-key"));
        else if (act === "hop-del") undHopDel(el.getAttribute("data-key"), Number(el.getAttribute("data-i")));
        else if (act === "hop-up") undHopMove(el.getAttribute("data-key"), Number(el.getAttribute("data-i")), -1);
        else if (act === "hop-down") undHopMove(el.getAttribute("data-key"), Number(el.getAttribute("data-i")), 1);
        else if (act === "und-auto-apply") undAutoApply();
        else if (act === "und-tun-edit") {
          if (!S.und || !S.und.doc) return;
          var et = undTunnelOf(S.und.doc, el.getAttribute("data-id"));
          if (!et) return;
          S.und.editTun = et.id;
          S.und.editPathMode = undTunnelPathMode(et);
          // 编辑器里那条链从隧道当前的路径抄一份出来：直接编辑视图里的数组会把
          // 落库数据和草稿混在一起，取消时就没法还原了。
          S.und.editHops = (et.path && et.path.hops ? et.path.hops : []).map(function (x) {
            return { node: x.node_id, addr: x.addr || "" };
          });
          blurContent();
          render();
        }
        else if (act === "und-tun-cancel") {
          if (!S.und) return;
          S.und.editTun = null;
          S.und.editPathMode = null;
          S.und.editHops = null;
          render();
        }
        else if (act === "und-tun-del") undDeleteTunnel(el.getAttribute("data-id"));
        else if (act === "und-path-edit") {
          if (!S.und) return;
          S.und.editPath = el.getAttribute("data-id");
          var ep = null;
          (S.und.doc.paths || []).forEach(function (x) { if (x.id === S.und.editPath) ep = x; });
          S.und.pEditHops = (ep && ep.hops ? ep.hops : []).map(function (x) {
            return { node: x.node_id, addr: x.addr || "" };
          });
          blurContent();
          render();
        }
        else if (act === "und-path-cancel") {
          if (!S.und) return;
          S.und.editPath = null;
          S.und.pEditHops = [];
          render();
        }
        else if (act === "und-path-del") undDeletePath(el.getAttribute("data-id"));
        else if (act === "topo-view") {
          // 换视图 = 换整套摆法，缩放与平移对它没有意义，所以回到全图；
          // 选中项留着，两视图里指的是同一台设备。
          var tv = el.getAttribute("data-v") === "logical" ? "logical" : "geo";
          if (S.topo.view !== tv) {
            S.topo.view = tv;
            S.topo.k = 1; S.topo.x = 0; S.topo.y = 0;
            blurContent();
            render();
          }
        }
        else if (act === "topo-zoom") {
          var f0 = mapFrame();
          undMapZoomTo([f0.w / 2, f0.h / 2], el.getAttribute("data-d") === "1" ? 1.6 : 1 / 1.6);
        }
        else if (act === "topo-fit") undMapFit();
        else if (act === "topo-world") undMapReset();
        else if (act === "topo-world-retry") {
          MAP.err = null; MAP.loading = null; MAP.world = null;
          ensureWorld();
          render();
        }
        else if (act === "disable") {
          var name = el.getAttribute("data-user");
          var off = el.getAttribute("data-disabled") === "true";
          if (off && !confirm("禁用账号 " + name + "？该账号会立刻被登出。")) return;
          api("POST", "/api/accounts/disable", { username: name, disabled: off })
            .then(function () {
              toast((off ? "已禁用 " : "已启用 ") + name);
              load();
            }).catch(function (err) { toast(err.message); });
        }
      });
    });

    document.querySelectorAll("#nav a[data-view]").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var v = a.getAttribute("data-view");
        if (!allowed(v)) return;
        // 一次性码只在该页面上保留；离开就等于放弃这次查看，要回看只能重新生成。
        if (S.view === "enroll" && v !== "enroll") S.codeReveal = null;
        S.view = v;
        if (v === "config") openConfig();
        render();
      };
    });
  }

  // The reveal box renders at the top of the view; on a page with many grants
  // that is above the fold, so the click looks like it did nothing.
  function revealIntoView() {
    var box = document.getElementById("code-reveal");
    if (box && box.scrollIntoView) box.scrollIntoView({ block: "nearest" });
  }

  function selectCodeFor(t) {
    var want = String(t).replace(/\s+/g, "");
    var els = document.querySelectorAll("#content .copybox code");
    for (var i = 0; i < els.length; i++) {
      if (els[i].textContent.replace(/\s+/g, "") === want) {
        var r = document.createRange();
        r.selectNodeContents(els[i]);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
        return true;
      }
    }
    return false;
  }

  // Embedded webviews routinely deny clipboard-write (writeText rejects with
  // NotAllowedError), so there has to be a path that does not need that
  // permission: legacy textarea+execCommand, then "select it and say ⌘C".
  function copyText(t) {
    function done() { toast("已复制"); }
    function manual() {
      if (selectCodeFor(t)) toast("浏览器不允许自动复制：内容已选中，按 ⌘C / Ctrl+C");
      else toast("浏览器不允许自动复制，请手动选择：" + t);
    }
    function legacy() {
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      var ok = false;
      try {
        ta.select();
        ok = document.execCommand("copy");
      } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) done();
      else manual();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, legacy);
    } else {
      legacy();
    }
  }

  /* ---------------- start ---------------- */

  api("GET", "/api/session").then(bootSession).catch(showLogin);
})();
</script>
</body>
</html>
