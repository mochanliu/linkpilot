<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SROU 控制台</title>
<style>
  :root{
    --bg:#f6f8fa; --card:#ffffff; --line:#d0d7de; --ink:#1f2328; --muted:#57606a;
    --accent:#0969da; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --soft:#eef2f6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14.5px;line-height:1.55}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  h1,h2,h3{margin:0}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:6px 12px}
  button:hover{background:var(--soft)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(0.94)}
  button.danger{color:var(--bad);border-color:#ffccc7}
  button.small{padding:2px 8px;font-size:12.5px}
  input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid #b6d6ff;outline-offset:-1px;border-color:var(--accent)}

  /* ---------- login ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #login[hidden],#app[hidden]{display:none}
  .login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:26px 26px 22px;box-shadow:0 8px 24px rgba(31,35,40,.06)}
  .login-card .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .login-card .brand b{font-size:19px;letter-spacing:.3px}
  .login-card .brand span{color:var(--muted);font-size:12.5px}
  .login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .login-card label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .login-card input{width:100%}
  .login-card button{width:100%;margin-top:14px;padding:9px}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
  .tabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line)}
  .tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;
    color:var(--muted);padding:6px 2px;margin:0 14px -1px 0;font-size:13.5px}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tabs button:hover{background:none;color:var(--ink)}
  .login-card label.gap{margin-top:10px}

  /* ---------- shell ---------- */
  #app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
  aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}
  aside .logo{font-weight:700;font-size:16px;letter-spacing:.4px;padding:0 10px 4px}
  aside .logo small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;letter-spacing:1px}
  nav{margin-top:16px;display:flex;flex-direction:column;gap:2px}
  nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
  nav a:hover{background:var(--soft)}
  nav a.active{background:#ddf4ff;color:#0550ae;font-weight:600}
  nav a .n{font-size:12px;color:var(--muted)}
  nav a.sect{margin-top:14px;color:var(--muted);font-size:11.5px;letter-spacing:1px;
    padding:8px 10px 4px;pointer-events:none}
  aside .foot{position:absolute;bottom:14px;left:12px;right:12px;font-size:12px;color:var(--muted)}
  aside .me{font-size:12.5px;line-height:1.4;color:var(--ink);margin-bottom:8px}
  aside .me .who{font-weight:600;word-break:break-all}
  aside .me .role{color:var(--muted);font-size:11.5px;word-break:break-all}
  aside .foot button{width:100%;margin-top:6px}
  nav a[hidden],nav .sect[hidden]{display:none}

  main{padding:22px 26px 60px;max-width:1180px}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:4px}
  .page-head h1{font-size:20px}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .head-right .who{font-size:12.5px;color:var(--muted)}
  .seats{white-space:nowrap}
  .seats b{font-weight:650}
  .seats.full b{color:var(--warn)}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .k{color:var(--muted);font-size:12.5px}
  .card .v{font-size:24px;font-weight:650;margin-top:2px;letter-spacing:.3px}
  .card .v small{font-size:12.5px;font-weight:400;color:var(--muted)}

  section.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-top:16px}
  section.panel > header{display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:12px}
  section.panel h2{font-size:15px}
  section.panel .hint{color:var(--muted);font-size:12.5px;margin-top:-4px;margin-bottom:12px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;
    padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #eaeef2;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td .mono{color:#24292f}
  .muted{color:var(--muted)}
  .tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;
    border:1px solid var(--line);background:#fff;color:var(--muted)}
  .tag.online{color:var(--ok);border-color:#aceebb;background:#dafbe1}
  .tag.stale{color:var(--warn);border-color:#eed888;background:#fff8c5}
  .tag.pending{color:var(--muted);background:#f6f8fa}
  .tag.revoked{color:var(--bad);border-color:#ffcecb;background:#ffebe9}
  .tag.plan{color:var(--warn);border-color:#eed888;background:#fff8c5}

  .empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:13.5px}

  .form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .form-row input[name=tenant_id]{width:180px}
  .form-row input[name=name]{width:200px}
  .form-row input[name=account]{width:170px}
  .form-row input[name=username]{width:170px}
  .form-row input[name=password]{width:200px}
  .form-row input[name=claim_max_uses]{width:230px}
  .form-row input[name=max_uses]{width:120px}
  .form-row select{width:180px}
  .row-actions button{display:inline-block}
  .row-actions button + button{margin-left:6px}
  .row-actions select{margin-right:6px}
  .banner{display:flex;align-items:center;justify-content:space-between;gap:12px;
    border:1px solid #eed888;background:#fff8c5;border-radius:8px;padding:10px 14px;
    font-size:13px;margin-top:16px}

  .result{display:none;margin-top:14px;border:1px solid #aceebb;background:#f0fff4;
    border-radius:8px;padding:14px 16px}
  .result.show{display:block}
  .result .ttl{font-weight:600;color:var(--ok);margin-bottom:8px}
  .copybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .copybox code{background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:5px 10px;font-size:13.5px}
  .bigcode{display:inline-block;background:#fff;border:1px solid #aceebb;border-radius:8px;
    padding:10px 14px;font-size:17px;letter-spacing:1.6px;user-select:all;word-break:break-all}
  .ttl-now{font-variant-numeric:tabular-nums;font-weight:600;color:var(--warn)}
  .ttl-now.dead{color:var(--bad)}
  select.ttl{width:auto;padding:4px 6px;font-size:12.5px}
  .steps{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:13px}
  .steps li{margin:3px 0}
  pre.cmd{background:#0d1117;color:#e6edf3;border-radius:8px;padding:12px 14px;
    overflow-x:auto;font-size:12.5px;line-height:1.6;margin:8px 0 0}
  .placeholder{border:1px dashed var(--line);border-radius:10px;padding:22px;
    color:var(--muted);font-size:13.5px;background:#fcfdfe}
  .placeholder b{color:var(--ink)}
  .placeholder ul{margin:8px 0 0;padding-left:20px}
  .tel-node{border-top:1px solid #eaeef2;padding:14px 0 6px}
  .tel-node:first-of-type{border-top:none;padding-top:2px}
  .tel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .num{white-space:nowrap;font-variant-numeric:tabular-nums}
  .toast{position:fixed;right:20px;bottom:20px;background:#1f2328;color:#fff;
    padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(6px);
    transition:opacity .18s,transform .18s;pointer-events:none;max-width:420px}
  .toast.show{opacity:.96;transform:none}
  @media (max-width:900px){
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    #app{grid-template-columns:1fr}
    aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    aside .foot{position:static;margin-top:12px}
  }
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="brand"><b>SROU 控制台</b><span>控制器管理面</span></div>
    <div class="tabs" id="login-tabs">
      <button type="button" data-tab="account" class="active">账号登录</button>
      <button type="button" data-tab="token">运营令牌</button>
    </div>
    <div data-pane="account">
      <p>客户和运营方用同一个入口登录；能看到什么、能改什么由账号角色决定。</p>
      <label for="username">账号</label>
      <input id="username" name="username" type="text" placeholder="用户名" autocomplete="username" spellcheck="false">
      <label for="password" class="gap">密码</label>
      <input id="password" name="password" type="password" placeholder="密码" autocomplete="current-password">
    </div>
    <div data-pane="token" hidden>
      <p>脱离账号的应急入口：只有控制器启动时打印的令牌能换到运营方会话。</p>
      <label for="token">运营令牌</label>
      <input id="token" type="password" placeholder="console login token">
    </div>
    <button class="primary" type="submit" id="login-submit">登录</button>
    <div class="err" id="login-err"></div>
    <div class="muted" style="font-size:12px;margin-top:14px">
      设备入网走另一条通道（mTLS :8444），不经过这个页面。
    </div>
  </form>
</div>

<div id="app" hidden>
  <aside>
    <div class="logo">SROU<small>CONTROLLER</small></div>
    <nav id="nav">
      <a href="#overview" data-view="overview">概览</a>
      <div class="sect" data-roles="operator">运营</div>
      <a href="#tenants" data-view="tenants" data-roles="operator">租户 <span class="n" id="n-tenants">0</span></a>
      <a href="#accounts" data-view="accounts" data-roles="operator">账号 <span class="n" id="n-accounts">0</span></a>
      <a href="#enroll" data-view="enroll">入网授权 <span class="n" id="n-claims">0</span></a>
      <div class="sect" data-roles="tenant">我的网络</div>
      <a href="#nodes" data-view="nodes">设备 <span class="n" id="n-devices">0</span></a>
      <a href="#monitor" data-view="monitor" data-roles="tenant">监控</a>
      <a href="#tunnels" data-view="tunnels" data-roles="tenant">隧道</a>
      <a href="#routes" data-view="routes" data-roles="tenant">路由</a>
    </nav>
    <div class="foot">
      <div class="me"><div class="who" id="me-who">—</div><div class="role" id="me-role"></div></div>
      <div id="ctrl-line" class="mono" style="font-size:11px;word-break:break-all;margin-top:8px"></div>
    </div>
  </aside>

  <main>
    <div class="page-head">
      <div>
        <h1 id="view-title">概览</h1>
        <div class="sub" id="view-sub"></div>
      </div>
      <div class="head-right">
        <span class="pill"><span class="dot ok" id="live-dot"></span><span id="live-text">实时</span></span>
        <button class="small" id="pw-btn" hidden>修改密码</button>
        <button class="small" id="logout">退出登录</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var S = { state: null, me: null, accounts: null, loginTab: "account",
    view: "overview", lastResult: null, lastSecret: null, codeReveal: null,
    html: "", timer: null, ago: null, es: null,
    metrics: null, fast: null };

  // Only a placeholder for the input; the server owns the real default.
  var CLAIM_DEFAULT_USES = 10;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function ago(unix) {
    if (!unix) return "—";
    var d = Math.max(0, Math.floor(Date.now() / 1000) - unix);
    if (d < 60) return d + " 秒前";
    if (d < 3600) return Math.floor(d / 60) + " 分钟前";
    if (d < 86400) return Math.floor(d / 3600) + " 小时前";
    return Math.floor(d / 86400) + " 天前";
  }
  function clock(unix) {
    if (!unix) return "—";
    var d = new Date(unix * 1000);
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
      p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function hms(unix) {
    if (!unix) return "—";
    var d = new Date(unix * 1000);
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  // The code is read off a screen and typed on a device console; grouping it in
  // fours is for the person doing that. The copy button still takes the raw
  // string, because that is what the device expects.
  function groupCode(code) {
    if (!code) return "";
    return code.slice(0, 4) + " " + code.slice(4).replace(/(.{4})/g, "$1 ").trim();
  }
  function mmss(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }
  function api(method, path, body) {
    var opt = { method: method, credentials: "same-origin", headers: {} };
    if (body !== undefined) {
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    return fetch(path, opt).then(function (r) {
      if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("登录已过期"); }
      return r.text().then(function (t) {
        if (!r.ok) throw new Error(t.trim() || ("HTTP " + r.status));
        return t ? JSON.parse(t) : null;
      });
    });
  }

  /* ---------------- login ---------------- */

  function showLogin() {
    $("app").hidden = true;
    $("login").hidden = false;
    S.me = null;
    S.state = null;
    S.accounts = null;
    S.metrics = null;
    S.lastSecret = null;
    S.lastResult = null;
    S.codeReveal = null;
    S.html = "";
    if (S.es) { S.es.close(); S.es = null; }
    clearInterval(S.timer);
    clearInterval(S.ago);
    clearInterval(S.fast);
    S.fast = null;
    setLoginTab(S.loginTab);
  }
  function showApp() {
    $("login").hidden = true;
    $("app").hidden = false;
  }

  function setLoginTab(t) {
    S.loginTab = t;
    document.querySelectorAll("#login-tabs button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === t);
    });
    document.querySelectorAll("#login-form [data-pane]").forEach(function (p) {
      p.hidden = p.getAttribute("data-pane") !== t;
    });
    $("login-submit").textContent = t === "token" ? "以运营令牌登录" : "登录";
    $("login-err").textContent = "";
    if (!$("login").hidden) (t === "token" ? $("token") : $("username")).focus();
  }

  document.querySelectorAll("#login-tabs button").forEach(function (b) {
    b.addEventListener("click", function () { setLoginTab(b.getAttribute("data-tab")); });
  });

  $("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    $("login-err").textContent = "";
    var body = S.loginTab === "token"
      ? { token: $("token").value }
      : { username: $("username").value.trim(), password: $("password").value };
    api("POST", "/api/login", body).then(function () {
      $("password").value = "";
      $("token").value = "";
      return api("GET", "/api/session");
    }).then(bootSession).catch(function (err) {
      $("login-err").textContent = loginError(err.message);
    });
  });

  function loginError(m) {
    if (/invalid token/.test(m)) return "令牌不正确";
    if (/invalid username or password/.test(m)) return "账号或密码不正确";
    if (/too many failed logins/.test(m)) return "失败次数过多，请一分钟后再试";
    if (/username and password required/.test(m)) return "请填写账号和密码";
    return m;
  }

  $("logout").addEventListener("click", function () {
    api("POST", "/api/logout", {}).then(function () { location.reload(); });
  });

  $("pw-btn").addEventListener("click", function () {
    S.view = "account";
    render();
  });

  /* ---------------- session ---------------- */

  function bootSession(s) {
    if (!s || !s.logged_in) { showLogin(); return; }
    S.me = s;
    S.html = "";
    if (!allowed(S.view)) S.view = "overview";
    showApp();
    renderChrome();
    boot();
  }

  // A view the role cannot use is not hidden after the fact -- the router refuses
  // to draw it, so a stale URL or a page bug cannot widen what the role sees.
  function allowed(view) {
    var v = VIEWS[view];
    if (!v || !v.roles) return true;
    return !!S.me && v.roles.indexOf(S.me.role) >= 0;
  }

  /* ---------------- data ---------------- */

  function load() {
    var isOp = !!(S.me && S.me.role === "operator");
    var jobs = [api("GET", "/api/state")];
    if (isOp) jobs.push(api("GET", "/api/accounts").catch(function () { return null; }));
    return Promise.all(jobs).then(function (r) {
      var st = r[0] || {};
      st.tenants = st.tenants || [];
      st.claims = st.claims || [];
      st.nodes = st.nodes || [];
      S.state = st;
      if (isOp) S.accounts = r[1] || [];
      render();
    }).catch(function (err) {
      $("live-dot").className = "dot bad";
      $("live-text").textContent = "离线：" + err.message;
    });
  }

  // Telemetry is a different resource with its own freshness, so it is fetched
  // only while the monitoring view is open and only for a tenant (the operator
  // role is refused by the server -- this guard just avoids a pointless 403).
  function loadMetrics() {
    if (!(S.me && S.me.role === "tenant")) return Promise.resolve();
    return api("GET", "/api/metrics").then(function (m) {
      S.metrics = m;
      render();
    }).catch(function (err) {
      $("live-dot").className = "dot bad";
      $("live-text").textContent = "监控离线：" + err.message;
    });
  }

  // 5s while monitoring, nothing otherwise: the probe window is far shorter
  // than the 10s state poll, and a view nobody is looking at should not poll.
  function syncFast() {
    var need = !!(S.me && S.me.role === "tenant" && S.view === "monitor");
    if (need && S.fast === null) {
      S.fast = setInterval(loadMetrics, 5000);
      loadMetrics();
    } else if (!need && S.fast !== null) {
      clearInterval(S.fast);
      S.fast = null;
    }
  }

  function roleLine(me) {
    if (me.role === "operator") return me.via === "token" ? "运营方 · 应急令牌" : "运营方";
    return "租户 · " + (me.tenant_name || me.tenant_id || "");
  }

  // Chrome is the sidebar identity and the role gate on navigation. It is drawn
  // once per session, not per poll: the page should not flicker its identity.
  function renderChrome() {
    var me = S.me || {};
    $("me-who").textContent = me.username || "";
    $("me-role").textContent = me.role ? roleLine(me) : "";
    $("pw-btn").hidden = me.via !== "password";
    document.querySelectorAll("#nav [data-roles]").forEach(function (el) {
      el.hidden = (el.getAttribute("data-roles") || "").split(",").indexOf(me.role) < 0;
    });
  }

  // boot() only restarts the slow clocks; a session change must also drop any
  // fast monitor timer that was left running.
  function boot() {
    if (S.fast) { clearInterval(S.fast); S.fast = null; }
    load();
    if (S.es) S.es.close();
    try {
      S.es = new EventSource("/api/events");
      S.es.addEventListener("hello", function () {
        $("live-dot").className = "dot ok";
        $("live-text").textContent = "实时";
      });
      ["node.online", "node.enrolled", "node.stale", "tenant.created", "claim.created", "claim.revoked", "claim.updated"].forEach(function (n) {
        S.es.addEventListener(n, function (e) {
          var ev = {};
          try { ev = JSON.parse(e.data); } catch (_) {}
          load();
          if (S.view === "monitor") loadMetrics();
          if (n === "node.enrolled") toast("设备已入网，正在等待第一个心跳");
          if (n === "node.online") toast("设备上线");
          if (n === "node.stale") toast("设备失联：心跳超时");
          if (n === "claim.created" || n === "tenant.created") toast(n === "tenant.created" ? "租户已创建" : "已下发新的入网授权");
        });
      });
      S.es.onerror = function () {
        $("live-dot").className = "dot warn";
        $("live-text").textContent = "实时连接重连中";
      };
    } catch (_) {}
    // Events drive the table, but "last seen 12 秒前" also ages while nothing
    // happens; a slow refetch keeps the clock honest without hammering the API.
    clearInterval(S.timer);
    S.timer = setInterval(load, 10000);
    clearInterval(S.ago);
    S.ago = setInterval(refreshClocks, 1000);
  }

  /* ---------------- render ---------------- */

  // roles omitted = both roles. The role gate is also enforced by the API; this
  // table only keeps a view from being drawn for a role that has no data for it.
  var VIEWS = {
    overview: {
      title: "概览",
      sub: "运营侧重归属与库存；设备配置属于租户，不在这里展示",
      tenantSub: "你的设备与入网入口；配置尚未下发，所以设备处于「未配置」"
    },
    tenants: { title: "租户", sub: "租户是设备归属的唯一依据，只有控制台能创建", roles: ["operator"] },
    accounts: { title: "账号", sub: "登录控制台的账号；角色决定能看到什么、能改什么", roles: ["operator"] },
    enroll: {
      title: "入网授权",
      sub: "运营方下发授权（名称 + 可激活台数）；入网码由客户在激活设备时生成，运营方看不到明文",
      tenantSub: "运营方下发的授权在这里；激活设备时点「生成」，入网码只显示一次并很快失效"
    },
    nodes: {
      title: "设备",
      sub: "运营方只看库存（谁、序列号、入网时间、在线状态）",
      tenantSub: "你的设备；入网只建立归属，隧道 / 端口 / overlay 都还没有下发"
    },
    monitor: {
      title: "监控",
      sub: "设备存活与隧道内遥测：两端各自上报，不合并，没有上报就明说",
      roles: ["tenant"]
    },
    tunnels: { title: "隧道", sub: "尚未实现：需要先把节点计划（端口 / overlay 地址 / 密钥环）做出来", roles: ["tenant"] },
    routes: { title: "路由", sub: "尚未实现：路由表由 RR 反射，控制器不发布路由", roles: ["tenant"] },
    account: { title: "账号设置", sub: "修改自己的登录密码；改完后该账号在其他会话上会被登出" }
  };

  function render() {
    var st = S.state;
    if (!st) return;
    var me = S.me || {};
    var isOp = me.role === "operator";
    if (!allowed(S.view)) S.view = "overview";
    var v = VIEWS[S.view] || VIEWS.overview;
    $("view-title").textContent = v.title;
    $("view-sub").textContent = (isOp ? v.sub : (v.tenantSub || v.sub));
    syncFast();

    var online = st.nodes.filter(function (n) { return n.status === "online"; }).length;
    $("n-tenants").textContent = st.tenants.length;
    $("n-accounts").textContent = S.accounts ? S.accounts.length : 0;
    $("n-claims").textContent = liveGrants(st).length;
    $("n-devices").textContent = online + "/" + st.nodes.length;
    $("ctrl-line").textContent = (st.controller.tls_addrs || []).join(" · ");

    // 后台刷新（SSE + 10 秒轮询）不能把操作员正在填的表单冲掉：焦点还在
    // #content 的输入控件上就直接跳过这一帧，下次轮询再画。表格晚 10 秒
    // 更新是可以接受的，输入被清空不是。
    var a = document.activeElement;
    if (a && a.closest && a.closest("#content") && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;

    var c = "";
    if (S.view === "overview") c = viewOverview(st, online, isOp);
    else if (S.view === "tenants") c = viewTenants(st);
    else if (S.view === "accounts") c = viewAccounts(st);
    else if (S.view === "enroll") c = viewEnroll(st, isOp);
    else if (S.view === "nodes") c = viewNodes(st, isOp);
    else if (S.view === "monitor") c = viewMonitor();
    else if (S.view === "account") c = viewAccount();
    else c = viewPlaceholder(S.view);
    if (me.initial_password) c = initialPassBanner() + c;

    // 结构没变就只刷新相对时间，不重建 DOM：重建会让正在点的按钮在半路
    // 被替换掉（点击丢失），也会闪。心跳只改变「x 秒前」的文字，结构不变。
    if (c === S.html) {
      refreshClocks();
      return;
    }

    // 结构要重建时，先把已填的值记下来（例如点了页面空白处）。
    var keep = {};
    document.querySelectorAll("#content input, #content select").forEach(function (el) {
      var k = el.tagName + ":" + (el.name || el.id || "");
      if (k !== "INPUT:" && el.value) keep[k] = el.value;
    });

    S.html = c;
    $("content").innerHTML = c;

    document.querySelectorAll("#content input, #content select").forEach(function (el) {
      var k = el.tagName + ":" + (el.name || el.id || "");
      if (!el.value && keep[k]) el.value = keep[k];
    });
    refreshClocks();

    document.querySelectorAll("#nav a[data-view]").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-view") === S.view);
    });
    bind();
  }

  // Relative times and code windows live in spans/attributes so a poll can age
  // them without touching the table structure (and without detaching the button
  // under the pointer).
  function refreshClocks() {
    document.querySelectorAll("#content [data-ago]").forEach(function (el) {
      el.textContent = ago(+el.getAttribute("data-ago"));
    });
    document.querySelectorAll("#content [data-expires]").forEach(function (el) {
      var left = (+el.getAttribute("data-expires")) - Math.floor(Date.now() / 1000);
      el.textContent = left > 0 ? "剩余 " + mmss(left) : "已过期";
      el.classList.toggle("dead", left <= 0);
    });
  }

  function initialPassBanner() {
    return '<div class="banner"><span>你还在使用一次性初始密码，建议先改成自己的密码。</span>' +
      '<button class="small" data-act="goto" data-view="account">去修改</button></div>';
  }

  function liveGrants(st) {
    return st.claims.filter(function (c) { return !c.revoked; });
  }

  function cards(st, online, isOp) {
    var grants = liveGrants(st).length;
    if (isOp) {
      return '<div class="cards">' +
        card("租户", st.tenants.length, "个") +
        card("已入网设备", st.nodes.length, "台") +
        card("在线", online, "台") +
        card("入网授权", grants, "个") +
        "</div>";
    }
    var unconfigured = st.nodes.filter(function (n) { return n.runtime && !n.runtime.configured; }).length;
    return '<div class="cards">' +
      card("我的设备", st.nodes.length, "台") +
      card("在线", online, "台") +
      card("入网授权", grants, "个") +
      card("待配置", unconfigured, "台") +
      "</div>";
  }
  function card(k, v, u) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) +
      ' <small>' + esc(u) + "</small></div></div>";
  }

  function deviceTable(nodes, emptyMsg, isOp) {
    if (!nodes.length) return '<div class="empty">' + esc(emptyMsg) + "</div>";
    var cols = isOp
      ? ["设备", "租户", "序列号", "状态", "入网时间"]
      : ["设备", "序列号", "状态", "最后心跳", "入网时间", "配置"];
    var h = "<table><thead><tr>" + cols.map(function (c) {
      return "<th>" + esc(c) + "</th>";
    }).join("") + "</tr></thead><tbody>";
    nodes.forEach(function (n) {
      var rt = n.runtime;
      h += "<tr>" +
        '<td><span class="mono">node-' + esc(n.node_id) + "</span></td>";
      if (isOp) h += "<td>" + esc(tenantName(n.tenant_id)) + "</td>";
      h += '<td class="mono">' + esc(n.serial) + "</td>" +
        "<td>" + statusTag(n.status) + "</td>";
      if (!isOp) h += '<td class="muted"><span data-ago="' + esc(n.last_seen_unix) + '"></span></td>';
      h += '<td class="muted">' + esc(clock(n.enrolled_at_unix)) + "</td>";
      if (!isOp) {
        h += "<td>" + (rt && rt.configured
          ? '<span class="tag online">已配置</span>'
          : '<span class="tag plan">未配置</span>') +
          (rt && rt.udp_mapping ? ' <span class="mono muted">' + esc(rt.udp_mapping) + "</span>" : "") +
          "</td>";
      }
      h += "</tr>";
    });
    return h + "</tbody></table>";
  }

  function statusTag(s) {
    var label = { online: "在线", stale: "失联", pending: "已入网 · 未上线" }[s] || s;
    return '<span class="tag ' + esc(s) + '">' + esc(label) + "</span>";
  }
  function tenantName(id) {
    var st = S.state;
    for (var i = 0; i < st.tenants.length; i++) if (st.tenants[i].tenant_id === id) {
      return st.tenants[i].name ? st.tenants[i].name + " (" + id + ")" : id;
    }
    return id;
  }

  function viewOverview(st, online, isOp) {
    var h = cards(st, online, isOp);
    h += '<section class="panel"><header><h2>' + (isOp ? "设备库存" : "我的设备") + "</h2>" +
      '<button class="small" data-act="refresh">刷新</button></header>' +
      deviceTable(st.nodes, isOp
        ? "还没有设备。先到「租户」页新建租户（同时下发第一个入网授权），客户生成一次性码后设备即可入网。"
        : "还没有设备。到「入网授权」页为一条授权生成一次性码，再按命令启动设备。", isOp) +
      "</section>";
    h += isOp ? operatorSteps() : tenantSteps();
    return h;
  }

  function operatorSteps() {
    return '<section class="panel"><header><h2>运营方做什么</h2></header>' +
      '<div class="placeholder"><b>入网 = 设备与租户建立归属关系</b>，只签设备证书、登记一行记录，零配置。' +
      "<ul>" +
      "<li>新建租户 → 同时下发第一个入网授权（名称 + 可激活台数），并可选建客户登录账号</li>" +
      "<li>客户在真正激活设备时自己生成一次性入网码；运营方看不到码的明文</li>" +
      "<li>设备出现在「设备」页，只显示归属与库存信息</li>" +
      "<li>隧道 / 端口 / overlay / 密钥属于租户的网络配置，运营方看不到</li>" +
      "</ul></div></section>";
  }

  function tenantSteps() {
    return '<section class="panel"><header><h2>接下来</h2></header>' +
      '<div class="placeholder"><b>设备入网只建立归属，不带任何配置。</b>' +
      "<ul>" +
      "<li>在「入网授权」页选一条授权，点「生成」拿到一次性入网码（默认 5 分钟有效）</li>" +
      "<li>立刻复制或手抄到设备上；码只显示这一次，重新生成后旧码立即失效</li>" +
      "<li>设备出现在「设备」页即表示归属成功；心跳变绿才代表在线</li>" +
      "<li>心跳年龄、在线时长与隧道内遥测在「监控」页；没有上报时那里会明说，不显示 0 或假数据</li>" +
      "<li>设备配置（隧道 / 端口 / overlay 地址 / 密钥环）尚未实现，所以设备暂时显示「未配置」</li>" +
      "</ul></div></section>";
  }

  function viewTenants(st) {
    var h = '<section class="panel"><header><h2>新建租户</h2></header>' +
      '<div class="hint">新建租户会同时下发第一个入网授权（只定名额，不含码）；填写「客户登录名」会一并建好客户账号。' +
      "客户在「入网授权」页自己生成一次性码。名额按设备计：一台设备占一个名额，留空为默认 " + CLAIM_DEFAULT_USES + " 台。</div>" +
      '<form class="form-row" id="tenant-form">' +
      '<input name="tenant_id" placeholder="tenant_id，如 acme" required>' +
      '<input name="name" placeholder="显示名称（可选）">' +
      '<input name="account" placeholder="客户登录名（可选）" spellcheck="false">' +
      '<input name="password" type="password" placeholder="初始密码（留空自动生成）" autocomplete="new-password">' +
      '<input name="claim_max_uses" type="number" min="1" max="10000" placeholder="授权可激活台数（留空默认 ' + CLAIM_DEFAULT_USES + '）">' +
      '<button class="primary" type="submit">创建租户</button>' +
      "</form>" + resultBox() + "</section>";

    h += '<section class="panel"><header><h2>租户列表</h2></header>';
    if (!st.tenants.length) {
      h += '<div class="empty">还没有租户。</div>';
    } else {
      h += "<table><thead><tr><th>租户</th><th>ID</th><th>账号</th><th>设备</th>" +
        "<th>入网授权</th><th>创建时间</th><th></th></tr></thead><tbody>";
      st.tenants.forEach(function (t) {
        var devs = st.nodes.filter(function (n) { return n.tenant_id === t.tenant_id; }).length;
        var cls = st.claims.filter(function (c) { return c.tenant_id === t.tenant_id && !c.revoked; }).length;
        var accts = (S.accounts || []).filter(function (a) { return a.tenant_id === t.tenant_id; });
        h += "<tr>" +
          "<td>" + esc(t.name || t.tenant_id) + "</td>" +
          '<td class="mono">' + esc(t.tenant_id) + "</td>" +
          "<td>" + (accts.length
            ? '<span class="mono">' + accts.map(function (a) { return esc(a.username); }).join(", ") + "</span>"
            : '<span class="tag pending">无账号</span>') + "</td>" +
          "<td>" + devs + "</td>" +
          "<td>" + cls + " 个</td>" +
          '<td class="muted">' + esc(clock(t.created_at_unix)) + "</td>" +
          '<td><button class="small" data-act="claim" data-tenant="' + esc(t.tenant_id) + '">下发授权</button></td>' +
          "</tr>";
      });
      h += "</tbody></table>";
    }
    return h + "</section>";
  }

  function grantCodeState(c) {
    if (c.revoked) return '<span class="tag revoked">已吊销</span>';
    if (c.code_active) return '<span class="tag online">码有效</span>';
    if (c.code_expires_at_unix) return '<span class="tag stale">码已过期</span>';
    return '<span class="tag pending">未生成码</span>';
  }

  // The operator can see THAT a customer is holding a live code and for how
  // long; the code itself is never part of this view for anyone but the tenant
  // that generated it (and only in the one-time box above).
  function grantCodeWindow(c, isOp) {
    if (c.revoked) return "授权已吊销，不能再生成码";
    if (c.code_active) {
      // Demo seeds and codes migrated from the old model have no deadline; they
      // stay usable until someone regenerates them, which makes them short-lived.
      if (!c.code_expires_at_unix) return "长期码（未设到期时间）；重新生成后改为短时码";
      return (c.code_issued_by && !isOp ? "由 " + esc(c.code_issued_by) + " 生成 · " : "") +
        "有效至 " + esc(hms(c.code_expires_at_unix)) + ' · <span class="ttl-now" data-expires="' +
        esc(c.code_expires_at_unix) + '"></span>';
    }
    if (c.code_expires_at_unix) return "上次码已于 " + esc(clock(c.code_expires_at_unix)) + " 失效";
    return "还没有生成过码";
  }

  function codeRevealBox(r) {
    return '<div class="result show" id="code-reveal">' +
      '<div class="ttl">「' + esc(r.name || "入网授权") + '」的入网码已生成</div>' +
      "<div>只显示这一次。复制到设备上，或立刻手抄下来；离开后无法再查看，只能重新生成。</div>" +
      '<div class="copybox"><code class="bigcode">' + esc(groupCode(r.code)) + "</code>" +
      '<button class="small" data-act="copy" data-text="' + esc(r.code) + '">复制</button></div>' +
      '<div class="muted" style="font-size:12.5px">有效至 ' + esc(clock(r.expires_at_unix)) +
      '（<span class="ttl-now" data-expires="' + esc(r.expires_at_unix) + '"></span>）。' +
      "重新生成会让这个码立刻失效。</div>" +
      '<pre class="cmd">test/lab/vcpe.sh up --claim ' + esc(r.code) + "</pre>" +
      '<div style="margin-top:10px"><button class="small" data-act="code-dismiss">我已保存，关闭</button></div>' +
      "</div>";
  }

  function viewEnroll(st, isOp) {
    var h = "";
    if (isOp) {
      h += '<section class="panel"><header><h2>下发入网授权</h2></header>' +
        '<div class="hint">授权只定义「哪家租户、可以激活几台设备」，不包含入网码。' +
        "客户在真正激活设备时自己生成一次性码（默认 5 分钟有效）；运营方看不到码的明文，控制器只保存哈希。</div>";
      if (!st.tenants.length) {
        h += '<div class="empty">还没有租户：先到「租户」页建一个，再下发授权。</div>';
      } else {
        h += '<form class="form-row" id="claim-form">' +
          '<select name="tenant_id" required>' +
          st.tenants.map(function (t) {
            return '<option value="' + esc(t.tenant_id) + '">' + esc(t.name || t.tenant_id) + " · " + esc(t.tenant_id) + "</option>";
          }).join("") +
          "</select>" +
          '<input name="name" placeholder="授权名称，如 上海办公室" maxlength="60">' +
          '<input name="max_uses" type="number" min="1" max="10000" placeholder="可激活台数（默认 ' + CLAIM_DEFAULT_USES + '）">' +
          '<button class="primary" type="submit">下发授权</button>' +
          "</form>";
      }
      h += "</section>";
    }

    if (S.codeReveal) h += codeRevealBox(S.codeReveal);

    h += '<section class="panel"><header><h2>' + (isOp ? "已下发的授权" : "我的入网授权") + "</h2>" +
      (isOp ? '<button class="small" data-act="goto" data-view="tenants">新建租户</button>' : "") +
      "</header>" +
      '<div class="hint">' + (isOp
        ? "「当前码」只显示客户是否生成过、还有多久失效；码本身不在这里，也不会出现在接口或日志里。名额按设备计：每激活一台新设备占一个名额，同一台设备重复入网不再占名额。吊销只阻止未来的入网，已入网设备的证书不受影响。"
        : "要激活设备时点「生成」并选有效期；码只显示这一次，重新生成或过期后旧码立即失效。名额按设备计：每激活一台新设备占一个名额，同一台设备重复入网不再占名额。") + "</div>";
    if (!st.claims.length) {
      h += '<div class="empty">' + (isOp ? "还没有下发授权。" : "运营方还没有为你的租户下发入网授权。") + "</div>";
    } else {
      var cols = isOp
        ? ["授权名称", "租户", "名额（已激活 / 上限）", "当前码", "已入网序列号", ""]
        : ["授权名称", "名额（已激活 / 上限）", "当前码", "已入网序列号", ""];
      h += "<table><thead><tr>" + cols.map(function (x) { return "<th>" + esc(x) + "</th>"; }).join("") +
        "</tr></thead><tbody>";
      st.claims.forEach(function (c) {
        var full = c.uses >= c.max_uses;
        var seats = '<span class="seats' + (full ? " full" : "") + '"><b>' +
          c.uses + "</b> / " + c.max_uses + "</span>";
        h += "<tr>" +
          "<td><b>" + esc(c.name || "入网授权") + "</b>" +
          (c.revoked ? ' <span class="tag revoked">已吊销</span>'
            : full ? ' <span class="tag plan">已用满</span>' : "") + "</td>";
        if (isOp) h += "<td>" + esc(tenantName(c.tenant_id)) + "</td>";
        h += "<td>" + seats + "</td>" +
          "<td>" + grantCodeState(c) +

          h += '<button class="small" data-act="edit-max" data-id="' + esc(c.id) +
            '" data-used="' + c.uses + '" data-max="' + c.max_uses +
            '" data-name="' + esc(c.name || "入网授权") + '">改名额</button>' +

              esc(c.id) + '" data-name="' + esc(c.name || "入网授权") + '">吊销</button>');
        } else if (c.revoked) {
          h += '<span class="muted">—</span>';
        } else {
          h += '<select class="ttl" data-role="ttl" name="ttl_' + esc(c.id) + '">' +
            '<option value="300">5 分钟</option>' +
            '<option value="3600">1 小时</option>' +
            '<option value="86400">24 小时</option>' +
            "</select>" +
            '<button class="small primary" data-act="claim-code" data-id="' + esc(c.id) + '">' +
            (c.code_active ? "重新生成" : "生成") + "</button>";
        }
        h += "</td></tr>";
      });
      h += "</tbody></table>";
    }
    h += "</section>";

    h += '<section class="panel"><header><h2>让一台 vCPE 入网</h2></header>' +
      '<div class="hint">vCPE 是一个容器里跑的最小 agent：只做入网 + 心跳，不碰数据面。</div>' +
      '<div class="steps"><ol>' +
      "<li>运营方下发一条入网授权（名称 + 可激活台数）</li>" +

      "</ol></div>" +
      "<pre class=\"cmd\">test/lab/vcpe.sh up --claim CODE\n\ntest/lab/vcpe.sh logs      # 跟进 agent 日志\ntest/lab/vcpe.sh status    # 看本地身份（tenant / node_id）\ntest/lab/vcpe.sh down</pre>" +
      "</section>";

  function viewNodes(st, isOp) {
    return '<section class="panel"><header><h2>' + (isOp ? "已入网设备（库存）" : "已入网设备") + "</h2>" +

      deviceTable(st.nodes, isOp ? "还没有设备入网。" : "还没有设备入网，先在「入网授权」页生成一次性码接入一台。", isOp) +

        : "「未配置」是真实状态：enroll 不推任何参数，节点计划（每个隧道的端口、overlay /32、密钥环、RR 列表）还没有实现。心跳年龄、在线时长与隧道内遥测在「监控」页。") +
      "</div></section>";

  function dur(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    var d = Math.floor(sec / 86400), hr = Math.floor((sec % 86400) / 3600),
      mi = Math.floor((sec % 3600) / 60);
    if (d) return d + " 天 " + hr + " 小时";
    if (hr) return hr + " 小时 " + mi + " 分";
    if (mi) return mi + " 分";
    return sec + " 秒";
  }
  function fmtMs(v) { return (Number(v) || 0).toFixed(1) + " ms"; }
  function fmtPct(v) { return ((Number(v) || 0) / 10).toFixed(1) + "%"; }

  function bfdTag(row) {
    var s = row.bfd_state || "absent";
    var cls = s === "up" ? "online" : (s === "init" ? "stale" : "revoked");
    return '<span class="tag ' + cls + '">' + esc(s) + "</span>";
  }

  function emptyTelemetryText(n) {
    if (n.status === "stale") return "设备已失联：最后一帧窗口随失联一起作废，等它重新心跳。";
    if (n.status === "pending") return "设备已入网但还没有心跳，自然也没有遥测。";
    return "设备在线，但还没有上报过隧道内遥测。数据由设备数据面的 BFD 与探针产生；当前 agent 还不采集（节点计划未下发，设备上通常也还没有隧道），所以控制器没有可展示的行。";
  }

  // One block per node, and within it one row per tunnel END. The two ends of
  // the same tunnel are deliberately not merged (see the hint in the page):
  // they run independent BFD sessions and probe counters.
  function telemetryBlock(n) {
    var h = '<div class="tel-node"><div class="tel-head">' +
      '<span class="mono"><b>node-' + esc(n.node_id) + "</b></span>" +
      '<span class="mono muted">' + esc(n.serial) + "</span>" +
      statusTag(n.status);
    if (n.telemetry_seen_at_unix) {
      h += '<span class="muted">窗口 <span data-ago="' + esc(n.telemetry_seen_at_unix) + '"></span></span>';
    } else if (n.status === "stale") {
      h += '<span class="muted">旧窗口已丢弃</span>';
    } else {
      h += '<span class="tag pending">尚未上报遥测</span>';
    }
    h += "</div>";
    if (!n.tunnels.length) {
      h += '<div class="muted" style="padding:6px 2px 10px;font-size:13px">' + emptyTelemetryText(n) + "</div>";
      return h + "</div>";
    }
    h += "<table><thead><tr><th>隧道</th><th>对端</th><th>BFD</th>" +
      "<th>时延 当前 / min / avg / max</th><th>抖动</th><th>丢包</th>" +
      "<th>探针 tx / rx（丢 / 晚）</th><th>采样</th></tr></thead><tbody>";
    n.tunnels.forEach(function (row) {
      var rx = Number(row.probe_rx) || 0;
      var rtt = (rx || row.rtt_ms > 0)
        ? fmtMs(row.rtt_ms) + ' <span class="muted">/ ' + fmtMs(row.min_rtt_ms) + " / " +
          fmtMs(row.avg_rtt_ms) + " / " + fmtMs(row.max_rtt_ms) + "</span>"
        : "—";
      var peer = row.peer_node_id
        ? '<span class="mono">node-' + esc(row.peer_node_id) + '</span> <span class="mono muted">' + esc(row.peer_ip) + "</span>"
        : '<span class="mono">' + esc(row.peer_ip) + "</span>";
      h += "<tr>" +
        '<td class="mono">' + esc(row.sw_if_index) + "</td>" +
        "<td>" + peer + "</td>" +
        "<td>" + bfdTag(row) + "</td>" +
        '<td class="num">' + rtt + "</td>" +
        '<td class="num">' + (rx ? fmtMs(row.jitter_ms) : "—") + "</td>" +
        '<td class="num">' + (Number(row.probe_tx) ? fmtPct(row.loss_permille) : "—") + "</td>" +
        '<td class="num muted">' + esc(row.probe_tx) + " / " + esc(row.probe_rx) +
          "（丢 " + esc(row.probe_lost) + " · 晚 " + esc(row.probe_late) + "）</td>" +
        '<td class="muted num">' + (row.interval_ms ? esc(row.interval_ms) + " ms" : "—") +
          (row.window_sec ? " · " + esc(row.window_sec) + " s" : "") + "</td>" +
        "</tr>";
    });
    return h + "</tbody></table></div>";
  }

  function viewMonitor() {
    var m = S.metrics;
    if (!m) return '<section class="panel"><div class="empty">正在读取监控数据…</div></section>';
    var nodes = m.nodes || [];
    var online = 0, stale = 0, pending = 0, reporting = 0;
    nodes.forEach(function (n) {
      if (n.status === "online") online++;
      else if (n.status === "stale") stale++;
      else pending++;
      if (n.telemetry_seen_at_unix) reporting++;
    });
    var hb = m.controller.heartbeat_sec || 5;
    var lapse = Math.max(hb * 3, 6);
    var h = '<div class="cards">' +
      card("在线", online, "台") +
      card("失联", stale, "台") +
      card("待心跳", pending, "台") +
      card("遥测在报", reporting, "台") +
      "</div>";

    h += '<section class="panel"><header><h2>设备健康</h2>' +
      '<button class="small" data-act="refresh">刷新</button></header>' +
      '<div class="hint">控制器按心跳判断存活：设备每 ' + hb + " 秒上报一次，连续 " + lapse +
      " 秒没有心跳即判失联；「已运行」是 agent 上次报告的进程运行时长，失联设备显示的是它最后一次报告的值。</div>";
    if (!nodes.length) {
      h += '<div class="empty">还没有设备。先在「入网授权」页生成一次性码接入一台。</div>';
    } else {
      h += "<table><thead><tr><th>设备</th><th>序列号</th><th>状态</th><th>最后心跳</th>" +
        "<th>已运行</th><th>Agent 版本</th><th>外层映射</th><th>VPN 端口</th></tr></thead><tbody>";
      nodes.forEach(function (n) {
        h += "<tr>" +
          '<td><span class="mono">node-' + esc(n.node_id) + "</span></td>" +
          '<td class="mono">' + esc(n.serial) + "</td>" +
          "<td>" + statusTag(n.status) + "</td>" +
          '<td class="muted">' + (n.last_seen_unix
            ? '<span data-ago="' + esc(n.last_seen_unix) + '"></span>'
            : "从未") + "</td>" +
          '<td class="muted num">' + (n.uptime_sec > 0 ? esc(dur(n.uptime_sec)) : "—") + "</td>" +
          '<td class="mono muted">' + esc(n.agent_version || "—") + "</td>" +
          '<td class="mono muted">' + esc(n.udp_mapping || "—") + "</td>" +
          '<td class="mono muted">' + (n.vpn_port ? esc(n.vpn_port) : "—") + "</td>" +
          "</tr>";
      });
      h += "</tbody></table>";
    }
    h += "</section>";

    h += '<section class="panel"><header><h2>隧道内遥测</h2></header>' +
      '<div class="hint">每一行是某一端自己上报的采样窗口，两端不合并：一端说丢包、另一端说 down，这个分歧本身就是诊断信息。窗口 ' +
      (m.metrics_ttl_sec || 30) + " 秒没有刷新就会从视图里消失（设备失联时旧窗口同样作废）。</div>";
    if (!nodes.length) {
      h += '<div class="empty">没有设备，就没有遥测。</div>';
    } else {
      nodes.forEach(function (n) { h += telemetryBlock(n); });
    }
    h += "</section>";
    return h;
  }

  function viewAccount() {
    var me = S.me || {};

      return '<section class="panel"><div class="placeholder"><b>当前是运营令牌会话</b>' +

        "<li>正式上线后运营方用账号 + MFA 登录，令牌只留作救急</li>" +
        "</ul></div></section>";

      '<div class="hint">账号 <code>' + esc(me.username) + "</code>。改完后，该账号在其他浏览器上的会话会被登出。</div>" +
      '<form class="form-row" id="password-form">' +

      '<input name="new_password" type="password" placeholder="新密码（至少 10 位）" autocomplete="new-password" required>' +
      '<input name="confirm" type="password" placeholder="再输一次新密码" autocomplete="new-password" required>' +
      '<button class="primary" type="submit">保存新密码</button>' +

  function viewPlaceholder(view) {
    var what = view === "tunnels" ? "隧道" : "路由";
    return '<section class="panel"><div class="placeholder">' +
      "<b>" + esc(what) + "页还没有数据来源。</b>" +
      "<ul>" +
      "<li>设备配置（节点计划）尚未实现：端口、overlay 地址、密钥环都还没有下发通道</li>" +
      "<li>因此控制器现在没有任何隧道或路由事实可以展示</li>" +
      "<li>设备是否活着、设备数据面有没有上报遥测，在「监控」页</li>" +
      "</ul></div></section>";

  function resultBox() {
    var r = S.lastResult;
    if (!r) return "";
    var g = r.claim || {};
    var h = '<div class="result show" id="result">' +

  /* ---------------- actions ---------------- */

  // The 10s poll skips re-render while a form field has focus, so it cannot
  // wipe half-typed input. After a submit the response may carry a one-time
  // secret, so drop that focus: otherwise the result box stays hidden until
  // the operator happens to click elsewhere.
  function releaseForm(form) {
    form.reset();
    var a = document.activeElement;
    if (a && a.blur && form.contains(a)) a.blur();
  }

  // An empty number field means "let the server pick", which is 0 on the wire;
  // anything non-numeric is a client mistake and should not silently become 0.
  function intField(f, name) {
    var v = (f.get(name) || "").trim();
    if (v === "") return 0;
    var n = Number(v);
    return Number.isFinite(n) ? Math.trunc(n) : NaN;
  }

  function bind() {
    var tf = $("tenant-form");
    if (tf) tf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(tf);
      var maxUses = intField(f, "claim_max_uses");
      if (isNaN(maxUses)) { toast("授权可激活台数必须是数字"); return; }
      api("POST", "/api/tenants", {
        tenant_id: (f.get("tenant_id") || "").trim(),
        name: (f.get("name") || "").trim(),
        account: (f.get("account") || "").trim(),
        password: f.get("password") || "",
        claim_max_uses: maxUses
      }).then(function (res) {
        S.lastResult = res;
        var msg = "租户 " + res.tenant.tenant_id + " 已创建";
        if (res.account) msg += "，账号 " + res.account.username;
        toast(msg);
        releaseForm(tf);
        load().then(function () { S.view = "tenants"; render(); });
      }).catch(function (err) { toast(err.message); });
    });

    var af = $("account-form");
    if (af) af.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(af);
      var role = f.get("role") || "tenant";
      api("POST", "/api/accounts", {
        username: (f.get("username") || "").trim(),
        role: role,
        tenant_id: role === "tenant" ? (f.get("tenant_id") || "").trim() : "",
        password: f.get("password") || ""
      }).then(function (res) {
        S.lastSecret = res.password
          ? { title: "账号 " + res.account.username + " 已创建", username: res.account.username, password: res.password }
          : null;
        toast("账号 " + res.account.username + " 已创建");
        releaseForm(af);
        if (S.view === "accounts") load();
      }).catch(function (err) { toast(err.message); });
    });

    var cf = $("claim-form");
    if (cf) cf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(cf);
      var maxUses = intField(f, "max_uses");
      if (isNaN(maxUses)) { toast("可激活台数必须是数字"); return; }
      api("POST", "/api/claims", {
        tenant_id: f.get("tenant_id") || "",
        name: (f.get("name") || "").trim(),
        max_uses: maxUses
      }).then(function (c) {
        toast("已下发授权「" + c.name + "」（可激活 " + c.max_uses + " 台）");
        releaseForm(cf);
        load();
      }).catch(function (err) { toast(err.message); });
    });

    var pf = $("password-form");
    if (pf) pf.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(pf);
      var np = f.get("new_password") || "";
      if (np !== f.get("confirm")) { toast("两次输入的新密码不一致"); return; }
      api("POST", "/api/password", {
        old_password: f.get("old_password") || "",
        new_password: np
      }).then(function () {
        toast("密码已修改，其他会话已登出");
        releaseForm(pf);
        return api("GET", "/api/session").then(function (s) { S.me = s; });
      }).then(function () { renderChrome(); render(); })
        .catch(function (err) { toast(err.message); });
    });

    document.querySelectorAll("#content [data-act]").forEach(function (el) {
      el.addEventListener("click", function () {
        var act = el.getAttribute("data-act");
        if (act === "refresh") {
          load().then(function () { toast("已刷新"); });
          if (S.view === "monitor") loadMetrics();
        }
        else if (act === "goto") {
          if (S.view === "enroll") S.codeReveal = null;
          S.view = el.getAttribute("data-view");
          render();
        }
        else if (act === "copy") copyText(el.getAttribute("data-text"));
        else if (act === "claim") {
          api("POST", "/api/claims", { tenant_id: el.getAttribute("data-tenant") })
            .then(function (c) {
              toast("已下发授权「" + c.name + "」（可激活 " + c.max_uses + " 台）");
              load();
            }).catch(function (err) { toast(err.message); });
        } else if (act === "claim-code") {
          var cid = el.getAttribute("data-id");
          var sel = el.parentNode.querySelector("select[data-role=ttl]");
          var ttl = sel ? Number(sel.value) : 300;
          el.disabled = true;
          api("POST", "/api/claims/code", { id: cid, ttl_sec: ttl })
            .then(function (res) {
              S.codeReveal = res;
              toast("入网码已生成，有效期至 " + clock(res.expires_at_unix));
              load();
            }).catch(function (err) {
              el.disabled = false;
              toast(err.message);
            });
        } else if (act === "code-dismiss") {
          S.codeReveal = null;
          render();
        } else if (act === "edit-max") {
          var gid = el.getAttribute("data-id");
          var gname = el.getAttribute("data-name") || "入网授权";
          var used = Number(el.getAttribute("data-used")) || 0;
          var v = prompt("「" + gname + "」的可激活台数（已激活 " + used + " 台，不能低于它）：", el.getAttribute("data-max"));
          if (v === null) return;
          var n = Number(String(v).trim());
          if (!v.trim() || !Number.isFinite(n) || n < 1) { toast("台数必须是 1 以上的整数"); return; }
          api("POST", "/api/claims/update", { id: gid, max_uses: Math.trunc(n) })
            .then(function (c) { toast("名额已改为 " + c.max_uses + " 台"); load(); })
            .catch(function (err) { toast(err.message); });
        } else if (act === "revoke") {
          var rid = el.getAttribute("data-id");
          var rname = el.getAttribute("data-name") || "入网授权";
          if (!confirm("吊销授权「" + rname + "」？客户将无法再为它生成入网码；已入网设备不受影响。")) return;
          api("POST", "/api/claims/revoke", { id: rid })
            .then(function () { toast("已吊销"); load(); })
            .catch(function (err) { toast(err.message); });
        } else if (act === "reset") {
          var user = el.getAttribute("data-user");
          if (!confirm("为 " + user + " 生成新的临时密码？对方会被立刻登出。")) return;
          api("POST", "/api/accounts/reset", { username: user })
            .then(function (res) {
              S.lastSecret = { title: "账号 " + res.account.username + " 的密码已重置",
                username: res.account.username, password: res.password };
              toast("已重置 " + user + " 的密码");
              load();
            }).catch(function (err) { toast(err.message); });
        } else if (act === "disable") {
          var name = el.getAttribute("data-user");
          var off = el.getAttribute("data-disabled") === "true";
          if (off && !confirm("禁用账号 " + name + "？该账号会立刻被登出。")) return;
          api("POST", "/api/accounts/disable", { username: name, disabled: off })
            .then(function () {
              toast((off ? "已禁用 " : "已启用 ") + name);
              load();
            }).catch(function (err) { toast(err.message); });
        }
      });
    });

    document.querySelectorAll("#nav a[data-view]").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var v = a.getAttribute("data-view");
        if (!allowed(v)) return;
        // 一次性码只在该页面上保留；离开就等于放弃这次查看，要回看只能重新生成。
        if (S.view === "enroll" && v !== "enroll") S.codeReveal = null;
        S.view = v;
        render();
      };
    });
  }

  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast("已复制"); },
        function () { toast("复制失败，请手动选择"); });
    } else {
      toast("请手动选择复制：" + t);
    }
  }

  /* ---------------- start ---------------- */

  api("GET", "/api/session").then(bootSession).catch(showLogin);
})();
</script>
</body>
</html>
