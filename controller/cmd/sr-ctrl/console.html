      '<button class="small primary" data-act="cfg-st-add">添加</button>' +
      "</div></section>";
  }

  function cfgDynamicPanel(cs, cfg) {
    var vpn = cfgVPNOf(cfg, cs.vpn) || cfg.vpns[0];
    var opts = cfg.vpns.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === vpn.id ? " selected" : "") + ">VPN " +
        esc(x.id) + (x.name ? " · " + esc(x.name) : "") + "</option>";
    }).join("");
    return '<section class="panel"><header><h2>动态路由（盒内 FRR）</h2>' +
      '<select id="cfg-vpn" class="ttl" aria-label="路由实例">' + opts + "</select></header>" +
      '<div class="hint">这里只定义「和客户侧谁建会话」。学到的前缀要不要进 overlay、怎么打 tag，是 overlay 层的事。</div>' +
      cfgBgpCard(vpn) + cfgOspfCard(cfg, vpn) + "</section>";
  }

  function cfgBgpCard(vpn) {
    var b = vpn.bgp;
    var nbrs = b.neighbors || [];
    var body = "";
    if (b.on) {
      var nrows = nbrs.length ? nbrs.map(function (n, i) {
        var mode = b.asn !== 0 && n.remote_as === b.asn
          ? '<span class="tag plan">iBGP</span>' : '<span class="tag pending">eBGP</span>';
        return "<tr>" +
          '<td class="mono">' + esc(n.ip) + "</td>" +
          '<td class="num">' + esc(n.remote_as) + "</td>" +
          "<td>" + mode + (n.next_hop_self
            ? ' <span class="muted" style="font-size:12px">next-hop-self</span>' : "") + "</td>" +
          "<td>" + (n.description ? esc(n.description) : '<span class="muted">—</span>') + "</td>" +
          '<td class="row-actions"><button class="small danger" data-act="cfg-nb-del" data-i="' + i + '">删除</button></td>' +
          "</tr>";
      }).join("") : '<tr><td colspan="5" class="empty">还没有邻居。</td></tr>';
      body = '<div class="fields">' +
        '<div class="field"><label for="bgp-asn">本地 AS</label><input id="bgp-asn" data-cfg="bgp.asn" type="number" min="1" max="4294967295" value="' + esc(b.asn || "") + '" style="width:130px"></div>' +
        '<div class="field"><label for="bgp-rid">router-id</label><input id="bgp-rid" data-cfg="bgp.router_id" value="' + esc(b.router_id) + '" placeholder="10.0.0.1" spellcheck="false"></div>' +
        "</div>" +
        '<div style="margin-top:10px"><table><thead><tr><th>邻居</th><th>对端 AS</th><th>会话</th><th>描述</th><th></th></tr></thead><tbody>' +
        nrows + "</tbody></table></div>" +
        '<div class="addrow">' +
        '<div class="field"><label for="nb-ip">邻居地址</label><input id="nb-ip" placeholder="10.68.1.2" spellcheck="false"></div>' +
        '<div class="field"><label for="nb-ras">对端 AS</label><input id="nb-ras" type="number" min="1" max="4294967295" placeholder="65001" style="width:120px"></div>' +
        '<div class="field"><label for="nb-desc">描述</label><input id="nb-desc" placeholder="customer-r1"></div>' +
        '<label class="chk"><input type="checkbox" id="nb-nhs"> iBGP next-hop-self</label>' +
        '<button class="small" data-act="cfg-nb-add">添加邻居</button>' +
        "</div>" +
        '<div class="hint" style="margin:10px 0 0">对端 AS 等于本地 AS 即 iBGP：不再要求直连，但本机必须能递归到邻居地址（直连网段或被静态路由覆盖）。eBGP 必须直连。</div>';
    }
    return '<div class="subcard"><div class="subhead">' +
      '<label class="chk"><input type="checkbox" id="cfg-bgp-on" data-cfg-bool="bgp.on"' +
      (b.on ? " checked" : "") + "> 启用 BGP（bgpd）</label>" +
      '<span class="sp">tag / route-map 由 overlay 层生成</span></div>' + body + "</div>";
  }

  function cfgOspfCard(cfg, vpn) {
    var o = vpn.ospf;
    var body = "";
    if (o.on) {
      var nets = cfg.ifaces.filter(function (it) {
        return it.vpn === vpn.id && cfgIPv4(it.ip);
      }).map(function (it) { return it.ip + "/" + it.prefix_len; });
      body = '<div class="fields">' +
        '<div class="field"><label for="ospf-rid">router-id</label><input id="ospf-rid" data-cfg="ospf.router_id" value="' + esc(o.router_id) + '" placeholder="10.0.0.1" spellcheck="false"></div>' +
        '<div class="field"><label for="ospf-area">area</label><input id="ospf-area" data-cfg="ospf.area" type="number" min="0" max="4294967295" value="' + esc(o.area) + '" style="width:110px"></div>' +
        '</div><p class="hint" style="margin:10px 0 0">宣告网段取自这个 VPN 的客户口：' +
        (nets.length ? nets.map(function (n) {
          return '<span class="mono">' + esc(n) + "</span>";
        }).join(" · ") : "还没有客户口") +
        "。FRR 每个 VRF 只有一个 OSPF 实例，所以没有进程号。</p>";
    }
    return '<div class="subcard"><div class="subhead">' +
      '<label class="chk"><input type="checkbox" id="cfg-ospf-on" data-cfg-bool="ospf.on"' +
      (o.on ? " checked" : "") + "> 启用 OSPF（ospfd）</label>" +
      '<span class="sp">与客户路由器跑区域 ' + esc(o.on ? o.area : 0) + "</span></div>" + body + "</div>";
  }

  function cfgChecksPanel(cs) {
    var v = cs.view;
    var list = (v && v.checks) || [];
    var errs = 0, warns = 0;
    list.forEach(function (x) {
      if (x.severity === "error") errs++;
      else if (x.severity === "warning") warns++;
    });
    var label = { error: "错误", warning: "警告", info: "提示" };
    var items = list.map(function (x) {
      return '<li><span class="sev ' + esc(x.severity) + '">' + esc(label[x.severity] || x.severity) +
        "</span> · " + esc(x.text) + "</li>";
    }).join("");
    var top = errs ? '<span class="tag revoked">' + errs + " 个错误</span>"
      : warns ? '<span class="tag stale">' + warns + " 个警告</span>"
        : '<span class="tag online">通过</span>';
    return '<section class="panel"><header><h2>校验</h2>' + top + "</header>" +
      (cs.dirty ? '<div class="hint">当前有未保存的改动；下面的校验对应已保存的草稿 v' + esc(v.version) + "。</div>" : "") +
      (items ? '<ul class="chk-list">' + items + "</ul>"
        : '<div class="empty">没有发现需要提示的问题。</div>') +
      "</section>";
  }

  function cfgArtifactsPanel(cs) {
    var v = cs.view;
    var tabs = [["frr", "FRR 配置"], ["vpp", "VPP 配置"], ["boot", "开机脚本"]];
    var text = (v.artifacts && v.artifacts[cs.ptab]) || "";
    return '<section class="panel"><header><h2>配置包内容</h2></header>' +
      '<div class="ltabs" role="tablist" aria-label="配置产物">' + tabs.map(function (x) {
        return '<button type="button" role="tab" class="' + (cs.ptab === x[0] ? "on" : "") +
          '" aria-selected="' + (cs.ptab === x[0]) + '" data-act="cfg-ptab" data-ptab="' +
          x[0] + '">' + x[1] + "</button>";
      }).join("") + "</div>" +
      '<div class="hint">只有基础配置拥有的行：FRR 管主机名、接口地址、静态路由、BGP/OSPF；VPP 管 table、MTU、接口状态与 lcp；开机脚本由设备侧在启动时重放，避免重启后丢掉 VPP 运行时状态。' +
      (cs.dirty ? "当前显示的是已保存草稿 v" + esc(v.version) + " 的产物。" : "") + "</div>" +
      '<pre class="cmd">' + esc(text) + "</pre></section>";
  }

  // The verification browser (and some locked-down clients) drop <a download>
  // silently, so the fetched text is also shown verbatim: the tenant can
  // select it and save the file by hand.
  function cfgBundlePanel(cs) {
    var b = cs.bundle;
    if (!b) return "";
    return '<section class="panel"><header><h2>配置包 JSON</h2>' +
      '<span class="tag online">v' + esc(b.version) + "</span></header>" +
      '<div class="hint">如果点「下载配置包」后浏览器没有保存文件，可以在这里全选复制，自己存成 ' +
      esc(b.name) + "；内容和下载到的完全一致。</div>" +
      '<textarea id="cfg-bundle-json" class="cmd" readonly spellcheck="false" ' +
      'style="width:100%;height:220px;resize:vertical">' + esc(b.text) + "</textarea>" +
      '<div style="margin-top:8px"><button class="small" data-act="cfg-bundle-copy">全选 / 复制</button></div>' +
      "</section>";
  }

  function cfgBundleCopy() {
    var ta = $("cfg-bundle-json");
    if (!ta) return;
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    toast(ok ? "已复制配置包 JSON" : "已全选，按 ⌘C / Ctrl+C 复制");
  }

  // Publishing is the tenant saying "make the device run this". The console
  // refuses what the device would refuse anyway (v0, blocking errors) and keeps
  // no force switch: force lives on the box's CLI, where someone can see it.
  function cfgPublish() {
    var cs = S.cfg;
    if (!cs || !cs.view) return;
    if (cfgIsPA(cs)) { toast("这台设备还没有入网，没有可发布的目标"); return; }
    var v = cs.view;
    if (cs.dirty) {
      cs.note = { kind: "warn", text: "有未保存的改动。发布的是已保存的草稿，先点「保存草稿」。" };
      render();
      return;
    }
    if (!v.version) {
      cs.note = { kind: "warn", text: "这台设备还没有保存过草稿（v0），没有可发布的配置。" };
      render();
      return;
    }
    var errs = 0;
    (v.checks || []).forEach(function (x) { if (x.severity === "error") errs++; });
    if (errs) {
      cs.note = { kind: "bad", text: "草稿 v" + v.version + " 有 " + errs + " 个校验错误，设备会拒绝安装，所以这里不允许发布。改到没有错误再发；确实要强推只能在设备上执行 sr-apply apply --force。" };
      render();
      return;
    }
    if (!confirm("发布 v" + v.version + " 到 node-" + cs.nodeID + "？\n\n设备下一次心跳会拉取并安装，安装会重启 FRR。发布之后继续改草稿不影响设备，直到你再次发布。")) return;
    var prev = v.published_version || 0;
    api("POST", "/api/config/publish", { node_id: cs.nodeID }).then(function (nv) {
      if (S.cfg !== cs) return;
      cs.view = nv;
      cs.draft = cfgClone(nv.config);
      cs.dirty = false;
      cs.edit = null;
      cs.bundle = null;
      var changed = (nv.published_version || 0) !== prev;
      var hb = (S.state && S.state.controller && S.state.controller.heartbeat_sec) || 30;
      cs.note = changed
        ? { kind: "", text: "已发布 v" + nv.published_version + "：设备在下一次心跳（≤" + hb + " 秒）拉取并安装，结果以设备回报为准（见「下发到设备」）。" }
        : { kind: "", text: "v" + nv.published_version + " 这次发布没有变化。" };
      blurContent();
      render();
      toast(changed ? "已发布 v" + nv.published_version : "没有变化");
    }).catch(function (err) { toast("发布失败：" + err.message); });
  }

  function cfgAddVPN() {
    var cs = S.cfg;
    if (!cs || !cs.draft) return;
    var id = Number(cfgVal("vpn-id"));
    var name = cfgVal("vpn-name");
    if (!(id >= 1 && id <= 65535) || Math.trunc(id) !== id) { toast("VPN ID 必须是 1–65535 的整数"); return; }
    if (id === 250 || id === 1250) { toast("VPN " + id + " 被 overlay 保留，换一个"); return; }
    if (cfgVPNExists(cs.draft, id)) { toast("VPN " + id + " 已经存在"); return; }
    if (cs.draft.vpns.length >= 64) { toast("一个设备最多 64 个 VPN"); return; }
    cs.draft.vpns.push({ id: id, name: name,
      bgp: { on: false, asn: 0, router_id: "", neighbors: [] },
      ospf: { on: false, router_id: "", area: 0 } });
    cs.draft.vpns.sort(function (a, b) { return a.id - b.id; });
    cs.vpn = id;
    csMarkDirty();
    render();
  }

  function cfgDelVPN(id) {
    var cs = S.cfg;
    if (!cs || !cs.draft) return;
    if (id === 0) { toast("VPN 0 是默认表，不能删除"); return; }
    var used = cs.draft.ifaces.some(function (it) { return it.vpn === id; }) ||
      cs.draft.statics.some(function (r) { return r.vpn === id; });
    if (used) { toast("先把这个 VPN 下的客户口和静态路由移走或删除"); return; }
    if (!confirm("删除 VPN " + id + "？它的 BGP / OSPF 设置会一起删除。")) return;
    cs.draft.vpns = cs.draft.vpns.filter(function (v) { return v.id !== id; });
    if (cs.vpn === id) cs.vpn = 0;
    csMarkDirty();
    render();
  }

  function cfgAddIface() {
    var cs = S.cfg;
    if (!cs || !cs.draft) return;
    if (cs.draft.ifaces.length >= 64) { toast("一个设备最多 64 个客户口"); return; }
    var maxVpp = 1, maxLcp = -1;
    cs.draft.ifaces.forEach(function (it) {
      var a = String(it.vpp || "").match(/(\d+)$/);
      if (a) maxVpp = Math.max(maxVpp, Number(a[1]));
      var b = String(it.lcp || "").match(/(\d+)$/);
      if (b) maxLcp = Math.max(maxLcp, Number(b[1]));
    });
    cs.edit = { idx: -1, v: {
      vpp: "host-eth" + (maxVpp + 1), lcp: "lcp-x" + (maxLcp + 1),
      ip: "", prefix_len: 24, vpn: cfgVPNExists(cs.draft, cs.vpn) ? cs.vpn : 0,
      mtu: 1500, arp_ignore: true, up: true
    } };
    render();
  }

  function cfgEditIface(i) {

    if (!cs || !cs.draft || !cs.draft.ifaces[i]) return;
    cs.edit = { idx: i, v: cfgClone(cs.draft.ifaces[i]) };
    render();
  }

  function cfgDelIface(i) {
    var cs = S.cfg;

  function cfgSaveIface() {
    var cs = S.cfg;
    if (!cs || !cs.edit || !cs.draft) return;
    var v = cs.edit.v;
    v.vpp = cfgVal("if-vpp");
    v.lcp = cfgVal("if-lcp");
    v.ip = cfgVal("if-ip");
    v.prefix_len = Number(cfgVal("if-pfx"));
    v.vpn = Number(cfgVal("if-vpn"));
    v.mtu = Number(cfgVal("if-mtu"));
    v.arp_ignore = cfgVal("if-arp") === "1";
    v.up = cfgVal("if-up") === "1";
    if (!v.vpp || !v.lcp) { toast("VPP 口名和内核 TAP 名都要填"); return; }
    if (!cfgIPv4(v.ip)) { toast("IP 地址不合法：" + (v.ip || "(空)")); return; }
    if (!(v.prefix_len >= 8 && v.prefix_len <= 30)) { toast("前缀长度需在 8–30 之间"); return; }
    if (!(v.mtu >= 576 && v.mtu <= 9216)) { toast("MTU 需在 576–9216 之间"); return; }
    if (!cfgVPNExists(cs.draft, v.vpn)) { toast("VPN " + v.vpn + " 不存在"); return; }
    if (cs.edit.idx >= 0) cs.draft.ifaces[cs.edit.idx] = v;

  function cfgAddStatic() {
    var cs = S.cfg;
    if (!cs || !cs.draft) return;
    var pfx = cfgVal("st-prefix"), nh = cfgVal("st-nh"), vpn = Number(cfgVal("st-vpn"));
    if (!/^\d{1,3}(\.\d{1,3}){3}\/\d{1,2}$/.test(pfx)) {
      toast("目的前缀格式应为 a.b.c.d/len，例如 10.68.99.0/24");
      return;
    }
    if (!cfgIPv4(nh)) { toast("下一跳不是合法 IPv4"); return; }
    if (!cfgVPNExists(cs.draft, vpn)) { toast("VPN " + vpn + " 不存在"); return; }
    if (cs.draft.statics.length >= 512) { toast("静态路由最多 512 条"); return; }
    cs.draft.statics.push({ prefix: pfx, next_hop: nh, vpn: vpn });
    csMarkDirty();
    render();
  }

  function cfgDelStatic(i) {
    var cs = S.cfg;
    if (!cs || !cs.draft) return;
    cs.draft.statics.splice(i, 1);

  function cfgAddNeighbor() {
    var cs = S.cfg;
    if (!cs || !cs.draft) return;
    var vpn = cfgVPNOf(cs.draft, cs.vpn);
    if (!vpn) return;
    if (!vpn.bgp.neighbors) vpn.bgp.neighbors = [];
    var ip = cfgVal("nb-ip"), ras = Number(cfgVal("nb-ras"));
    if (!cfgIPv4(ip)) { toast("邻居地址不是合法 IPv4"); return; }
    if (!(ras >= 1 && ras <= 4294967295) || Math.trunc(ras) !== ras) {
      toast("对端 AS 需在 1–4294967295 之间");
      return;
    }
    if (vpn.bgp.neighbors.some(function (x) { return x.ip === ip; })) {
      toast("邻居 " + ip + " 已经存在");
      return;
    }
    if (vpn.bgp.neighbors.length >= 64) { toast("一个 VPN 最多 64 个 BGP 邻居"); return; }    var nhs = $("nb-nhs");
    vpn.bgp.neighbors.push({ ip: ip, remote_as: ras, description: cfgVal("nb-desc"),
      next_hop_self: !!(nhs && nhs.checked) });
    csMarkDirty();
    render();
  }

  function cfgDelNeighbor(i) {
    var cs = S.cfg;
    if (!cs || !cs.draft) return;
    var vpn = cfgVPNOf(cs.draft, cs.vpn);
    if (!vpn || !vpn.bgp.neighbors) return;
    vpn.bgp.neighbors.splice(i, 1);
    csMarkDirty();
    render();
  }

  function cfgSave() {
    var cs = S.cfg;
    if (!cs || !cs.view) return;
    if (!cs.dirty) { toast("没有需要保存的改动"); return; }
    var isPA = cfgIsPA(cs);
    var url = isPA ? "/api/preauth/config" : "/api/config";
    var body = isPA ? { preauth_id: cs.pa, config: cs.draft } : { node_id: cs.nodeID, config: cs.draft };
    var want = cfgTarget(cs);
    api("PUT", url, body).then(function (v) {
      if (S.cfg !== cs || cfgTarget(cs) !== want) return;
      var errs = 0;
      (v.checks || []).forEach(function (x) { if (x.severity === "error") errs++; });
      cs.view = v;
      cs.draft = cfgClone(v.config);
      cs.dirty = false;
      cs.edit = null;
      cs.bundle = null;
      cs.note = { kind: errs ? "warn" : "",
        text: "已保存草稿 v" + v.version +
          (errs ? "；仍有 " + errs + " 个错误，设备会拒绝安装，因此也不能发布（除非在设备上用 --force）。"
            : (isPA ? "。设备还没有入网，这份草稿存在控制器上等材料；盒子认领这条预授权时它会跟着走，那时再发布。"
              : "。要让它生效，点「发布到设备」（设备需以 -apply 启动），或下载配置包手工安装。")) };
      blurContent();
      render();
      toast("草稿已保存 v" + v.version);
    }).catch(function (err) { toast("保存失败：" + err.message); });
  }

  // Fetched rather than linked: the endpoint needs the session cookie and
  // answers errors as JSON text, which a plain <a download> would save as if
  // it were a bundle.
  function cfgDownloadBundle() {
    var cs = S.cfg;
    if (!cs || !cs.view) return;
    if (cs.dirty) {
      // Drop any earlier download: it belongs to the saved version, not to
      // what is on screen now, and copying it by mistake would be silent.
      cs.bundle = null;
      cs.note = { kind: "warn", text: "有未保存的改动。配置包只包含已保存的草稿，先点「保存草稿」再下载。" };
      render();
      return;
    }
    if (!cs.view.version) {
      cs.bundle = null;
      cs.note = { kind: "warn", text: "这台设备还没有保存过草稿（v0），没有可下载的配置包。" };
      render();
      return;
    }
    var nodeID = cs.nodeID, version = cs.view.version;
    fetchText("GET", "/api/config/bundle?node=" + encodeURIComponent(nodeID)).then(function (text) {
      var data = null;
      try { data = JSON.parse(text); } catch (e) { /* keep the saved version below */ }
      // The fetched version can differ from the one on screen if another
      // session saved in between; the payload wins.
      var v = (data && data.version) || version;
      var checks = (data && data.checks) || cs.view.checks || [];
      var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      var a = document.createElement("a");
      a.href = url;
      a.download = "sr-cpe-node-" + nodeID + "-v" + v + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      if (S.cfg !== cs) return;
      var errs = 0;
      checks.forEach(function (x) { if (x.severity === "error") errs++; });
      cs.bundle = { version: v, name: a.download, text: text };
      cs.note = { kind: errs ? "warn" : "",
        text: "已下载配置包 v" + v + "。设备侧执行 sr-apply apply --bundle <文件>" +
          (errs ? "；校验里有 " + errs + " 个错误，默认会被拒绝（需 --force）。" : "。") };
      render();
      toast("已下载 node-" + nodeID + " 的配置包 v" + v);
    }).catch(function (err) { toast("下载失败：" + err.message); });
  }

  function cfgSetPath(el, val) {
    var cs = S.cfg, cfg = cs.draft;
    var p = el.getAttribute("data-cfg");
    if (p === "hostname") { cfg.hostname = val; return; }
    if (p === "vpn.name") {
      var v = cfgVPNOf(cfg, Number(el.getAttribute("data-vpn")));
      if (v) v.name = val;
      return;
    }
    var vpn = cfgVPNOf(cfg, cs.vpn);
    if (!vpn) return;
    if (p === "bgp.asn") vpn.bgp.asn = val === "" ? 0 : Number(val);
    else if (p === "bgp.router_id") vpn.bgp.router_id = val;
    else if (p === "ospf.router_id") vpn.ospf.router_id = val;
    else if (p === "ospf.area") vpn.ospf.area = val === "" ? 0 : Number(val);
  }

  /* ---------------- underlay ---------------- */

  // The underlay pages read two server documents (GET /api/underlay and
  // /api/underlay/topology) and never derive a fact the server did not send.
  // A device that never reported says "未上报"; a tunnel's liveness says
  // "未知" with the server's own explanation. The pages also keep a settings
  // draft in S: the 10-second poll rebuilds the view, so form values must live
  // in S rather than only in the DOM.

  function nowSec() { return Math.floor(Date.now() / 1000); }

  function undRole() { return !!(S.me && S.me.role === "tenant"); }

  function undClone(v) { return JSON.parse(JSON.stringify(v)); }

  // Errors from the underlay API carry JSON bodies ({"error","checks"} or
  // {"error","users"}), because those payloads are what the page shows after a
  // refused save/delete. fetchText hands back the raw body, so parse it here.
  function undErrNote(err) {
    var msg = err && err.message ? err.message : String(err);
    var checks = null, users = null;
    try {
      var o = JSON.parse(msg);
      if (o) {
        if (o.error) msg = o.error;
        if (o.checks) checks = o.checks;
        if (o.users) users = o.users;
      }
    } catch (_) {}
    if (users && users.length) msg += "（引用它的隧道：" + users.join("、") + "）";
    return { kind: "bad", text: msg, checks: checks };
  }

  function undCheckRow(c) {
    var sev = c.severity || "info";
    var label = { error: "错误", warning: "警告", info: "提示" }[sev] || sev;
    return '<li><span class="sev ' + esc(sev) + '">' + esc(label) + "</span> · " + esc(c.text) + "</li>";
  }

  function undNote(n) {
    if (!n) return "";
    var h = '<div class="cfg-note ' + esc(n.kind || "") + '" role="status"><div>' + esc(n.text);
    if (n.checks && n.checks.length) {
      h += '<ul class="chk-list">' + n.checks.map(undCheckRow).join("") + "</ul>";
    }
    h += '</div><button class="small" data-act="und-note-x">知道了</button></div>';
    return h;
  }

  function undDirtyMark(u) {
    return u && u.dirty ? ' · <b style="color:var(--warn)">有未保存的改动</b>' : "";
  }

  function undStore() {
    if (!S.und) {
      S.und = { doc: null, draft: null, dirty: false, loading: false, at: 0,
        note: null, auto: null, autoSel: [], autoMode: "full-mesh", autoHub: 0,
        autoSpoke: "none", mPath: "direct", mA: 0, mPeers: [], batch: null,
        mHops: [], editHops: null, editTun: null,
        editPathMode: null, editPath: null, pHops: [], pEditHops: [] };
    }
    return S.und;
  }

  function ensureUnderlay() {
    var u = undStore();
    if (!undRole()) return u;
    if (u.loading) return u;
    if (!u.doc || nowSec() - u.at >= 10) loadUnderlay();
    return u;
  }

  function loadUnderlay() {
    var u = undStore();
    if (!undRole() || u.loading) return;
    u.loading = true;
    api("GET", "/api/underlay").then(function (doc) {
      u.loading = false;
      u.doc = doc;
      u.at = nowSec();
      if (u.note && u.note.fromLoad) u.note = null;
      if (!u.dirty) u.draft = undClone(doc.settings);
      undPruneSelection(doc);
      render();
    }).catch(function (err) {
      u.loading = false;
      u.note = undErrNote(err);
      u.note.fromLoad = true;
      render();
    });
  }

  function undPruneSelection(doc) {
    var ids = {};
    (doc.nodes || []).forEach(function (n) { ids[n.node_id] = true; });
    var u = undStore();
    u.autoSel = u.autoSel.filter(function (id) { return ids[id]; });
    if (!ids[u.autoHub]) u.autoHub = 0;
    if (!ids[u.mA]) u.mA = 0;
    u.mPeers = (u.mPeers || []).filter(function (id) { return ids[id] && id !== u.mA; });
    // 一条链里的设备下架了，这一跳只能删掉：留着它，提交时只会换来一句
    // "中转设备 N 不存在或未入网"，而操作者看不出是哪一跳。刚点「＋ 添加一跳」
    // 还没选设备的行 node 是空的，必须留着——否则一次心跳重绘就把操作者正在填的
    // 那一行吃掉，页面看起来像按钮没反应。
    ["mHops", "editHops", "pHops", "pEditHops"].forEach(function (k) {
      if (!u[k]) return;
      u[k] = u[k].filter(function (h) { return !h.node || ids[h.node]; });
    });
  }

  // The map's viewport lives here too. The page is rebuilt from a string on
  // every data change, and a rebuilt <svg> starts at 1x centred on the world --
  // so zoom and pan have to be state, not DOM, or the operator gets snapped back
  // to the whole planet by a heartbeat landing while they were looking at 深圳湾.
  function undTopoStore() {
    if (!S.topo) S.topo = { doc: null, loading: false, at: 0, sel: null, err: null,
      view: "geo", k: 1, x: 0, y: 0 };
    return S.topo;
  }

  function ensureTopo() {
    var t = undTopoStore();
    if (!undRole()) return t;
    if (t.loading) return t;
    if (!t.doc || nowSec() - t.at >= 10) loadTopo();
    return t;
  }

  function loadTopo() {
    var t = undTopoStore();
    if (!undRole() || t.loading) return;
    t.loading = true;
    t.err = null;
    api("GET", "/api/underlay/topology").then(function (doc) {
      t.loading = false;
      t.doc = doc;
      t.at = nowSec();
      render();
    }).catch(function (err) {
      t.loading = false;
      t.err = undErrNote(err).text;
      render();
    });
  }

  function undInvalidateTopo() {
    if (S.topo) { S.topo.doc = null; S.topo.at = 0; }
  }

  /* ---------------- 站点：设备的物理位置（只用来画拓扑） ---------------- */

  // The device page needs the tenant's site list for its dropdown. It is a
  // separate, tiny read rather than another field on /api/state: a location is
  // underlay data, and the operator's pages should not grow a dependency on it
  // just because one tenant column wants it.
  function undSitesStore() {
    if (!S.sites) {
      S.sites = { list: null, unplaced: 0, loading: false, at: 0, note: null,
        form: null, edit: null };
    }
    return S.sites;
  }

  function ensureSites() {
    var t = undSitesStore();
    if (!undRole()) return t;
    if (t.loading) return t;
    if (!t.list || nowSec() - t.at >= 10) loadSites();
    return t;
  }

  function loadSites() {
    var t = undSitesStore();
    if (!undRole() || t.loading) return;
    t.loading = true;
    api("GET", "/api/underlay/sites").then(function (doc) {
      t.loading = false;
      undApplySites(doc, null);
    }).catch(function (err) {
      t.loading = false;
      t.note = undErrNote(err);
      render();
    });
  }

  // Every site write answers with the whole list -- that is exactly what a
  // placement changes -- so the page takes it and drops the map's cached doc:
  // a device that just moved must not stay drawn where it was.
  function undApplySites(doc, msg) {
    var t = undSitesStore();
    if (!doc) { render(); return; }
    t.list = doc.sites || [];
    t.unplaced = Number(doc.unplaced_nodes) || 0;
    t.at = nowSec();
    t.loading = false;
    if (msg) t.note = { kind: "", text: msg };
    undPatchNodeSite(t, doc);
    undInvalidateTopo();
    render();
  }

  // /api/state carries the device's site, and it only refreshes on the next
  // poll. Without this the dropdown would snap back to the old value for up to
  // ten seconds after a click that clearly worked.
  function undPatchNodeSite(t, doc) {
    if (!S.state || doc.node_id == null) return;
    var name = "";
    (doc.sites || []).forEach(function (si) {
      if (si.id === doc.site_id) name = si.name;
    });
    S.state.nodes.forEach(function (n) {
      if (n.node_id === doc.node_id && n.runtime) {
        n.runtime.site_id = doc.site_id || "";
        n.runtime.site_name = name;
      }
    });
  }

  function undAssignSite(nodeID, siteID) {
    var t = undSitesStore();
    t.form = null;
    t.loading = true;
    t.note = null;
    api("PUT", "/api/underlay/node-site", { node_id: nodeID, site_id: siteID })
      .then(function (doc) {
        undApplySites(doc, siteID
          ? "node-" + nodeID + " 已放到「" + undSiteName(doc, siteID) + "」。"
          : "node-" + nodeID + " 的位置已清掉，它会回到未定位清单。");
      })
      .catch(function (err) { t.loading = false; t.note = undErrNote(err); render(); });
  }

  function undSiteName(doc, id) {
    var name = id;
    ((doc && doc.sites) || []).forEach(function (si) { if (si.id === id) name = si.name; });
    return name;
  }

  function undSiteFormBody(form) {
    var f = new FormData(form);
    var name = String(f.get("name") || "").trim();
    var lon = String(f.get("lon") || "").trim();
    var lat = String(f.get("lat") || "").trim();
    if (!name) return { err: "站点名不能为空" };
    // Empty is refused here as well as by the API: "leave it blank and it
    // defaults to 0" would put the box in the Gulf of Guinea.
    if (!lon || !lat) return { err: "经度和纬度都要填，留空不会被当成 0" };
    var a = Number(lon), b = Number(lat);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return { err: "经纬度必须是数字" };
    return { body: { name: name, lon: a, lat: b } };
  }

  function undCreateSite(form) {
    var t = undSitesStore();
    var r = undSiteFormBody(form);
    if (r.err) { undSiteErr(t, "und-site-new-err", r.err); return; }
    var node = t.form ? t.form.node : 0;
    t.loading = true;
    t.note = null;
    api("POST", "/api/underlay/sites", r.body).then(function (doc) {
      // The write is accepted: the form has done its job, so it closes and gives
      // up focus. Without the blur the next render() would be skipped as a
      // "user is still typing" frame and the page would look unchanged.
      undSiteDone(t);
      if (!doc || !doc.site) { undApplySites(doc, null); return; }
      if (!node) {
        undApplySites(doc, "站点「" + doc.site.name + "」已建好，还没有放到设备上。");
        return;
      }
      // Place it in the same click: a site created from a device row is meant
      // for that device, and making the user pick again invites a wrong box.
      t.loading = false;
      api("PUT", "/api/underlay/node-site", { node_id: node, site_id: doc.site.id })
        .then(function (d2) {
          undApplySites(d2, "node-" + node + " 已放到新建的「" + doc.site.name + "」。");
        })
        .catch(function (err) {
          undApplySites(doc, null);
          t.note = undErrNote(err);
          render();
        });
    }).catch(function (err) { t.loading = false; undSiteErr(t, "und-site-new-err", undErrNote(err).text); });
  }

  function undUpdateSite(form) {
    var t = undSitesStore();
    var r = undSiteFormBody(form);
    if (r.err) { undSiteErr(t, "und-site-edit-err", r.err); return; }
    var id = t.edit;
    r.body.id = id;
    t.loading = true;
    t.note = null;
    api("PUT", "/api/underlay/sites", r.body).then(function (doc) {
      undSiteDone(t);
      undApplySites(doc, "站点「" + undSiteName(doc, id) + "」已更新。");
    }).catch(function (err) { t.loading = false; undSiteErr(t, "und-site-edit-err", undErrNote(err).text); });
  }

  // A site form's own error slot, not the page banner: render() skips a frame
  // while focus sits inside #content so it never eats what is being typed, and a
  // banner written behind that guard only appears after the user clicks away --
  // which reads as "the button did nothing".
  function undSiteErr(t, slotId, text) {
    var el = $(slotId);
    if (el) {
      el.textContent = text;
      return;
    }
    t.note = { kind: "bad", text: text };
    render();
  }

  function undSiteDone(t) {
    t.form = null;
    t.edit = null;
    blurContent();
  }

  function undDeleteSite(id, name) {
    var t = undSitesStore();
    if (!confirm("删除站点「" + name + "」？只有还没有设备的位置能删掉。")) return;
    // Same reason as the cancel buttons: this click has to repaint, and a focus
    // still sitting in an open site form would hold the frame back.
    blurContent();
    t.loading = true;
    t.note = null;
    api("POST", "/api/underlay/sites/delete", { id: id }).then(function (doc) {
      undApplySites(doc, "站点「" + name + "」已删除。");
    }).catch(function (err) { t.loading = false; t.note = undErrNote(err); render(); });
  }

  // One dropdown per device row. The list is the tenant's own sites; "未定位"
  // is a real choice, not a placeholder -- clearing it is how a box that moved
  // out of a rack leaves the map.
  function undSiteCell(n) {
    var t = undSitesStore();
    if (!t.list) return '<span class="muted">正在读取站点…</span>';
    var cur = (n.runtime && n.runtime.site_id) || "";
    var h = '<select data-act="node-site" data-node="' + esc(n.node_id) + '" data-keep="no"' +
      ' aria-label="设备 node-' + esc(n.node_id) + ' 的站点">';
    h += '<option value=""' + (cur ? "" : " selected") + ">未定位</option>";
    t.list.forEach(function (si) {
      h += '<option value="' + esc(si.id) + '"' + (si.id === cur ? " selected" : "") + ">" +
        esc(si.name) + "</option>";
    });
    h += '<option value="__new">＋ 新建站点…</option></select>';
    return h;
  }

  function undSiteFields(v) {
    v = v || { name: "", lon: "", lat: "" };
    return '<div class="field"><label for="und-site-name">站点名</label>' +
      '<input id="und-site-name" name="name" value="' + esc(v.name) + '" placeholder="北京 · 国贸" maxlength="80"></div>' +
      '<div class="field"><label for="und-site-lon">经度（东经为正）</label>' +
      '<input id="und-site-lon" name="lon" value="' + esc(v.lon) + '" placeholder="116.46" inputmode="decimal"></div>' +
      '<div class="field"><label for="und-site-lat">纬度（北纬为正）</label>' +
      '<input id="und-site-lat" name="lat" value="' + esc(v.lat) + '" placeholder="39.91" inputmode="decimal"></div>';
  }

  var SITE_COORD_HINT = "经纬度是手填的：控制器不测量、也不猜。留空会被拒绝，因为 (0,0) 是几内亚湾的真实坐标，" +
    "填 0 会被画到那里。位置只用于画拓扑和运维认路，不会进配置包、不会下发给设备。";

  function undSiteFormPanel(t) {
    if (!t.form) return "";
    var n = null;
    (S.state ? S.state.nodes : []).forEach(function (x) { if (x.node_id === t.form.node) n = x; });
    var who = n ? "node-" + n.node_id + "（" + (n.serial || "未上报序列号") + "）" : "这台设备";
    return '<section class="panel"><header><h2>新建站点</h2>' +
      '<span class="muted" style="font-size:12.5px">建好后直接放到 ' + esc(who) + "</span></header>" +
      '<form id="und-site-new-form"><div class="fields">' + undSiteFields(null) + "</div>" +
      '<div class="hint" style="margin:10px 0 0">' + SITE_COORD_HINT + "</div>" +
      '<div class="err" id="und-site-new-err" role="alert"></div>' +
      '<div style="margin-top:10px"><button class="primary" type="submit">保存并放到 ' + esc(who) + "</button> " +
      '<button class="small" type="button" data-act="site-form-x">取消</button></div></form></section>';
  }

  function undSiteListPanel(t) {
    if (!t.list) return "";
    var h = '<section class="panel"><header><h2>站点</h2>' +
      '<span class="muted" style="font-size:12.5px">' + t.list.length + " 个 · 未定位 " +
      esc(t.unplaced) + " 台</span></header>";
    if (!t.list.length) {
      return h + '<div class="empty">还没有站点。在上面的设备行里把「站点」选成「＋ 新建站点…」建第一个。</div></section>';
    }
    h += '<table><thead><tr><th>站点</th><th>经纬度</th><th>设备</th><th>操作</th></tr></thead><tbody>';
    t.list.forEach(function (si) {
      h += "<tr>" +
        "<td><b>" + esc(si.name) + '</b> <span class="muted mono">' + esc(si.id) + "</span></td>" +
        '<td class="mono">' + esc(si.lon.toFixed(2)) + ", " + esc(si.lat.toFixed(2)) + "</td>" +
        "<td>" + esc(si.devices) + "</td>" +
        "<td>";
      if (t.edit === si.id) {
        h += '<span class="muted">正在编辑…</span>';
      } else {
        h += '<button class="small" data-act="site-edit" data-id="' + esc(si.id) + '">编辑</button> ' +
          '<button class="small danger" data-act="site-del" data-id="' + esc(si.id) +
          '" data-name="' + esc(si.name) + '">删除</button>';
      }
      h += "</td></tr>";
      if (t.edit === si.id) {
        h += '<tr><td colspan="4"><form id="und-site-edit-form"><div class="fields">' +
          undSiteFields(si) + "</div>" +
          '<div class="hint" style="margin:10px 0 0">' + SITE_COORD_HINT + "</div>" +
          '<div class="err" id="und-site-edit-err" role="alert"></div>' +
          '<div style="margin-top:10px"><button class="primary" type="submit">保存</button> ' +
          '<button class="small" type="button" data-act="site-edit-x">取消</button></div></form></td></tr>';
      }
    });
    return h + "</tbody></table>" +
      '<div class="hint" style="margin-top:8px">改经纬度只影响地图上的位置，不动设备本身；' +
      "删除只对 0 台设备的站点开放，还有设备在里面的会拒绝并告诉你原因。</div></section>";
  }

  /* ---------------- 预授权：纸面上先登记的设备 ---------------- */

  // 预授权是「这台盒子下个月才到，但名称、站点和配置现在就想要」。它不是设备行
  // 的伪装：node 号只在入网那一刻产生，所以草稿挂在登记记录上（配置页把这两种
  // 目标都叫"设备"，但只有已入网的那种能发布）。
  //
  // 列表本身来自 /api/state 的 preauths 字段（只有租户角色拿得到），每一次写
  // 也会带着整份新列表回来，所以这里只存交互状态。
  function paStore() {
    if (!S.pa) S.pa = { note: null, loading: false, edit: null };
    return S.pa;
  }

  function paRows(st) { return (st && st.preauths) || []; }

  function paWaiting(st) {
    return paRows(st).filter(function (p) { return !p.bound_node_id; });
  }

  // 占名额的那几条登记要写在授权行里：只给一个数字，改名额的人不知道是哪几条
  // 纸面记录把位置占了。
  function paWaitingCell(st, claimID) {
    var names = paRows(st).filter(function (p) {
      return p.claim_id === claimID && !p.bound_node_id;
    }).map(function (p) { return p.name; });
    if (!names.length) return "";
    return '<div style="margin-top:4px">预授权等待认领：' + esc(names.join("、")) + "</div>";
  }

  // 名额在创建预授权的那一刻就被占用，所以这里必须拆成两个数：真设备几台、
  // 纸面记录几台。只报一个合计数会让人以为到货的设备比实际多。
  function paSeatText(c) {
    var used = (c.uses || 0) + (c.reserved || 0);
    return "已入网 " + (c.uses || 0) + " + 预授权 " + (c.reserved || 0) + " / " + c.max_uses +
      (c.max_uses && used >= c.max_uses ? " · 已满" : "");
  }

  function paStatusTag(p) {
    if (p.bound_node_id) {
      return '<span class="tag online">已认领 · node-' + esc(p.bound_node_id) + "</span>" +
        '<div class="muted" style="font-size:12px">序列号 ' + esc(p.bound_serial || "未上报") +
        (p.bound_at_unix ? " · " + esc(ago(p.bound_at_unix)) : "") + "</div>";
    }
    if (p.claim_revoked) {
      return '<span class="tag revoked">授权已吊销</span>' +
        '<div class="muted" style="font-size:12px">这条索引在现场会被拒绝</div>';
    }
    return '<span class="tag pending">预授权 · 等待设备</span>';
  }

  // 「已配置 / 未配置」只看控制器里的草稿版本：设备还没到货，能诚实报的只有
  // 「草稿存了几版」，不能报「装上了」。
  function paConfigCell(p) {
    if (p.bound_node_id) return '<span class="muted">已交给设备页</span>';
    if (!p.config_version) return '<span class="muted">未配置</span>';
    return '<span class="mono">已配置 · 草稿 v' + esc(p.config_version) + "</span>" +
      (p.config_updated_at_unix
        ? '<div class="muted" style="font-size:12px">' + esc(ago(p.config_updated_at_unix)) +
          (p.config_updated_by ? " · " + esc(p.config_updated_by) : "") + "</div>"
        : "");
  }

  // 表单字段名带 pa- 前缀而不是复用 name/serial/site_id：这一页同时有站点表单
  // 和预授权的新建/编辑表单，而整页重建时保留输入值的键就是字段名，撞名会把
  // 站点名填进设备名称里。
  function paSiteSelect(name, cur) {
    var t = undSitesStore();
    if (!t.list) return '<span class="muted" style="font-size:12.5px">正在读取站点…</span>';
    var h = '<select id="' + name + '" name="' + name + '" data-keep="no" ' +
      'aria-label="这台预授权设备的站点">' +
      '<option value=""' + (cur ? "" : " selected") + ">不放到站点</option>";
    t.list.forEach(function (si) {
      h += '<option value="' + esc(si.id) + '"' + (si.id === cur ? " selected" : "") + ">" +
        esc(si.name) + "</option>";
    });
    return h + "</select>";
  }

  function paErr(slot, text) {
    var el = $(slot);
    if (el) { el.textContent = text; return; }
    var p = paStore();
    p.note = { kind: "bad", text: text };
    render();
  }

  function paApply(res, msg) {
    var p = paStore();
    p.loading = false;
    if (S.state && res && res.preauths) S.state.preauths = res.preauths;
    // 名额是记在授权上的：新建/撤销一条登记会立刻挪动 uses+reserved，
    // 不把它一起写回来，「入网授权」页和这里下拉框里的「已入网 x + 预授权 y」
    // 会一直停在写入前的旧数字。
    if (S.state && res && res.claims) S.state.claims = res.claims;
    // 站点上的预授权计数和地图上的「未上报」清单都会跟着变，作废缓存让下一帧
    // 重新取，不然页面上会出现一台根本不存在的设备。
    if (S.sites) S.sites.at = 0;
    undInvalidateTopo();
    if (msg) p.note = { kind: "", text: msg };
    blurContent();
    render();
  }

  function paFail(slot, err) {
    var p = paStore();
    p.loading = false;
    paErr(slot, err.message);
  }

  function paCreate(form) {
    var p = paStore();
    var f = new FormData(form);
    var body = {
      claim_id: String(f.get("pa-claim") || ""),
      name: String(f.get("pa-name") || "").trim(),
      serial: String(f.get("pa-serial") || "").trim(),
      site_id: String(f.get("pa-site") || "")
    };
    if (!body.claim_id) { paErr("pa-new-err", "先选一条入网授权：预授权要挂在它的名额里"); return; }
    if (!body.name) { paErr("pa-new-err", "设备名称是现场工程师要输入的索引，不能空"); return; }
    if (p.loading) return;
    p.loading = true;
    p.note = null;
    api("POST", "/api/preauth", body).then(function (res) {
      releaseForm(form);
      paApply(res, "已预授权「" + body.name + "」，占用该授权的一个名额。现在就能给它写基础配置；" +
        "盒子到货时现场多带一个参数 --preauth 「" + body.name + "」 认领。");
    }).catch(function (err) { paFail("pa-new-err", err); });
  }

  function paEditStart(id) {
    var p = paStore();
    if (p.edit && p.edit.id === id) { p.edit = null; render(); return; }
    var row = null;
    paRows(S.state).forEach(function (x) { if (x.id === id) row = x; });
    if (!row) return;
    p.edit = { id: row.id, name: row.name, serial: row.serial || "", site_id: row.site_id || "" };
    blurContent();
    render();
  }

  function paSaveEdit(form) {
    var p = paStore(), e = p.edit;
    if (!e) return;
    var f = new FormData(form);
    var body = {
      id: e.id,
      name: String(f.get("pa-e-name") || "").trim(),
      serial: String(f.get("pa-e-serial") || "").trim(),
      site_id: String(f.get("pa-e-site") || "")
    };
    if (!body.name) { paErr("pa-edit-err", "设备名称不能空"); return; }
    if (p.loading) return;
    p.loading = true;
    api("PUT", "/api/preauth", body).then(function (res) {
      p.edit = null;
      paApply(res, "预授权「" + body.name + "」已更新。");
    }).catch(function (err) { paFail("pa-edit-err", err); });
  }

  function paRevoke(id, name, nodeID) {
    var p = paStore();
    if (!confirm(nodeID
      ? "撤销「" + name + "」？它已经被 node-" + nodeID + " 认领：撤销只删掉这条登记，" +
        "设备和它的配置都不受影响。"
      : "撤销「" + name + "」？它在控制器里的配置草稿会一起删掉，并释放该授权的 1 个名额。")) return;
    p.loading = true;
    p.note = null;
    api("POST", "/api/preauth/revoke", { id: id }).then(function (res) {
      // 正在配置页编辑的就是这条：目标已经不在了，回到设备列表重建。
      if (S.cfg && S.cfg.pa === id) S.cfg = null;
      paApply(res, "已撤销预授权「" + name + "」。");
    }).catch(function (err) { paFail("", err); });
  }

  function undSetDoc(doc) {
    var u = undStore();
    u.doc = doc;
    u.at = nowSec();
    u.loading = false;
    if (!u.dirty) u.draft = undClone(doc.settings);
    undPruneSelection(doc);
    undInvalidateTopo();
    render();
  }

  function undSetField(el) {
    var u = S.und;
    if (!u || !u.draft) return;
    var path = el.getAttribute("data-und");
    var segs = path.split(".");
    var obj = u.draft;
    for (var i = 0; i < segs.length - 1; i++) obj = obj[segs[i]];
    var last = segs[segs.length - 1];
    if (el.getAttribute("data-und-num") === "true") {
      var raw = String(el.value || "").trim();
      var n = raw === "" ? 0 : Math.trunc(Number(raw));
      obj[last] = Number.isFinite(n) ? n : 0;
    } else {
      obj[last] = el.value;
    }
    u.dirty = true;
    var m = $("und-meta");
    if (m && u.doc) m.innerHTML = undMetaText(u, u.doc) + undDirtyMark(u);
  }

  function undMetaText(u, doc) {
    if (!doc.published) {
      if (doc.draft_at_unix) {
        return "草稿保存于 " + clock(doc.draft_at_unix) + (doc.draft_by ? " · " + doc.draft_by : "");
      }
      return "还没有发布过全局配置";
    }
    var s = "已发布于 " + clock(doc.published_at_unix) + (doc.published_by ? " · " + doc.published_by : "");
    if (doc.changes && doc.changes.length) s += " · 草稿有 " + doc.changes.length + " 项未发布改动";
    return s;
  }

  function undSummary(s) {
    if (!s) return "";
    return "VPN 端口池 " + s.vpn_ports.min + "-" + s.vpn_ports.max +
      " · 中转端口池 " + s.transit_ports.min + "-" + s.transit_ports.max +
      " · overlay " + s.overlay_cidr + " · 探针 " + s.probe_interval_ms + " ms";
  }

  function undCheckDraft(d) {
    var nums = [
      ["VPN 端口池起点", d.vpn_ports.min, true],
      ["VPN 端口池终点", d.vpn_ports.max, true],
      ["中转端口池起点", d.transit_ports.min, true],
      ["中转端口池终点", d.transit_ports.max, true],
      ["探针间隔", d.probe_interval_ms, false],
      ["BFD 最小发送间隔", d.bfd_min_tx_ms, false],
      ["BFD 最小接收间隔", d.bfd_min_rx_ms, false],
      ["BFD 检测倍数", d.bfd_detect_mult, false]
    ];
    for (var i = 0; i < nums.length; i++) {
      var v = Number(nums[i][1]);
      if (!Number.isFinite(v) || v <= 0) return nums[i][0] + "必须是大于 0 的整数";
      if (nums[i][2] && v > 65535) return nums[i][0] + "最大 65535";
    }
    if (!String(d.overlay_cidr || "").trim()) return "overlay 地址池不能为空";
    return "";
  }

  function undSave(quiet) {
    var u = S.und;
    if (!u || !u.doc || !u.draft) return Promise.reject(new Error("尚未读取配置"));
    var bad = undCheckDraft(u.draft);
    if (bad) {
      u.note = { kind: "bad", text: bad };
      render();
      return Promise.reject(new Error(bad));
    }
    return api("PUT", "/api/underlay/settings", u.draft).then(function (res) {
      u.doc = res.underlay;
      u.at = nowSec();
      u.draft = undClone(res.underlay.settings);
      u.dirty = false;
      u.note = { kind: "", text: "草稿已保存；发布之后才会成为设备的目标配置。" };
      if (!quiet) toast("草稿已保存");
      render();
    }).catch(function (err) {
      u.note = undErrNote(err);
      render();
      throw err;
    });
  }

  function undPublish() {
    var u = S.und;
    if (!u || !u.doc || !u.draft) return;
    function go() {
      if (!confirm("发布全局参数？\n\n" + undSummary(u.draft) +
        "\n\n发布后：这些参数成为设备的目标配置，并为每台已入网设备分配唯一的中转端口；" +
        "发布以后才入网的设备在入网时自动补分配，不需要重新发布。" +
        "已经分配的端口和 overlay /32 不会被移动；池子收窄到装不下已分配值时会拒绝发布。")) return;
      api("POST", "/api/underlay/settings/publish", {}).then(function (res) {
        u.doc = res.underlay;
        u.at = nowSec();
        u.draft = undClone(res.underlay.settings);
        u.dirty = false;
        u.note = { kind: "", text: "已发布全局配置" +
          (res.underlay.published_at_unix ? "（" + clock(res.underlay.published_at_unix) + "）" : "") +
          "；中转端口已分配给 " + res.underlay.usage.transit_assigned + " 台设备。" };
        undInvalidateTopo();
        toast("全局配置已发布");
        render();
      }).catch(function (err) {
        u.note = undErrNote(err);
        render();
      });
    }
    if (!u.dirty) { go(); return; }
    undSave(true).then(go).catch(function () { /* the failure is already shown */ });
  }

  function undReload() {
    var u = S.und;
    if (!u) return;
    if (u.dirty && !confirm("放弃未保存的改动并重新载入？")) return;
    u.dirty = false;
    u.note = null;
    u.auto = null;
    u.editTun = null;
    u.editPath = null;
    loadUnderlay();
  }

  function undAddAvoid() {
    var u = S.und;
    if (!u || !u.draft) return;
    var minEl = $("und-avoid-min"), maxEl = $("und-avoid-max");
    var lo = Math.trunc(Number(minEl && minEl.value));
    var hi = Math.trunc(Number(maxEl && maxEl.value));
    if (!Number.isFinite(lo) || !Number.isFinite(hi) || lo <= 0 || hi <= 0) {
      toast("填写排除段的起点和终点");
      return;
    }
    if (lo > hi) { toast("排除段起点不能大于终点"); return; }
    u.draft.vpn_avoid = (u.draft.vpn_avoid || []).concat([{ min: lo, max: hi }]);
    u.dirty = true;
    if (minEl) minEl.value = "";
    if (maxEl) maxEl.value = "";
    blurContent();
    render();
  }

  function undDelAvoid(i) {
    var u = S.und;
    if (!u || !u.draft || !u.draft.vpn_avoid) return;
    u.draft.vpn_avoid.splice(i, 1);
    u.dirty = true;
    blurContent();
    render();
  }

    var id = "und-" + path.replace(/\./g, "-");

      (text ? "" : ' data-und-num="true" min="1" step="1"') +

      '<div class="und-box"><h3>overlay 地址池与探测</h3><div class="fields">' +

      '<div class="addrow"><div class="field"><label for="und-avoid-min">起点</label>' +
      '<input id="und-avoid-min" type="number" min="1" max="65535" placeholder="如 22000"></div>' +

    var ch = doc.changes || [];

      h += '<div class="empty">还没有发布过全局配置：当前草稿是唯一的一份。</div>';
    } else if (!ch.length) {

    var list = doc.checks || [];
    var h = '<section class="panel"><header><h2>保存前的检查</h2>' +
      '<span class="muted" style="font-size:12.5px">按当前草稿计算</span></header>';
    if (!list.length) return h + '<div class="empty">没有发现问题。</div></section>';

      '<div class="usage">' +

  function undObservedCell(n) {
    if (!n.observed_addr) {
      if (n.udp_mapping) {
        return '<span class="mono">' + esc(n.udp_mapping) + '</span> <span class="tag stale">只有端口、无地址</span>';
      }
      return '<span class="tag pending">未上报</span>';
    }
    var h = '<span class="mono">' + esc(n.observed_addr) + "</span>";
    if (n.observed_stale) {
      h += ' <span class="tag stale">已过期' +
        (n.observed_age_sec > 0 ? " · " + esc(dur(n.observed_age_sec)) + "前" : "") + "</span>";
    } else if (n.observed_age_sec > 0) {
      h += ' <span class="muted">' + esc(dur(n.observed_age_sec)) + "前</span>";
    }
    if (n.symmetric_nat) h += ' <span class="tag plan">对称 NAT</span>';
