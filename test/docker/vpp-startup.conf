unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

api-trace {
  on
}

api-segment {
  gid vpp
}

socksvr {
  socket-name /run/vpp/api.sock
}

# 注：Docker 环境无巨页/无 DPDK 网卡，使用 tap 接口（host 接口）。
# dpdk 插件无需显式禁用：容器内无可绑定设备，插件加载后不会接管任何接口。
# plugin {} 段**没有**被移除（VPP 26.06 实测）：linux_cp_plugin 与 linux_nl_plugin
# 默认是 disabled，要用就必须显式开，写法是
#   plugins { plugin linux_cp_plugin { enable } plugin linux_nl_plugin { enable } }

cpu {
  main-core 0
}

buffers {
  buffers-per-numa 8192
  default data-size 2048
}
