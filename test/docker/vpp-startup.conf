unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

api-trace {
  on
}

api-segment {
  gid vpp
}

socksvr {
  socket-name /run/vpp/api.sock
}

# 注：Docker 环境无巨页/无 DPDK 网卡，使用 tap 接口（host 接口）。
# dpdk 插件无需显式禁用：容器内无可绑定设备，插件加载后不会接管任何接口。
#
# linux-cp / linux-nl（VPP 26.06 实测）：这两个插件默认 disabled，而且必须
# 带 .so 后缀才会被加载 —— 写成 `plugin linux_cp_plugin { enable }` 不报错，
# 插件也不会出现（CLI 里连 lcp 命令都没有）。linux-cp 把 VPP 接口镜像成宿主机
# 内核 TAP；linux-nl 监听 netlink，把**内核**路由/地址/邻居同步进 VPP。
# FRR 因此只算路由、不转发：它把 FIB 装进内核主表，linux-nl 镜像到 VPP table 0。
plugins {
  plugin linux_cp_plugin.so { enable }
  plugin linux_nl_plugin.so { enable }
}

cpu {
  main-core 0
}

buffers {
  buffers-per-numa 8192
  default data-size 2048
}
