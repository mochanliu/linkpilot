services:
  # 首节点 - VPN 隧道起点
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    image: srwg-dev:latest
    container_name: srwg-node1
    hostname: node1
    privileged: true
    tty: true
    stdin_open: true
    networks:
      net_a:
        ipv4_address: 10.10.1.2
      net_ctrl:
        ipv4_address: 10.10.0.2
    volumes:
      - ../../vpp-plugin:/workspace/vpp-plugin
      - ../../test:/workspace/test
      - ../../controller:/workspace/controller
      - node1_run:/run/vpp
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    sysctls:
      - net.ipv4.ip_forward=1

  # 中转节点 - 只转发不解密
  transit:
    build:
      context: .
      dockerfile: Dockerfile
    image: srwg-dev:latest
    container_name: srwg-transit
    hostname: transit
    privileged: true
    tty: true
    stdin_open: true
    networks:
      net_a:
        ipv4_address: 10.10.1.3
      net_b:
        ipv4_address: 10.10.2.3
      net_ctrl:
        ipv4_address: 10.10.0.3
    volumes:
      - ../../vpp-plugin:/workspace/vpp-plugin
      - ../../test:/workspace/test
      - ../../controller:/workspace/controller
      - transit_run:/run/vpp
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    sysctls:
      - net.ipv4.ip_forward=1

  # 末节点 - VPN 隧道终点
  node2:
    build:
      context: .
      dockerfile: Dockerfile
    image: srwg-dev:latest
    container_name: srwg-node2
    hostname: node2
    privileged: true
    tty: true
    stdin_open: true
    networks:
      net_b:
        ipv4_address: 10.10.2.2
      net_ctrl:
        ipv4_address: 10.10.0.4
    volumes:
      - ../../vpp-plugin:/workspace/vpp-plugin
      - ../../test:/workspace/test
      - ../../controller:/workspace/controller
      - node2_run:/run/vpp
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    sysctls:
      - net.ipv4.ip_forward=1

networks:
  # net_a / net_b 必须关掉网桥的 IP masquerade。
  # Docker 在 VM 里给每张桥都装了 MASQUERADE，并且 br_netfilter 让「二层转发」的
  # IP 报文也走 POSTROUTING：transit 的 VPP 明明原样保留外层源（step 7 用它自己的
  # trace 证明过），出桥时内核却把 10.10.1.2 改写成网桥网关 10.10.2.1。
  # WireGuard 的 endpoint roaming 于是把两端静态配的 peer endpoint 全部污染成网关
  # 地址（实测 node1 -> 10.10.1.1:<随机端口>），encap 的外层 dst 再也对不上绑定
  # 端点，整条 SR 路径静默旁路（Encap ok=0，overlay 0 回包），隧道时好时坏。
  # net_ctrl 保留 masquerade：容器编译时要装 python3-ply 等包，得留着出网通道。
  net_a:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.10.1.0/24
  net_b:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.10.2.0/24
  net_ctrl:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24

volumes:
  node1_run:
  transit_run:
  node2_run:
