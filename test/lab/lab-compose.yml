# 复杂 lab 的容器与网络定义（bringup.sh 负责所有配置）。
#
#   站点 N（1..3）。lab-cpeN + lab-frrN 是同一个盒子的两半（数据面 / 盒内 FRR），
#   实验里拆成两个容器：
#     lab-cpeN   10.88.1.1N(wan)   10.78.N.2(inN, 进 VPP table 250)   10.99.0.1N(mgmt)
#     lab-frrN                     10.78.N.20(inN)  10.68.N.2(lanN)   10.99.0.2N(mgmt)
#     lab-termN                                       10.68.N.10(lanN)  10.99.0.3N(mgmt)  # 客户终端
#   公共：lab-transit 10.88.1.3 / lab-rr 10.88.1.100 / lab-ctrl 10.88.1.200（都另有 mgmt 地址）
#
# 为什么 inside 用 .2 而不是 .1：docker 网桥自己占着子网的 .1，把 CPE 的 LAN
# 地址配成 .1 会让宿主机网桥抢答 ARP/ICMP，和 VPP 抢同一个身份。
#
# 所有数据面网络都关掉网桥 masquerade：WG 的 endpoint roaming 会把被 SNAT 过的
# 外层源写进 peer 的 endpoint，之后 encap 再也对不上绑定端点（见 test/docker/
# docker-compose.yml 里同一段注释与实测记录）。
name: sdwan-lab

x-cpe: &cpe
  image: srwg-dev:latest
  privileged: true
  tty: true
  stdin_open: true
  volumes:
    - ../../vpp-plugin:/workspace/vpp-plugin
    - ../../test:/workspace/test
    - ../../controller:/workspace/controller
  cap_add:
    - NET_ADMIN
    - SYS_NICE

x-term: &term
  image: srwg-dev:latest
  command: ["sleep", "infinity"]
  cap_add:
    - NET_RAW
    - NET_ADMIN   # 客户终端要能改自己的默认路由

x-frr: &frr
  image: quay.io/frrouting/frr:10.7.1
  cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_ADMIN
  sysctls:
    - net.ipv4.ip_forward=1

x-net-nomasq: &net-nomasq
  driver: bridge
  driver_opts:
    com.docker.network.bridge.enable_ip_masquerade: "false"

services:
  cpe1:
    <<: *cpe
    container_name: lab-cpe1
    hostname: lab-cpe1
    networks:
      lab_wan: { ipv4_address: 10.88.1.11 }
      lab_in1: { ipv4_address: 10.78.1.2 }
      lab_mgmt: { ipv4_address: 10.99.0.11 }

  cpe2:
    <<: *cpe
    container_name: lab-cpe2
    hostname: lab-cpe2
    networks:
      lab_wan: { ipv4_address: 10.88.1.12 }
      lab_in2: { ipv4_address: 10.78.2.2 }
      lab_mgmt: { ipv4_address: 10.99.0.12 }

  cpe3:
    <<: *cpe
    container_name: lab-cpe3
    hostname: lab-cpe3
    networks:
      lab_wan: { ipv4_address: 10.88.1.13 }
      lab_in3: { ipv4_address: 10.78.3.2 }
      lab_mgmt: { ipv4_address: 10.99.0.13 }

  transit:
    <<: *cpe
    container_name: lab-transit
    hostname: lab-transit
    networks:
      lab_wan: { ipv4_address: 10.88.1.3 }
      lab_mgmt: { ipv4_address: 10.99.0.3 }

  rr:
    <<: *cpe
    container_name: lab-rr
    hostname: lab-rr
    networks:
      lab_wan: { ipv4_address: 10.88.1.100 }
      lab_mgmt: { ipv4_address: 10.99.0.100 }

  ctrl:
    <<: *cpe
    container_name: lab-ctrl
    hostname: lab-ctrl
    networks:
      lab_wan: { ipv4_address: 10.88.1.200 }
      lab_mgmt: { ipv4_address: 10.99.0.200 }

  # FRR 的 frr.conf/daemons 由 bringup.sh 在容器起来后写进去再 restart。
  # 不用只读挂载：镜像的 docker-start 会对 /etc/frr 做属主处理，只读挂载会
  # 让这套初始化报错；而且 vtysh.conf 也要一起 touch。
  frr1:
    <<: *frr
    container_name: lab-frr1
    hostname: lab-frr1
    networks:
      lab_in1: { ipv4_address: 10.78.1.20 }
      lab_lan1: { ipv4_address: 10.68.1.2 }
      lab_mgmt: { ipv4_address: 10.99.0.21 }

  frr2:
    <<: *frr
    container_name: lab-frr2
    hostname: lab-frr2
    networks:
      lab_in2: { ipv4_address: 10.78.2.20 }
      lab_lan2: { ipv4_address: 10.68.2.2 }
      lab_mgmt: { ipv4_address: 10.99.0.22 }

  frr3:
    <<: *frr
    container_name: lab-frr3
    hostname: lab-frr3
    networks:
      lab_in3: { ipv4_address: 10.78.3.20 }
      lab_lan3: { ipv4_address: 10.68.3.2 }
      lab_mgmt: { ipv4_address: 10.99.0.23 }

  term1:
    <<: *term
    container_name: lab-term1
    hostname: lab-term1
    networks:
      lab_lan1: { ipv4_address: 10.68.1.10 }
      lab_mgmt: { ipv4_address: 10.99.0.31 }

  term2:
    <<: *term
    container_name: lab-term2
    hostname: lab-term2
    networks:
      lab_lan2: { ipv4_address: 10.68.2.10 }
      lab_mgmt: { ipv4_address: 10.99.0.32 }

  term3:
    <<: *term
    container_name: lab-term3
    hostname: lab-term3
    networks:
      lab_lan3: { ipv4_address: 10.68.3.10 }
      lab_mgmt: { ipv4_address: 10.99.0.33 }

networks:
  lab_wan:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.88.1.0/24
  lab_in1:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.78.1.0/24
  lab_in2:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.78.2.0/24
  lab_in3:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.78.3.0/24
  lab_lan1:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.68.1.0/24
  lab_lan2:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.68.2.0/24
  lab_lan3:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.68.3.0/24
  lab_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
