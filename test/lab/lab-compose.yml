# 复杂 lab 的容器与网络定义（bringup.sh 负责所有配置）。
#
#   盒子 = lab-cpeN（单容器，镜像 srwg-lab：VPP 26.06 + FRR 10.7.1 + 自研路由栈）
#     VPP 侧：WAN 10.88.1.1N / inside veth 10.78.N.2（table 250）/ wg0,wg1
#     内核侧：inside veth 10.78.N.20（盒内 FRR）/ xconn 10.79.N.2 / mgmt 10.99.0.1N
#
#   客户路由器 lab-custN（quay FRR，AS 6500N）
#     xconn 10.79.N.3 / LAN 10.68.N.2 / loopback 172.16.N.1/32 / mgmt 10.99.0.2N
#   客户终端 lab-termN：LAN 10.68.N.10 / mgmt 10.99.0.3N
#   公共：lab-transit 10.88.1.3 / lab-rr 10.88.1.100 / lab-ctrl 10.88.1.200
#
# 盒内 VPP 与盒内 FRR 之间的 inside 链路是一条容器内 veth（vti0/vti1），
# 由 bringup.sh 创建：vti0 留内核（10.78.N.20），vti1 交给 VPP（10.78.N.2）。
# 这样客户流量与路由协议都走同一个盒子的两半，正反向导入都能验。
#
# 为什么 inside 用 .2 而不是 .1：docker 网桥自己占着子网的 .1，把 CPE 的 LAN
# 地址配成 .1 会让宿主机网桥抢答 ARP/ICMP，和 VPP 抢同一个身份。
#
# 所有数据面网络都关掉网桥 masquerade：WG 的 endpoint roaming 会把被 SNAT 过的
# 外层源写进 peer 的 endpoint，之后 encap 再也对不上绑定端点（见 test/docker/
# docker-compose.yml 里同一段注释与实测记录）。BGP 也不能被 SNAT。
name: sdwan-lab

x-cpe: &cpe
  image: srwg-lab:latest
  privileged: true
  tty: true
  stdin_open: true
  volumes:
    - ../../vpp-plugin:/workspace/vpp-plugin
    - ../../test:/workspace/test
    - ../../controller:/workspace/controller
  cap_add:
    - NET_ADMIN
    - SYS_NICE
  sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.rp_filter=0

x-cust: &cust
  image: quay.io/frrouting/frr:10.7.1
  cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_ADMIN
  sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.rp_filter=0

x-term: &term
  image: srwg-lab:latest
  command: ["sleep", "infinity"]
  cap_add:
    - NET_RAW
    - NET_ADMIN   # 客户终端要能改自己的默认路由

x-net-nomasq: &net-nomasq
  driver: bridge
  driver_opts:
    com.docker.network.bridge.enable_ip_masquerade: "false"

services:
  cpe1:
    <<: *cpe
    container_name: lab-cpe1
    hostname: lab-cpe1
    networks:
      lab_wan: { ipv4_address: 10.88.1.11 }
      lab_xconn1: { ipv4_address: 10.79.1.2 }
      lab_mgmt: { ipv4_address: 10.99.0.11 }

  cpe2:
    <<: *cpe
    container_name: lab-cpe2
    hostname: lab-cpe2
    networks:
      lab_wan: { ipv4_address: 10.88.1.12 }
      lab_xconn2: { ipv4_address: 10.79.2.2 }
      lab_mgmt: { ipv4_address: 10.99.0.12 }

  cpe3:
    <<: *cpe
    container_name: lab-cpe3
    hostname: lab-cpe3
    networks:
      lab_wan: { ipv4_address: 10.88.1.13 }
      lab_xconn3: { ipv4_address: 10.79.3.2 }
      lab_mgmt: { ipv4_address: 10.99.0.13 }

  cust1:
    <<: *cust
    container_name: lab-cust1
    hostname: lab-cust1
    networks:
      lab_xconn1: { ipv4_address: 10.79.1.3 }
      lab_lan1: { ipv4_address: 10.68.1.2 }
      lab_mgmt: { ipv4_address: 10.99.0.21 }

  cust2:
    <<: *cust
    container_name: lab-cust2
    hostname: lab-cust2
    networks:
      lab_xconn2: { ipv4_address: 10.79.2.3 }
      lab_lan2: { ipv4_address: 10.68.2.2 }
      lab_mgmt: { ipv4_address: 10.99.0.22 }

  cust3:
    <<: *cust
    container_name: lab-cust3
    hostname: lab-cust3
    networks:
      lab_xconn3: { ipv4_address: 10.79.3.3 }
      lab_lan3: { ipv4_address: 10.68.3.2 }
      lab_mgmt: { ipv4_address: 10.99.0.23 }

  term1:
    <<: *term
    container_name: lab-term1
    hostname: lab-term1
    networks:
      lab_lan1: { ipv4_address: 10.68.1.10 }
      lab_mgmt: { ipv4_address: 10.99.0.31 }

  term2:
    <<: *term
    container_name: lab-term2
    hostname: lab-term2
    networks:
      lab_lan2: { ipv4_address: 10.68.2.10 }
      lab_mgmt: { ipv4_address: 10.99.0.32 }

  term3:
    <<: *term
    container_name: lab-term3
    hostname: lab-term3
    networks:
      lab_lan3: { ipv4_address: 10.68.3.10 }
      lab_mgmt: { ipv4_address: 10.99.0.33 }

  transit:
    <<: *cpe
    container_name: lab-transit
    hostname: lab-transit
    networks:
      lab_wan: { ipv4_address: 10.88.1.3 }
      lab_mgmt: { ipv4_address: 10.99.0.3 }

  rr:
    <<: *cpe
    container_name: lab-rr
    hostname: lab-rr
    networks:
      lab_wan: { ipv4_address: 10.88.1.100 }
      lab_mgmt: { ipv4_address: 10.99.0.100 }

  ctrl:
    <<: *cpe
    container_name: lab-ctrl
    hostname: lab-ctrl
    networks:
      lab_wan: { ipv4_address: 10.88.1.200 }
      lab_mgmt: { ipv4_address: 10.99.0.200 }

networks:
  lab_wan:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.88.1.0/24
  lab_xconn1:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.79.1.0/24
  lab_xconn2:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.79.2.0/24
  lab_xconn3:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.79.3.0/24
  lab_lan1:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.68.1.0/24
  lab_lan2:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.68.2.0/24
  lab_lan3:
    <<: *net-nomasq
    ipam:
      config:
        - subnet: 10.68.3.0/24
  lab_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
